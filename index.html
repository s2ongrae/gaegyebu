<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏦 보험 고객 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F6FB;--surface:#FFF;--surface2:#F0F2F8;--border:#E2E6EF;
  --text:#1A1D2E;--muted:#6B7280;--hint:#9CA3AF;
  --blue:#3B5BDB;--blue-l:#EEF2FF;
  --green:#0D9466;--green-l:#ECFDF5;
  --red:#DC2626;--red-l:#FEF2F2;
  --amber:#D97706;--amber-l:#FFFBEB;
  --purple:#7C3AED;
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

/* Header */
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--shadow)}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{font-size:15px;font-weight:700;letter-spacing:-.3px}
.hdr-logo span{color:var(--blue)}
.hdr-right{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#2f4ac5}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--red-l);color:var(--red);border:1px solid #fecaca}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:4px 10px;font-size:12px}

/* Main */
.main{max-width:1280px;margin:0 auto;padding:20px 16px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;border-top:3px solid transparent}
.kpi.blue{border-top-color:var(--blue)}.kpi.green{border-top-color:var(--green)}
.kpi.red{border-top-color:var(--red)}.kpi.amber{border-top-color:var(--amber)}
.kpi.purple{border-top-color:var(--purple)}
.kpi-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-val{font-size:22px;font-weight:700;letter-spacing:-1px}
.kpi-sub{font-size:11px;color:var(--hint);margin-top:3px}

/* Tabs */
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:16px;width:fit-content}
.tab{padding:7px 18px;border-radius:7px;border:none;background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 1px 4px rgba(59,91,219,.3)}
.pane{display:none}.pane.on{display:block}

/* Controls */
.ctrl{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search-w{position:relative;flex:1;min-width:180px}
.search-w input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);outline:none;transition:border .15s}
.search-w input:focus{border-color:var(--blue)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--hint);pointer-events:none}
select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);cursor:pointer;outline:none}
select:focus{border-color:var(--blue)}
.cnt{font-size:12px;color:var(--muted);margin-bottom:8px}

/* Table */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface2);padding:10px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;position:sticky;top:0}
thead th:hover{color:var(--text)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td{padding:9px 12px;white-space:nowrap;vertical-align:middle}
.td-act{padding:6px 12px;text-align:right;white-space:nowrap}

/* Badges */
.b-done{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--green-l);color:var(--green)}
.b-cancel{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--red-l);color:var(--red)}
.b-pending{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--amber-l);color:var(--amber)}
.gbadge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px}

/* Group cards */
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.gheader{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;transition:background .1s;user-select:none}
.gheader:hover{background:var(--surface2)}
.gdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.gname{font-weight:600;font-size:14px;flex:1}
.gmeta{font-size:12px;color:var(--muted)}
.gamt{font-size:13px;font-weight:700;margin-left:8px}
.garr{font-size:11px;color:var(--hint);transition:transform .2s}
.gtbl{display:none;border-top:1px solid var(--border)}

/* Monthly tab */
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:20px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.mcard-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mcard-month{font-size:15px;font-weight:700}
.mcard-cnt{font-size:12px;color:var(--muted)}
.mcard-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)}
.mcard-row:last-child{border:none;font-weight:600}
.mcard-lbl{color:var(--muted)}
.mcard-val{font-weight:500;text-align:right}

/* Charts */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.chart-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.modal-title{font-size:16px;font-weight:700}
.modal-close{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;line-height:1}
.modal-close:hover{background:var(--surface2)}
.modal-body{padding:16px 20px 20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field.full{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=number],select.form-sel,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);outline:none;transition:border .15s;font-family:inherit}
input[type=text]:focus,input[type=number]:focus,select.form-sel:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,91,219,.1)}
.form-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}

/* Monthly income modal */
.income-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* Stats cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface2);border-radius:8px;padding:12px 14px}
.stat-l{font-size:11px;color:var(--muted);margin-bottom:3px}
.stat-v{font-size:14px;font-weight:700}

@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)};.form-grid{grid-template-columns:1fr};.income-grid{grid-template-columns:1fr 1fr}}
@media(max-width:400px){.kpi-grid{grid-template-columns:1fr}}

.cov-grid{display:grid;grid-template-columns:220px 1fr;gap:16px}
.cov-left{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:fit-content}
.cov-cust{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;transition:background .1s;font-size:13px}
.cov-cust:hover{background:var(--surface2)}
.cov-cust.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.cov-cust-cnt{font-size:11px;color:var(--hint)}
.cov-right{flex:1}
.cov-policy{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.cov-policy-hdr{padding:12px 14px;background:var(--surface2);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.cov-item-row{display:grid;grid-template-columns:1fr 100px 80px 32px;gap:6px;padding:6px 14px;border-bottom:1px dashed var(--border);align-items:center;font-size:13px}
.cov-item-row:last-child{border:none}
.cov-input{width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--surface);outline:none}
.cov-input:focus{border-color:var(--blue)}
.total-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.total-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;border-left:4px solid transparent}
.total-card .tc-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.total-card .tc-val{font-size:18px;font-weight:700;color:var(--text)}
.total-card .tc-sub{font-size:11px;color:var(--hint);margin-top:2px}
.api-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--amber-l);border:1px solid #FDE68A;border-radius:var(--radius);margin-bottom:14px;font-size:12px}
@media(max-width:700px){.cov-grid{grid-template-columns:1fr}}

/* 고객 전용 화면 */
.cv-wrap{max-width:480px;margin:0 auto;padding:0 0 40px}
.cv-header{background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;padding:24px 20px 28px;text-align:center}
.cv-policy{background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin:0 16px 12px;overflow:hidden}
.cv-policy-hdr{padding:12px 14px;background:#F8FAFC;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;gap:8px}
.cv-item{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px dashed #E2E8F0;font-size:13px}
.cv-item:last-child{border:none}
.cv-total{background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin:0 16px 12px;padding:16px}
.cv-total-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #E2E8F0;font-size:13px}
.cv-total-row:last-child{border:none;font-weight:700;font-size:14px}
</style>

<!-- 잠금 화면 -->
<div id="lock-screen" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#0F172A 0%,#1E3A8A 100%);z-index:9999;align-items:center;justify-content:center;flex-direction:column">
  <div style="text-align:center;color:#fff;padding:40px 24px;width:100%;max-width:360px">
    <div style="font-size:48px;margin-bottom:16px">🏦</div>
    <div style="font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px">보험 고객 관리</div>
    <div style="font-size:13px;opacity:.6;margin-bottom:40px">김성래 설계사 전용</div>

    <!-- PIN 표시 -->
    <div style="display:flex;justify-content:center;gap:14px;margin-bottom:32px" id="pin-dots">
      <div class="pdot"></div><div class="pdot"></div><div class="pdot"></div><div class="pdot"></div>
    </div>

    <!-- 오류 메시지 -->
    <div id="pin-error" style="font-size:13px;color:#F87171;height:18px;margin-bottom:16px;transition:opacity .2s"></div>

    <!-- 숫자 패드 -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto">
      <button class="pkey" onclick="pinPress('1')">1</button>
      <button class="pkey" onclick="pinPress('2')">2</button>
      <button class="pkey" onclick="pinPress('3')">3</button>
      <button class="pkey" onclick="pinPress('4')">4</button>
      <button class="pkey" onclick="pinPress('5')">5</button>
      <button class="pkey" onclick="pinPress('6')">6</button>
      <button class="pkey" onclick="pinPress('7')">7</button>
      <button class="pkey" onclick="pinPress('8')">8</button>
      <button class="pkey" onclick="pinPress('9')">9</button>
      <div></div>
      <button class="pkey" onclick="pinPress('0')">0</button>
      <button class="pkey pkey-del" onclick="pinDel()">⌫</button>
    </div>
  </div>
</div>

<style>
.pdot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .15s}
.pdot.on{background:#60A5FA;transform:scale(1.15)}
.pkey{padding:18px;border-radius:14px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:22px;font-weight:600;cursor:pointer;transition:all .15s;backdrop-filter:blur(4px)}
.pkey:hover{background:rgba(255,255,255,.2)}
.pkey:active{transform:scale(.93);background:rgba(96,165,250,.4)}
.pkey-del{font-size:18px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .35s ease}
</style>

<script>
const CORRECT_PIN = '9644';
let pinInput = '';

function showLock() {
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('app-wrap').style.display = 'none';
}
function unlock() {
  sessionStorage.setItem('ins_unlocked', '1');
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'block';
}

function pinPress(n) {
  if(pinInput.length >= 4) return;
  pinInput += n;
  updateDots();
  if(pinInput.length === 4) {
    setTimeout(() => {
      if(pinInput === CORRECT_PIN) {
        unlock();
      } else {
        const dots = document.getElementById('pin-dots');
        dots.classList.add('shake');
        document.getElementById('pin-error').textContent = '비밀번호가 틀렸습니다';
        setTimeout(() => { dots.classList.remove('shake'); pinInput=''; updateDots(); document.getElementById('pin-error').textContent=''; }, 600);
      }
    }, 100);
  }
}
function pinDel() {
  pinInput = pinInput.slice(0,-1);
  updateDots();
  document.getElementById('pin-error').textContent = '';
}
function updateDots() {
  document.querySelectorAll('.pdot').forEach((d,i) => {
    d.classList.toggle('on', i < pinInput.length);
  });
}

// 키보드 지원
document.addEventListener('keydown', e => {
  if(document.getElementById('lock-screen').style.display==='none') return;
  if(e.key>='0'&&e.key<='9') pinPress(e.key);
  if(e.key==='Backspace') pinDel();
});

// 초기 잠금 체크
// 고객 링크면 PIN 완전 스킵
const _viewHash = window.location.hash;
if(_viewHash.startsWith('#view=')) {
  document.getElementById('lock-screen').style.display = 'none';
  // app-wrap은 2번째 스크립트에서 처리
} else if(sessionStorage.getItem('ins_unlocked')==='1') {
  document.getElementById('lock-screen').style.display = 'none';
  // app-wrap은 2번째 스크립트 init에서 처리
} else {
  showLock();
}
</script>

</head>
<body>

<div id="app-wrap" style="display:none">
<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-logo">🏦 <span>보험 고객 관리</span></div>
    <span style="font-size:11px;color:var(--hint);background:var(--surface2);padding:2px 8px;border-radius:20px">김성래</span>
    <span id="sync-status" style="margin-left:4px"><span style="color:var(--muted);font-size:12px">☁️ 연결 중...</span></span>
  </div>
  <div class="hdr-right">
    <button class="btn btn-secondary" onclick="manualSync()" title="지금 즉시 저장">🔄 동기화</button>
    <button class="btn btn-secondary" onclick="exportData()" title="데이터 백업">💾 백업</button>
    <label class="btn btn-secondary" title="백업 파일 불러오기" style="cursor:pointer;margin:0">
      📂 복원
      <input type="file" accept=".json" onchange="importData(event)" style="display:none">
    </label>
    <button class="btn btn-secondary" onclick="openIncomeModal()">💰 월 수입 입력</button>
    <button class="btn btn-primary" onclick="openAddModal()">＋ 계약 추가</button>
  </div>
</div>

<div class="main">
  <div class="kpi-grid" id="kpis"></div>
  <div class="tabs">
    <button class="tab on" onclick="switchTab('리스트',this)">📋 계약 리스트</button>
    <button class="tab" onclick="switchTab('그룹별',this)">👥 그룹별</button>
    <button class="tab" onclick="switchTab('고객별',this)">👤 고객별</button>
    <button class="tab" onclick="switchTab('월별',this)">📊 월별 실적</button>
    <button class="tab" onclick="switchTab('보장분석',this)">📋 보장 분석</button>
  </div>
  <div id="pane-리스트" class="pane on"></div>
  <div id="pane-그룹별" class="pane"></div>
  <div id="pane-고객별" class="pane"></div>
  <div id="pane-월별" class="pane"></div>
  <div id="pane-보장분석" class="pane"></div>
</div>

<!-- 보장 그룹 편집 모달 -->
<div class="overlay" id="modal-covgroups">
<div class="modal" style="max-width:620px">
  <div class="modal-header">
    <div class="modal-title">⚙️ 보장 그룹 설정</div>
    <button class="modal-close" onclick="closeModal('covgroups')">✕</button>
  </div>
  <div class="modal-body">
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px">그룹 이름·키워드를 수정하거나 순서를 바꿀 수 있어요. 키워드는 쉼표로 구분하세요.</p>
    <div id="cov-group-list"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-secondary btn-sm" onclick="addCovGroup()">＋ 그룹 추가</button>
      <button class="btn btn-secondary btn-sm" onclick="resetCovGroups()" style="color:var(--red)">🔄 기본값으로</button>
    </div>
    <div class="form-btns">
      <button class="btn btn-secondary" onclick="closeModal('covgroups')">취소</button>
      <button class="btn btn-primary" onclick="saveCovGroupsUI()">저장</button>
    </div>
  </div>
</div>
</div>

<!-- 계약 추가/수정 모달 -->
<div class="overlay" id="modal-contract">
<div class="modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-title">새 계약 추가</div>
    <button class="modal-close" onclick="closeModal('contract')">✕</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="edit-id">
    <div class="form-grid">
      <div class="form-field">
        <label>상태</label>
        <select class="form-sel" id="f-status">
          <option value="계약완료">계약완료</option>
          <option value="가입 예정">가입 예정</option>
          <option value="계약해지">계약해지</option>
        </select>
      </div>
      <div class="form-field">
        <label>가입일 (YY.MM.DD)</label>

        <label>계약자</label>
        <input type="text" id="f-holder" placeholder="계약자 이름">

      </div>

        <label>보험명</label>

      </div>

          </div>
        </div>
      </div>

      </div>

      <button class="btn btn-secondary" onclick="closeModal('contract')">취소</button>

      <button class="btn btn-primary" onclick="saveContract()">저장</button>
    </div>
  </div>
</div>

let cloudStatus = 'idle'; // idle | syncing | ok | error
let lastSyncedAt = null;
let syncTimer = null;

function setSyncStatus(status, msg) {
  cloudStatus = status;
  const el = document.getElementById('sync-status');
  if(!el) return;
  const icons = {idle:'☁️', syncing:'🔄', ok:'✅', error:'❌'};
  const colors = {idle:'var(--muted)', syncing:'var(--amber)', ok:'var(--green)', error:'var(--red)'};
  el.innerHTML = `<span style="color:${colors[status]};font-size:12px;font-weight:500">${icons[status]} ${msg}</span>`;
}

async function saveToCloud(data) {
  setSyncStatus('syncing', '저장 중...');
  try {
    const res = await fetch(CLOUD_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify(data),
    });
    const json = await res.json();
    if(json.success) {
      lastSyncedAt = new Date();
      setSyncStatus('ok', `저장됨 ${lastSyncedAt.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'})}`);
    } else {
      setSyncStatus('error', '저장 실패');
    }
  } catch(e) {
    setSyncStatus('error', '연결 오류');
  }
}

async function loadFromCloud() {
  setSyncStatus('syncing', '불러오는 중...');
  try {
    const res = await fetch(CLOUD_URL + '?t=' + Date.now());
    const data = await res.json();
    if(data.error || !data.contracts) {
      setSyncStatus('idle', '로컬 데이터 사용 중');
      return false;
    }
    if(data.contracts.length === 0 && CONTRACTS.length > 0) {
      // 클라우드가 비어있으면 로컬 데이터 업로드
      const all = {contracts:CONTRACTS,monthly:MONTHLY,groups:GROUPS,version:1};
      saveToCloud(all);
      setSyncStatus('ok', '초기 업로드 완료');
      return false;
    }
    // 클라우드 데이터로 교체
    CONTRACTS = data.contracts;
    MONTHLY   = data.monthly   || MONTHLY;
    GROUPS    = data.groups    || GROUPS;
    nextId    = Math.max(...CONTRACTS.map(c=>c.id||0), 0) + 1;
    save('ins_contracts', CONTRACTS);
    save('ins_monthly',   MONTHLY);
    save('ins_groups',    GROUPS);
    lastSyncedAt = new Date();
    setSyncStatus('ok', `불러옴 ${lastSyncedAt.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'})}`);
    return true;
  } catch(e) {
    setSyncStatus('error', '연결 실패 — 로컬 사용 중');
    return false;
  }
}

function manualSync() {
  const all = {contracts:CONTRACTS, monthly:MONTHLY, groups:GROUPS, coverages:COVERAGES, version:1, savedAt:new Date().toISOString()};
  save('ins_contracts', CONTRACTS);
  save('ins_monthly',   MONTHLY);
  save('ins_groups',    GROUPS);
  setSyncStatus('syncing', '동기화 중...');
  fetch(CLOUD_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(all),
  })
  .then(r=>r.json())
  .then(json=>{
    if(json.success){
      const t=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      setSyncStatus('ok','저장됨 '+t);
      showToast('✅ 동기화 완료! 구글 드라이브에 저장됐어요');
    } else {
      setSyncStatus('error','동기화 실패');
      showToast('❌ 동기화 실패 — 다시 시도해주세요');
    }
  })
  .catch(()=>{
    setSyncStatus('error','연결 오류');
    showToast('❌ 연결 오류 — 인터넷을 확인해주세요');
  });
}

function scheduleSave() {
  // 연속 입력 시 1.5초 후 한 번만 저장
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    const all = {contracts:CONTRACTS, monthly:MONTHLY, groups:GROUPS, coverages:COVERAGES, version:1, savedAt:new Date().toISOString()};
    save('ins_contracts', CONTRACTS);
    save('ins_monthly',   MONTHLY);
    save('ins_groups',    GROUPS);
    saveToCloud(all);
  }, 1500);
}

function load(key, def){ try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(e){return def;} }
function save(key,val){ try{localStorage.setItem(key,JSON.stringify(val));}catch(e){} }

const won = n => (n||0).toLocaleString('ko-KR') + '원';
const wonN = n => (n||0).toLocaleString('ko-KR');
const wonAxis = n => {
  if(n>=10000000) return (n/10000000).toFixed(1)+'천만';
  if(n>=1000000) return (n/10000).toFixed(0)+'만';
  if(n>=10000) return (n/10000).toFixed(1)+'만';
  return n;
};
const gc = g => GROUPS[g] || '#868E96';
const gbadge = g => `<span class="gbadge" style="background:${gc(g)}18;color:${gc(g)}">${g}</span>`;
const sbadge = s => s==='계약완료'?`<span class="b-done">✓ 완료</span>`:s==='가입 예정'?`<span class="b-pending">⏳ 예정</span>`:`<span class="b-cancel">✕ 해지</span>`;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function renderKPIs() {
  const active  = CONTRACTS.filter(r=>r.s==='계약완료');
  const pending = CONTRACTS.filter(r=>r.s==='가입 예정');
  const cancel  = CONTRACTS.filter(r=>r.s==='계약해지');
  const amt     = active.reduce((s,r)=>s+r.pr,0);
  document.getElementById('kpis').innerHTML = [
    ['blue','총 계약',active.length+cancel.length+'건','예정 제외'],
    ['green','계약 완료',active.length+'건','현재 유지 중'],
    ['red','계약 해지',cancel.length+'건','해지된 계약'],
    ['amber','가입 예정',pending.length+'건','진행 예정'],
    ['purple','월 보험료',wonN(amt)+'원','연 '+wonN(amt*12)+'원'],
  ].map(([cls,l,v,sub])=>`<div class="kpi ${cls}"><div class="kpi-label">${l}</div><div class="kpi-val">${v}</div><div class="kpi-sub">${sub}</div></div>`).join('');
}

function toggleFilter(type, val) {
  const map={status:fStatus,groups:fGroups,months:fMonths,cos:fCos};
  const s=map[type];
  if(s.has(val)) s.delete(val); else s.add(val);
  renderList();
}

function removeOneFilter(val){
  [fStatus,fGroups,fMonths,fCos].forEach(s=>s.delete(val));

}
function srt(k){sortK===k?sortD*=-1:(sortK=k,sortD=-1);renderList();}

let openG = null;
function renderGroups() {
  const gm = {};
  CONTRACTS.forEach(r=>{
    if(!gm[r.g])gm[r.g]={k:0,amt:0,cancel:0,pending:0,nc:new Set()};
    if(r.s==='계약완료'){gm[r.g].k++;gm[r.g].amt+=r.pr;}
    else if(r.s==='계약해지')gm[r.g].cancel++;
    else gm[r.g].pending++;
    gm[r.g].nc.add(r.c);
  });
  const gs = Object.entries(gm).map(([g,v])=>({g,...v,nc:v.nc.size})).sort((a,b)=>b.amt-a.amt);
  document.getElementById('pane-그룹별').innerHTML = gs.map(g=>{
    const id=g.g.replace(/[\s()]/g,'_');
    const rows=CONTRACTS.filter(r=>r.g===g.g).sort((a,b)=>a.c.localeCompare(b.c));
    const meta=[`${g.nc}명`,`${g.k}건 완료`,g.cancel?`${g.cancel}건 해지`:'',g.pending?`${g.pending}건 예정`:''].filter(Boolean).join(' · ');
    return `<div class="gcard">
      <div class="gheader" onclick="toggleG('${id}')">
        <div class="gdot" style="background:${gc(g.g)}"></div>
        <span class="gname">${g.g}</span>
        <span class="gmeta">${meta}</span>
        <span class="gamt" style="color:${gc(g.g)}">${wonN(g.amt)}원/월</span>
        <span class="garr" id="arr-${id}">▼</span>
      </div>
      <div class="gtbl" id="gt-${id}">
        <table>
          <thead><tr>${['계약자','가입자','가입일','보험회사','보험명','월보험료','상태',''].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(r=>`<tr>
            <td style="font-weight:600">${r.c}</td>
            <td style="color:var(--muted)">${r.p}</td>
            <td style="color:var(--muted);font-size:12px">${r.d}</td>
            <td>${r.co}</td><td>${r.n}</td>
            <td style="text-align:right">${wonN(r.pr)}</td>
            <td>${sbadge(r.s)}</td>
            <td class="td-act"><button class="btn btn-secondary btn-sm" onclick="openEditModal(${r.id})">✏️</button></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}
function toggleG(id){
  const t=document.getElementById('gt-'+id),a=document.getElementById('arr-'+id);
  if(t.style.display==='table'){t.style.display='none';a.textContent='▼';}
  else{t.style.display='table';a.textContent='▲';}
}

        <td style="text-align:right;color:var(--muted)">${wonN(c.amt*12)}</td>
        <td style="color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.rows.filter(r=>r.s==='계약완료').map(r=>r.n).slice(0,4).join(' · ')}${c.rows.length>4?' …':''}</td>
      </tr>`;

      const detailRow=exp?`<tr style="background:#EFF6FF">
        <td colspan="7" style="padding:0">
          <div style="padding:12px 16px 16px;border-top:1px dashed var(--border)">
            <div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:8px">📋 ${c.c}님의 전체 계약 현황 (${c.rows.length}건)</div>
            <table style="width:100%;font-size:12px;border-collapse:collapse">
              <thead><tr style="background:var(--surface2)">
                ${['가입일','상태','보험회사','보험명','월보험료',''].map(h=>`<th style="padding:6px 10px;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap">${h}</th>`).join('')}
              </tr></thead>
              <tbody>${c.rows.sort((a,b)=>a.d.localeCompare(b.d)).map((r,ri)=>`
                <tr style="border-bottom:1px dashed var(--border);background:${ri%2?'#F8FAFF':'#fff'}">
                  <td style="padding:7px 10px;color:var(--muted);white-space:nowrap">${r.d}</td>
                  <td style="padding:7px 10px">${sbadge(r.s)}</td>
                  <td style="padding:7px 10px;white-space:nowrap">${r.co}</td>
                  <td style="padding:7px 10px;white-space:nowrap;font-weight:500">${r.n}</td>
                  <td style="padding:7px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">${wonN(r.pr)}원</td>
                  <td style="padding:7px 10px;text-align:right">
                    <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openEditModal(${r.id})">✏️</button>
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>
            <div style="margin-top:10px;padding:10px 12px;background:var(--blue-l);border-radius:8px;display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:12px;color:var(--blue)">월 합계 보험료</span>
              <span style="font-size:14px;font-weight:700;color:var(--blue)">${wonN(c.amt)}원 / 연 ${wonN(c.amt*12)}원</span>
            </div>
          </div>
        </td>
      </tr>`:'';

      return summaryRow+detailRow;
    }).join('')}</tbody>
    </table></div>`;
  } catch(e) {
    console.error('renderCustomers:', e);
    document.getElementById('pane-고객별').innerHTML=`<div style="padding:30px;color:var(--red)">⚠️ 오류: ${e.message}</div>`;

function toggleMonthDetail(m) {
  expandedMonth = expandedMonth === m ? null : m;
  renderMonthly();
}

function renderMonthly() {
  try {
  // 빈 달 채우기: 마지막 달 ~ 현재+3개월
  const now2 = new Date();
  const displayMonths = [...MONTHLY];
  const lastM2 = displayMonths.length ? displayMonths.map(x=>x.m).sort().pop() : '24.07';
  const [ly2,lm2] = lastM2.split('.').map(Number);
  let cur2 = new Date(2000+ly2, lm2-1, 1);
  cur2.setMonth(cur2.getMonth()+1);
  const endDate2 = new Date(now2.getFullYear(), now2.getMonth()+4, 1);
  while(cur2 < endDate2){
    const ms2 = `${String(cur2.getFullYear()).slice(2)}.${String(cur2.getMonth()+1).padStart(2,'0')}`;
    if(!displayMonths.find(x=>x.m===ms2)){
      displayMonths.push({m:ms2,k:0,before:0,after:0,tax:0,memo:''});
    }
    cur2.setMonth(cur2.getMonth()+1);
  }
  displayMonths.sort((a,b)=>b.m.localeCompare(a.m));
  const kByMonth = {};
  CONTRACTS.filter(r=>r.s==='계약완료').forEach(r=>{
    const m = r.d ? r.d.slice(0,5) : '';
    if(m) kByMonth[m] = (kByMonth[m]||0)+1;
  });

  // 월별 계약금액 집계
  const amtByMonth = {};
  CONTRACTS.filter(r=>r.s==='계약완료').forEach(r=>{
    const m = r.d ? r.d.slice(0,5) : '';
    if(m) amtByMonth[m] = (amtByMonth[m]||0) + r.pr;
  });
  const maxAfter = Math.max(...MONTHLY.filter(m=>m.after>0).map(m=>m.after), 1);

  // Bar chart SVG
  const BW=680,BH=180,PL=58,PR=8,PT=22,PB=30;
  const bw=(BW-PL-PR)/MONTHLY.length;
  const maxK2=Math.max(...MONTHLY.map(m=>kByMonth[m.m]||m.k||0),1);
  const yticks=[0,5,10,15,20,25,30].filter(v=>v<=maxK2+3);
  const barSVG=`<svg viewBox="0 0 ${BW} ${BH}" style="width:100%;display:block">
    ${yticks.map(v=>{const y=PT+(BH-PT-PB)*(1-v/maxK2);return`<line x1="${PL}" y1="${y}" x2="${BW-PR}" y2="${y}" stroke="#E2E6EF" stroke-width="1"/><text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#9CA3AF">${v}건</text>`;}).join('')}
    ${MONTHLY.map((m,i)=>{
      const kv=kByMonth[m.m]||m.k||0;
      const ch=BH-PT-PB;const bh=maxK2>0?Math.max(kv>0?3:0,Math.round((kv/maxK2)*ch)):0;
      const bx=PL+i*bw+(bw-bw*.65)/2;const by=PT+ch-bh;
      const col=kv>=20?'#3B5BDB':kv>=10?'#748FFC':'#BAC8FF';
      return`${kv>0?`<rect x="${bx}" y="${by}" width="${bw*.65}" height="${bh}" rx="3" fill="${col}"/><text x="${bx+bw*.65/2}" y="${by-5}" text-anchor="middle" font-size="10" fill="${col}" font-weight="600">${kv}</text>`:''}
      <text x="${PL+i*bw+bw/2}" y="${BH-6}" text-anchor="middle" font-size="9" fill="#9CA3AF">${m.m}</text>`;
    }).join('')}
  </svg>`;

  // Line chart
  const incl=MONTHLY.filter(m=>m.after>0);
  const LW=680,LH=180,LP=72,LR=10,LT=16,LB=30;
  const cw=LW-LP-LR,ch2=LH-LT-LB;
  const xStep=incl.length>1?cw/(incl.length-1):cw;
  const pts=incl.map((m,i)=>({x:LP+i*xStep,y:LT+ch2*(1-m.after/maxAfter)}));
  const pathD=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(' ');
  const lineSVG=incl.length>0?`<svg viewBox="0 0 ${LW} ${LH}" style="width:100%;display:block">
    <defs><linearGradient id="lg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0D9466" stop-opacity=".15"/><stop offset="100%" stop-color="#0D9466" stop-opacity="0"/></linearGradient></defs>
    ${Array.from({length:5},(_,i)=>{const v=Math.round(maxAfter*(i/4));const y=LT+ch2*(1-i/4);return`<line x1="${LP}" y1="${y}" x2="${LW-LR}" y2="${y}" stroke="#E2E6EF" stroke-width="1"/><text x="${LP-6}" y="${y+4}" text-anchor="end" font-size="9" fill="#9CA3AF">${wonAxis(v)}</text>`;}).join('')}
    <path d="${pathD} L${pts[pts.length-1].x},${LT+ch2} L${LP},${LT+ch2} Z" fill="url(#lg3)"/>
    <path d="${pathD}" fill="none" stroke="#0D9466" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#0D9466" stroke="white" stroke-width="1.5"><title>${incl[i].m}: ${won(incl[i].after)}</title></circle>`).join('')}
    ${incl.filter((_,i)=>i%3===0||i===incl.length-1).map((m,_,arr,idx=incl.indexOf(m))=>`<text x="${pts[idx].x}" y="${LH-6}" text-anchor="middle" font-size="9" fill="#9CA3AF">${m.m}</text>`).join('')}
  </svg>`:'<div style="text-align:center;padding:40px;color:var(--hint)">수입 데이터 없음</div>';

  const totalAfter=MONTHLY.reduce((s,m)=>s+m.after,0);
  const avgAfter=incl.length>0?Math.round(incl.reduce((s,m)=>s+m.after,0)/incl.length):0;
  const maxIncM=incl.length>0?incl.reduce((a,b)=>b.after>a.after?b:a):{m:'-',after:0};
  const maxKM=MONTHLY.reduce((a,b)=>(kByMonth[b.m]||b.k)>(kByMonth[a.m]||a.k)?b:a,MONTHLY[0]);

  document.getElementById('pane-월별').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="chart-wrap"><div class="chart-title">월별 신규 가입 건수</div>${barSVG}</div>
      <div class="chart-wrap"><div class="chart-title">월별 세후 수입 추이</div>${lineSVG}</div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-l">누적 세후 수입</div><div class="stat-v">${won(totalAfter)}</div></div>
      <div class="stat"><div class="stat-l">최고 수입 월</div><div class="stat-v">${maxIncM.m} (${won(maxIncM.after)})</div></div>
      <div class="stat"><div class="stat-l">평균 월 수입</div><div class="stat-v">${won(avgAfter)}</div></div>
      <div class="stat"><div class="stat-l">최다 가입 월</div><div class="stat-v">${maxKM.m} (${kByMonth[maxKM.m]||maxKM.k}건)</div></div>
    </div>
    <div style="margin-top:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:13px;font-weight:600;color:var(--muted)">월별 수입 내역</div>
        <button class="btn btn-secondary btn-sm" onclick="openIncomeModal()">＋ 수입 입력</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr>${['월','신규계약','계약금액','세전 수입','세후 수입','메모',''].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${displayMonths.map(m=>{
          const exp=expandedMonth===m.m;
          const mContracts=CONTRACTS.filter(r=>r.d&&r.d.slice(0,5)===m.m);
          const mAmt=amtByMonth[m.m]||0;
          const summaryRow=`<tr onclick="toggleMonthDetail('${m.m}')" style="cursor:pointer;background:${exp?'var(--blue-l)':''};transition:background .15s">
            <td style="font-weight:700">${m.m} <span style="font-size:11px;color:${exp?'var(--blue)':'var(--hint)'}">${exp?'▲':'▼'}</span></td>
            <td style="text-align:center">${kByMonth[m.m]||m.k||0}건</td>
            <td style="text-align:right;font-weight:${mAmt>0?600:400};color:${mAmt>0?'var(--blue)':'var(--hint)'}">${mAmt>0?wonN(mAmt)+'원':'-'}</td>
            <td style="text-align:right">${m.before?won(m.before):'-'}</td>
            <td style="text-align:right;font-weight:${m.after>=3000000?600:400};color:${m.after>=3000000?'var(--blue)':'inherit'}">${m.after?won(m.after):'-'}</td>
            <td style="color:var(--hint);font-size:12px">${m.memo||''}</td>
            <td class="td-act" onclick="event.stopPropagation()">
              <button class="btn btn-secondary btn-sm" onclick="openIncomeModalFor('${m.m}')">✏️ 수입편집</button>
            </td>
          </tr>`;
          const detailRow=exp?`<tr style="background:#EFF6FF">
            <td colspan="6" style="padding:0">
              <div style="padding:12px 16px 16px;border-top:1px dashed var(--border)">
                <div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:8px">📋 ${m.m} 계약 리스트 (${mContracts.length}건)</div>
                ${mContracts.length>0?`<table style="width:100%;font-size:12px;border-collapse:collapse">
                  <thead><tr style="background:var(--surface2)">
                    ${['가입일','상태','계약자','보험회사','보험명','월보험료',''].map(h=>`<th style="padding:6px 10px;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap">${h}</th>`).join('')}
                  </tr></thead>
                  <tbody>${mContracts.map((r,ri)=>`
                    <tr style="border-bottom:1px dashed var(--border);background:${ri%2?'#F8FAFF':'#fff'}">
                      <td style="padding:7px 10px;color:var(--muted);white-space:nowrap">${r.d}</td>
                      <td style="padding:7px 10px">${sbadge(r.s)}</td>
                      <td style="padding:7px 10px;font-weight:600;white-space:nowrap">${r.c}</td>
                      <td style="padding:7px 10px;white-space:nowrap">${r.co}</td>
                      <td style="padding:7px 10px;white-space:nowrap;font-weight:500">${r.n}</td>
                      <td style="padding:7px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">${wonN(r.pr)}원</td>
                      <td style="padding:7px 10px;text-align:right">
                        <button class="btn btn-secondary btn-sm" onclick="openEditModal(${r.id})">✏️</button>
                      </td>
                    </tr>`).join('')}
                  </tbody>
                </table>
                <div style="margin-top:10px;padding:10px 12px;background:var(--blue-l);border-radius:8px;display:flex;justify-content:space-between">
                  <span style="font-size:12px;color:var(--blue)">이 월 월보험료 합계</span>
                  <span style="font-size:13px;font-weight:700;color:var(--blue)">${wonN(mContracts.filter(r=>r.s==='계약완료').reduce((s,r)=>s+r.pr,0))}원/월</span>
                </div>`
                :`<div style="padding:20px;text-align:center;color:var(--hint);font-size:13px">이 월의 계약 데이터가 없습니다</div>`}
              </div>
            </td>
          </tr>`:'';
          return summaryRow+detailRow;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  } catch(e) {
    console.error('renderMonthly:', e);
    document.getElementById('pane-월별').innerHTML=`<div style="padding:30px;color:var(--red)">⚠️ 오류: ${e.message}</div>`;
  }
}

// MODAL: 계약 추가/수정

// 제안서 PDF 업로드
// ════════════════════════════════════════════════════════════
let pendingProposalUrl = null; // 업로드 완료 후 저장 대기 URL

function handleProposalUpload(event) {
  const file = event.target.files[0];
  if(!file) return;
  const infoEl = document.getElementById('proposal-info');
  infoEl.textContent = '⏳ 업로드 중...';
  infoEl.style.color = 'var(--amber)';

  const reader = new FileReader();
  reader.onload = async e => {
    const base64 = e.target.result.split(',')[1];
    const filename = `제안서_${Date.now()}.pdf`;
    try {
      const res = await fetch(CLOUD_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({action:'uploadFile', base64, filename})
      });
      const data = await res.json();
      if(data.success) {
        pendingProposalUrl = data.viewUrl;
        infoEl.innerHTML = `<a href="${data.viewUrl}" target="_blank" style="color:var(--blue);text-decoration:none">✅ ${file.name} (클릭하여 확인)</a>`;
        showToast('✅ 제안서 업로드 완료! 저장 버튼을 눌러주세요');
      } else {
        throw new Error(data.error||'업로드 실패');
      }
    } catch(err) {
      infoEl.textContent = '❌ 업로드 실패: ' + err.message;
      infoEl.style.color = 'var(--red)';
    }
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function resetProposalField(existingUrl) {
  pendingProposalUrl = null;
  const infoEl = document.getElementById('proposal-info');
  if(!infoEl) return;
  if(existingUrl) {
    infoEl.innerHTML = `<a href="${existingUrl}" target="_blank" style="color:var(--blue);text-decoration:none;font-size:12px">📄 기존 제안서 보기</a> <span style="color:var(--muted);font-size:11px">| 새 파일 올리면 교체됩니다</span>`;
  } else {
    infoEl.textContent = '파일 없음';
    infoEl.style.color = 'var(--muted)';
  }
}


function showAddGroupInput() {
  document.getElementById('new-grp-wrap').style.display = 'block';
  setTimeout(()=>document.getElementById('new-grp-name').focus(), 50);
}
function cancelAddGroup() {
  document.getElementById('new-grp-wrap').style.display = 'none';
  document.getElementById('new-grp-name').value = '';
}
function addNewGroup() {
  const name = document.getElementById('new-grp-name').value.trim();
  const color = document.getElementById('new-grp-color').value;
  if(!name) { showToast('⚠️ 그룹명을 입력해주세요'); return; }
  if(GROUPS[name]) { showToast('⚠️ 이미 있는 그룹명이에요'); return; }
  GROUPS[name] = color;
  save('ins_groups', GROUPS);
  const cur = document.getElementById('f-group').value;
  populateGroupDropdown(name);
  cancelAddGroup();
  showToast(`✅ '${name}' 그룹이 추가되었습니다`);
}

function populateGroupDropdown(selectedG) {
  const sel = document.getElementById('f-group');
  sel.innerHTML = Object.keys(GROUPS).sort().map(g=>`<option value="${g}"${g===selectedG?' selected':''}>${g}</option>`).join('');
}

function openAddModal() {
  document.getElementById('modal-title').textContent = '새 계약 추가';
  document.getElementById('edit-id').value = '';
  document.getElementById('f-status').value = '계약완료';
  document.getElementById('f-date').value = '';
  document.getElementById('f-holder').value = '';
  document.getElementById('f-insured').value = '';
  document.getElementById('f-co').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-price').value = '';
  populateGroupDropdown('지인들');
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('new-grp-wrap').style.display = 'none';
  document.getElementById('modal-contract').classList.add('on');
  setTimeout(()=>{document.getElementById('f-holder').focus(); resetProposalField(null);}, 100);
}

function openEditModal(id) {
  const r = CONTRACTS.find(c=>c.id===id);
  if(!r) return;
  document.getElementById('modal-title').textContent = `계약 수정 — ${r.c}`;
  document.getElementById('edit-id').value = id;
  document.getElementById('f-status').value = r.s;
  document.getElementById('f-date').value = r.d;
  document.getElementById('f-holder').value = r.c;
  document.getElementById('f-insured').value = r.p;
  document.getElementById('f-co').value = r.co;
  document.getElementById('f-name').value = r.n;
  document.getElementById('f-price').value = r.pr;
  populateGroupDropdown(r.g);
  document.getElementById('btn-delete').style.display = 'inline-flex';
  document.getElementById('new-grp-wrap').style.display = 'none';
  document.getElementById('modal-contract').classList.add('on');
  setTimeout(()=>resetProposalField(r.proposalUrl||null), 100);
}

function saveContract() {
  const id = document.getElementById('edit-id').value;
  const data = {
    s:  document.getElementById('f-status').value,
    d:  document.getElementById('f-date').value.trim(),
    c:  document.getElementById('f-holder').value.trim(),
    p:  document.getElementById('f-insured').value.trim() || document.getElementById('f-holder').value.trim(),
    co: document.getElementById('f-co').value.trim(),
    n:  document.getElementById('f-name').value.trim(),
    pr: parseInt(document.getElementById('f-price').value) || 0,
    g:  document.getElementById('f-group').value,
  };
  if(pendingProposalUrl) data.proposalUrl = pendingProposalUrl;
  else if(id) { const old=CONTRACTS.find(c=>c.id===parseInt(id)); if(old?.proposalUrl) data.proposalUrl=old.proposalUrl; }
  if(!data.c){showToast('⚠️ 계약자를 입력해주세요');return;}

  if(id) {
    const idx = CONTRACTS.findIndex(c=>c.id===parseInt(id));
    if(idx>=0) CONTRACTS[idx] = {...CONTRACTS[idx],...data};
    showToast('✅ 계약이 수정되었습니다');
  } else {
    data.id = nextId++;
    CONTRACTS.push(data);
    // Add month to MONTHLY if new
    const m = data.d.slice(0,5);
    if(m && !MONTHLY.find(x=>x.m===m)) {
      MONTHLY.push({m,k:0,before:0,after:0,tax:0,memo:''});
      MONTHLY.sort((a,b)=>a.m.localeCompare(b.m));
    }
    showToast('✅ 계약이 추가되었습니다');
  }
  save('ins_contracts', CONTRACTS);
  save('ins_monthly', MONTHLY);
  closeModal('contract');
  scheduleSave();
  renderAll();
}

function deleteContract() {
  const id = parseInt(document.getElementById('edit-id').value);
  const r = CONTRACTS.find(c=>c.id===id);
  if(!r || !confirm(`'${r.c} / ${r.n}' 계약을 삭제하시겠습니까?`)) return;
  CONTRACTS = CONTRACTS.filter(c=>c.id!==id);
  save('ins_contracts', CONTRACTS);
  closeModal('contract');
  showToast('🗑️ 계약이 삭제되었습니다');
  scheduleSave();
  renderAll();
}

function openIncomeModal() {
  const sel = document.getElementById('i-month');

  // MONTHLY에 있는 달 + 빈 달 채우기 (마지막 달 ~ 현재+3개월)
  const months = [...MONTHLY].map(m=>m.m);
  const now = new Date();

  // 마지막 달부터 현재+3개월까지 빈 달 자동 채우기
  const lastM = months.length ? months.slice().sort().pop() : '24.07';
  const [ly, lm] = lastM.split('.').map(Number);
  let cur = new Date(2000+ly, lm-1, 1); // 마지막 달 다음달부터
  cur.setMonth(cur.getMonth()+1);
  const endDate = new Date(now.getFullYear(), now.getMonth()+4, 1); // 현재+3개월
  while(cur < endDate){
    const ms = `${String(cur.getFullYear()).slice(2)}.${String(cur.getMonth()+1).padStart(2,'0')}`;
    if(!months.includes(ms)) months.push(ms);
    cur.setMonth(cur.getMonth()+1);
  }
  months.sort((a,b)=>b.localeCompare(a)); // 최신순 정렬

  sel.innerHTML = months.map(m=>`<option value="${m}">${m}</option>`).join('');

  // 기본값: 이번 달
  const thisMonth = `${String(now.getFullYear()).slice(2)}.${String(now.getMonth()+1).padStart(2,'0')}`;
  sel.value = months.includes(thisMonth) ? thisMonth : months[0];
  loadIncomeData();
  document.getElementById('modal-income').classList.add('on');
}

function openIncomeModalFor(m) {
  openIncomeModal();
  document.getElementById('i-month').value = m;
  loadIncomeData();
}

function loadIncomeData() {
  const m = document.getElementById('i-month').value;
  const data = MONTHLY.find(x=>x.m===m);
  document.getElementById('i-before').value = data?.before || '';
  document.getElementById('i-after').value  = data?.after  || '';
  document.getElementById('i-tax').value    = data?.tax    || '';
  document.getElementById('i-memo').value   = data?.memo   || '';
}

function saveIncome() {
  const m      = document.getElementById('i-month').value;
  const before = parseInt(document.getElementById('i-before').value) || 0;
  const after  = parseInt(document.getElementById('i-after').value)  || 0;
  const tax    = parseInt(document.getElementById('i-tax').value)    || 0;
  const memo   = document.getElementById('i-memo').value.trim();
  const idx = MONTHLY.findIndex(x=>x.m===m);
  if(idx>=0) Object.assign(MONTHLY[idx],{before,after,tax,memo});
  else { MONTHLY.push({m,k:0,before,after,tax,memo}); MONTHLY.sort((a,b)=>a.m.localeCompare(b.m)); }
  save('ins_monthly', MONTHLY);
  closeModal('income');
  showToast(`✅ ${m} 수입이 저장되었습니다`);
  scheduleSave();
  renderMonthly();
}

function exportData() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    contracts: CONTRACTS,
    monthly: MONTHLY,
    groups: GROUPS,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = url; a.download = `보험관리툴_백업_${ds}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('💾 백업 파일이 다운로드되었습니다');
}

function importData(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.contracts || !data.monthly) { showToast('⚠️ 올바른 백업 파일이 아닙니다'); return; }
      const exportDate = data.exportedAt ? new Date(data.exportedAt).toLocaleString('ko-KR') : '알 수 없음';
      if(!confirm(`백업 파일을 복원하면 현재 데이터가 교체됩니다.\n\n📋 계약: ${data.contracts.length}건\n📅 월 데이터: ${data.monthly.length}개월\n👥 그룹: ${Object.keys(data.groups||{}).length}개\n🕐 백업 일시: ${exportDate}\n\n계속하시겠습니까?`)) return;
      CONTRACTS = data.contracts;
      MONTHLY   = data.monthly;
      GROUPS    = data.groups || DEFAULT_GROUPS;
      nextId    = Math.max(...CONTRACTS.map(c=>c.id||0), 0) + 1;
      save('ins_contracts', CONTRACTS);
      save('ins_monthly',   MONTHLY);
      save('ins_groups',    GROUPS);
      renderAll();
      showToast(`✅ 복원 완료! 계약 ${CONTRACTS.length}건 불러왔습니다`);
    } catch(err) {
      showToast('⚠️ 파일을 읽는 중 오류가 발생했습니다');
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

function updateCovItem(customer, polId, idx, field, value){
  if(!COVERAGES[customer]) COVERAGES[customer]={policies:[]};
  let pol = COVERAGES[customer].policies.find(p=>p.id===polId);
  if(!pol){pol={id:polId,items:[]};COVERAGES[customer].policies.push(pol);}
  if(!pol.items[idx]) pol.items[idx]={};
  pol.items[idx][field] = value;
  saveCoverages();
}

function addCovItem(customer, polId){
  if(!COVERAGES[customer]) COVERAGES[customer]={policies:[]};
  let pol = COVERAGES[customer].policies.find(p=>p.id===polId);
  if(!pol){pol={id:polId,items:[]};COVERAGES[customer].policies.push(pol);}
  pol.items.push({name:'',amount:'',unit:'만원'});
  saveCoverages();
  renderCovDetail(customer);
}

function removeCovItem(customer, polId, idx){
  const pol = COVERAGES[customer]?.policies?.find(p=>p.id===polId);
  if(!pol) return;
  pol.items.splice(idx,1);
  saveCoverages();
  renderCovDetail(customer);
}

function setGeminiKey(){
  const key = prompt('Gemini API 키를 입력하세요 (AIzaSy...):');
  if(!key||!key.trim()) return;
  GEMINI_KEY = key.trim();
  localStorage.setItem('gemini_key', GEMINI_KEY);
  showToast('✅ API 키가 저장되었습니다');
  renderCoverageTab();
}

async function handlePDFUpload(event, polId, coName, prodName){
  const file = event.target.files[0];
  if(!file) return;
  if(!GEMINI_KEY){ setGeminiKey(); return; }

  showToast('🔄 AI가 제안서를 분석 중이에요...');
  const customer = selectedCovCustomer;

  const reader = new FileReader();
  reader.onload = async e => {
    const base64 = e.target.result.split(',')[1];
    try {
      const prompt = `이 보험 제안서에서 정보를 추출해주세요.
반드시 아래 JSON 형식으로만 응답하세요. 다른 텍스트 없이 JSON만:
{"payPeriod":"납입기간(예:20년납,전기납)","covPeriod":"보험기간(예:100세,80세,30년)","renewable":"갱신여부(갱신형 또는 비갱신형)","items":[{"name":"담보명","amount":숫자(만원단위),"unit":"만원","price":해당담보의보험료(원단위숫자또는0)}]}
금액은 만원 단위 숫자만. 예) 3000만원→3000
보장금액이 없는 항목은 제외하세요.`;

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_KEY}`,
        {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            contents:[{parts:[
              {inline_data:{mime_type:'application/pdf',data:base64}},
              {text:prompt}
            ]}],
            generationConfig:{temperature:0.1}
          })
        }
      );
      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      const text = data.candidates[0].content.parts[0].text;
      const clean = text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);

      if(!COVERAGES[customer]) COVERAGES[customer]={policies:[]};
      let pol = COVERAGES[customer].policies.find(p=>p.id===polId);
      if(!pol){pol={id:polId,items:[]};COVERAGES[customer].policies.push(pol);}
      pol.items = parsed.items || [];
      if(parsed.payPeriod) pol.payPeriod = parsed.payPeriod;
      if(parsed.covPeriod) pol.covPeriod = parsed.covPeriod;
      if(parsed.renewable) pol.renewable = parsed.renewable;
      saveCoverages();
      renderCovDetail(customer);
      showToast(`✅ ${pol.items.length}개 담보 추출 완료!`);
    } catch(err) {
      showToast('❌ 분석 실패: ' + err.message);
    }
  };
  reader.readAsDataURL(file);
  event.target.value='';
}

function copyShareLink(name){
  const url = `${location.origin}${location.pathname}#view=${encodeURIComponent(name)}`;
  navigator.clipboard.writeText(url).then(()=>showToast('📤 고객 링크 복사됐어요!')).catch(()=>{
    prompt('아래 링크를 복사하세요:', url);
  });
}

                  ${v>0?wonN(v*10000)+'원':'-'}
                </td>`;
              }).join('')}
              <td style="padding:8px 12px;text-align:right;font-weight:700;color:#0F172A;border-left:1px solid #E5E7EB">${wonN(rowTotal*10000)}원</td>
            </tr>`;
          }).join('')}`).join('')}
        <tr style="background:#1E3A8A">
          <td style="padding:11px 14px;color:#fff;font-weight:700">💰 총 납입 보험료</td>
          <td colspan="${cvPolicyCols.length}" style="padding:11px 8px"></td>
          <td style="padding:11px 12px;color:#FCD34D;font-weight:800;font-size:15px">${wonN(cvTotalPremium)}원/월</td>
        </tr>
      </tbody>
    </table></div>
  `:'';

    const policySections = contracts.map(contract=>{
    const pol = (cData.policies||[]).find(p=>p.id===contract.id);
    const items = pol?.items||[];
    if(!items.length) return'';
    return`<div class="cv-policy">
      <div class="cv-policy-hdr">
        <div style="font-size:20px">${contract.co.includes('삼성')?'🟠':contract.co.includes('메리츠')?'🔵':contract.co.includes('현대')?'🟢':'🏦'}</div>
        <div>
          <div style="font-weight:600;font-size:14px">${contract.co}</div>
          <div style="font-size:12px;color:var(--muted)">${contract.n} · 월 ${wonN(contract.pr)}원</div>
        </div>
      </div>
      ${items.map(item=>`
        <div class="cv-item">
          <span style="color:#374151">${item.name}</span>
          <span style="font-weight:600;color:#1E3A8A">${wonN(parseFloat(item.amount||0)*10000)}원</span>
        </div>`).join('')}
    </div>`;
  }).join('');

  const html=`<div class="cv-wrap">
    <div class="cv-header">
      <div style="font-size:14px;opacity:.75;margin-bottom:4px">보험 보장 내역서</div>
      <div style="font-size:24px;font-weight:800;margin-bottom:4px">${name} 님</div>
      <div style="font-size:12px;opacity:.7">담당: 김성래 설계사</div>
    </div>
    <div style="padding:16px 0 0">
      ${cvTotalPremium>0?`
      <div style="margin:0 16px 12px;font-size:13px;font-weight:600;color:#374151">📑 보험 개요</div>
      <div style="margin:0 16px 12px">${cvOverview}</div>`:''}
      ${aggEntries.length>0?`
      <div style="margin:0 16px 12px;font-size:13px;font-weight:600;color:#374151">📊 보장 합산 매트릭스</div>
      <div style="margin:0 16px 12px">${matrixTableCV}</div>`:''}
      <div style="margin:0 16px 12px;font-size:13px;font-weight:600;color:#374151">📋 보험별 담보 내역</div>
      ${policySections||'<div style="text-align:center;padding:30px;color:#9CA3AF">보장 데이터가 없습니다</div>'}
      <div style="text-align:center;margin-top:20px;font-size:12px;color:#9CA3AF">
        문의: 김성래 설계사 📞
      </div>
    </div>
  </div>`;

  document.body.insertAdjacentHTML('beforeend', `<div id="cv-screen">${html}</div>`);
}

// ── 담보명 정규화 (괄호 제거, 유사항목 합산용) ──────────────
function normCovName(name) {
  if(!name) return '';
  try {
    return name
      .replace(/\s*\([^)]*\)/g, '')    // 소괄호 제거
      .replace(/\s*[IVX]+\s*$/i, '')    // 끝 로마자 제거
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 28) || name.slice(0, 28);
  } catch(e) { return name.slice(0, 28); }
}

function saveCovGroups(){ save('ins_cov_groups', COV_GROUPS); }

function getCovGroup(name) {
  const low = name.toLowerCase();
  for(const g of COV_GROUPS) {
    if(g.keys.some(k => low.includes(k.toLowerCase()))) return g;
  }
  return COV_GROUPS[COV_GROUPS.length-1];
}

// ════════════════════════════════════════════════════════════
// Init — 고객 뷰 모드 or 일반 모드
// ════════════════════════════════════════════════════════════
(async function init() {
  const hash = window.location.hash;

  // 고객 전용 링크 감지
  if(hash.startsWith('#view=')) {
    // app-wrap 숨기고 고객 뷰만 표시
    document.getElementById('app-wrap').style.display = 'none';
    const customerName = decodeURIComponent(hash.slice(6));
    try {
      const res = await fetch(CLOUD_URL + '?t=' + Date.now());
      const data = await res.json();
      if(data.contracts){ CONTRACTS=data.contracts; COVERAGES=data.coverages||{}; MONTHLY=data.monthly||MONTHLY; GROUPS=data.groups||GROUPS; }
    } catch(e){}
    showCustomerView(customerName);
    return;
  }

  // 일반 관리 모드 — 먼저 렌더링 후 app-wrap 표시
  renderAll();
  document.getElementById('app-wrap').style.display = 'block';

  const loaded = await loadFromCloud();
  if(loaded){ COVERAGES=load('ins_coverages',{}); renderAll(); }
})();
