// ── 지난달 변동지출 95%로 예산 일괄설정 (고정지출은 건드리지 않음) ──
function openBulkVarBudget(){
  var ym=gYM();var prevYm=getPrevYM(ym);
  var prevTxs=getTxs(prevYm).filter(function(t){return t.type==='지출'&&!isFixed(t);});
  var sums={};
  prevTxs.forEach(function(t){
    var key=t.mid+'|'+t.sub;
    sums[key]=(sums[key]||0)+(Number(t.amount)||0);
  });
  var proposals=Object.keys(sums).map(function(key){
    var parts=key.split('|');var mid=parts[0],sub=parts[1];
    var actual=sums[key];
    var suggested=Math.round(actual*0.95/1000)*1000;
    var btIdx=BT.findIndex(function(b){return b.mid===mid&&b.sub===sub;});
    var oldAmt=btIdx>=0?(BT[btIdx].amount||0):null;
    return{mid:mid,sub:sub,actual:actual,suggested:suggested,btIdx:btIdx,oldAmt:oldAmt};
  }).sort(function(a,b){return b.actual-a.actual;});

  if(!proposals.length){showToast('📭 '+prevYm+'에 변동 지출 내역이 없어요.');return;}

  var existing=document.getElementById('bulk-bud-md');if(existing)existing.remove();
  var md=document.createElement('div');md.className='mdbg on';md.id='bulk-bud-md';
  var totalActual=proposals.reduce(function(s,p){return s+p.actual;},0);
  var totalSuggested=proposals.reduce(function(s,p){return s+p.suggested;},0);
  var rows=proposals.map(function(p,i){
    var changeNote=p.oldAmt===null?'<span class="bk bcy" style="font-size:9px">신규</span>':(p.oldAmt!==p.suggested?'<span class="bk bgy" style="font-size:9px">'+ff(p.oldAmt)+' → 변경</span>':'<span class="bk bg2" style="font-size:9px">동일</span>');
    return'<label style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--bd);cursor:pointer">'
      +'<input type="checkbox" class="bulk-bud-chk" data-idx="'+i+'" checked style="width:15px;height:15px">'
      +'<span style="flex:1;font-size:12px">'+(CE[p.mid]||'')+' '+p.mid+' &gt; '+p.sub+'</span>'
      +'<span style="font-size:11px;color:var(--mu)">'+prevYm.split('-')[1]+'월 '+ff(p.actual)+'</span>'
      +'<span style="font-size:12px;font-weight:700;color:var(--pu);min-width:80px;text-align:right">'+ff(p.suggested)+'</span>'
      +changeNote
      +'</label>';
  }).join('');
  md.innerHTML='<div class="md" style="max-width:560px">'
    +'<div class="mdh"><h3>🪄 '+prevYm+' 변동지출 95%로 예산 설정</h3><button class="mdc" onclick="document.getElementById(\'bulk-bud-md\').remove()">✕</button></div>'
    +'<div style="font-size:11px;color:var(--mu);margin-bottom:8px">'+prevYm+'에 <strong>고정거래로 등록되지 않은</strong> 변동 지출만 대상으로, 실사용액의 95%를 '+ym+' 예산 기본값으로 제안해요. 필요없는 항목은 체크 해제하세요.</div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;padding:8px;background:var(--sf2);border-radius:8px">'
    +'<span>'+prevYm+' 변동지출 합계 <strong>'+ff(totalActual)+'</strong></span>'
    +'<span>→ 제안 총액 <strong style="color:var(--pu)">'+ff(totalSuggested)+'</strong></span>'
    +'</div>'
    +'<div style="max-height:340px;overflow-y:auto">'+rows+'</div>'
    +'<div class="fx g8 mt8">'
    +'<button class="btn bp" onclick="confirmBulkVarBudget()">💾 선택 항목 적용</button>'
    +'<button class="btn bg2" onclick="document.getElementById(\'bulk-bud-md\').remove()">취소</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(md);
  window._bulkBudProposals=proposals;
}
function confirmBulkVarBudget(){
  var proposals=window._bulkBudProposals||[];
  var checked=Array.prototype.slice.call(document.querySelectorAll('.bulk-bud-chk:checked'));
  var applied=0;
  checked.forEach(function(chk){
    var p=proposals[Number(chk.dataset.idx)];if(!p)return;
    if(p.btIdx>=0){
      updateBudgetTemplateItem(p.btIdx,{mid:p.mid,sub:p.sub,amount:p.suggested});
    }else{
      addBudgetTemplateItem({mid:p.mid,sub:p.sub,amount:p.suggested});
    }
    applied++;
  });
  document.getElementById('bulk-bud-md').remove();
  renderBud();
  showToast('✅ '+applied+'개 항목 예산 반영됐어요!');
}

      // 수정/삭제 버튼
      var editBtn=document.createElement('button');editBtn.className='btn bg2 bsm';editBtn.textContent='⚙️';
      editBtn.style.cssText='padding:4px 7px;margin-left:4px';
      (function(ii){editBtn.onclick=function(){openEditAsset(ii);};})(i);
      item.appendChild(editBtn);
      var delBtn=document.createElement('button');delBtn.className='btn bg2 bsm';delBtn.textContent='🗑️';
      delBtn.style.cssText='padding:4px 7px;margin-left:4px';
      (function(ii){delBtn.onclick=function(){deleteAssetItem(ii);};})(i);
      item.appendChild(delBtn);
      grp.appendChild(item);
    });
    container.appendChild(grp);
  });

  // 할부: 별도 그룹으로 자동계산해서 표시 (수동 입력 불필요)
  var activeIns=INSTALLMENTS.map(function(item,i){return{item:item,i:i,st:getInsStatus(item,ym)};}).filter(function(x){return!x.st.done&&!x.st.notStarted;});
  if(activeIns.length){
    var insTotal=activeIns.reduce(function(s,x){return s+x.st.remaining;},0);
    var insGrp=document.createElement('div');insGrp.className='asset-group';
    var insTitle=document.createElement('div');insTitle.className='asset-group-title';
    insTitle.textContent='할부 ';
    var insAmt=document.createElement('span');insAmt.style.cssText='color:var(--rd);font-weight:400';insAmt.textContent=ff(insTotal);
    insTitle.appendChild(insAmt);insGrp.appendChild(insTitle);
    activeIns.forEach(function(x){
      var item=x.item,st=x.st;
      var row=document.createElement('div');row.className='asset-item';
      var icon=document.createElement('div');icon.className='asset-icon';icon.style.background='rgba(239,68,68,.12)';icon.textContent='💳';row.appendChild(icon);
      var info=document.createElement('div');info.className='asset-info';
      var nm=document.createElement('div');nm.className='asset-name';nm.style.color='var(--rd)';nm.textContent=item.name+' ('+st.num+'/'+item.totalMonths+'회차)';info.appendChild(nm);
      var cat=document.createElement('div');cat.className='asset-cat';
      cat.textContent='할부'+(item.rate>0?' · 연 '+item.rate+'%':' · 무이자')+' · ';
      var vspan=document.createElement('span');vspan.style.color='var(--rd)';vspan.textContent=ff(st.remaining);cat.appendChild(vspan);
      info.appendChild(cat);row.appendChild(info);
      var badge=document.createElement('span');badge.className='bk bpu';badge.style.cssText='font-size:10px;margin-right:6px;white-space:nowrap';badge.textContent='🔗 자동계산';row.appendChild(badge);
      var editBtn=document.createElement('button');editBtn.className='btn bg2 bsm';editBtn.textContent='⚙️';editBtn.style.cssText='padding:4px 7px;margin-left:4px';
      (function(ii){editBtn.onclick=function(){openEditIns(ii);};})(x.i);
      row.appendChild(editBtn);
      var delBtn=document.createElement('button');delBtn.className='btn bg2 bsm';delBtn.textContent='🗑️';delBtn.style.cssText='padding:4px 7px;margin-left:4px';
      (function(ii){delBtn.onclick=function(){deleteIns(ii);renderAst();};})(x.i);
      row.appendChild(delBtn);
      insGrp.appendChild(row);
    });
    var hint=document.createElement('div');hint.style.cssText='font-size:10px;color:var(--mu);margin-top:4px';hint.textContent='할부는 남은 금액이 자동으로 총부채·순자산에 반영돼요. 추가/결제 기록은 입력·내역 탭에서 해주세요.';
    insGrp.appendChild(hint);
    container.appendChild(insGrp);
  }
}

function onAst(el,ym,n){var a=Number(el.value)||0;el.style.borderColor='var(--bl)';saveAssetItem(ym,n,a);el.style.borderColor='var(--gn)';setTimeout(function(){el.style.borderColor='';renderAst();},500);}

// ── 레버리지/리스크 대시보드 ────────────────────────────────────
// 부채(특히 마통 같은 신용대출)로 투자자산을 키우고 있는 정도와, 그게 흔들렸을 때의 충격을 보여준다.
function getLeverageHistory(){
  var db=loadDB();var assetsAll=db.assets||{};
  return Object.keys(assetsAll).sort().map(function(ym2){
    var am2=assetsAll[ym2];var r2=calcNW(am2,ym2);
    var ratio=r2.nw>0?Math.round(r2.td/r2.nw*100):(r2.td>0?999:0);
    return{ym:ym2,debt:r2.td,nw:r2.nw,ratio:ratio};
  });
}
// ── 실질 자산 손익 분석 ──────────────────────────────────────────
// 단순 "잔고가 얼마 늘었다"가 아니라, 그 이면의 진짜 비용/수익을 걷어내서 보여준다:
// 1) 레버리지(마통 등) 이자비용을 뺀 "진짜" 주식투자 성과
// 2) 보험 납입액 대비 실제로 받은 돈 (해지/만기/보험금 등)
function renderRealPLCard(){
  var wrap=document.getElementById('d-realpl');
  if(!wrap)return;
  var db=loadDB();var assetsAll=db.assets||{};
  var months=Object.keys(assetsAll).sort();
  var hasAssetHistory=months.length>=2;

  // ── 1) 레버리지 조정 투자손익 ──
  var investNames=AI.filter(function(a){return!a.d&&a.cat==='투자';}).map(function(a){return a.n;});
  var debtRated=AI.filter(function(a){return a.d&&a.rate>0;});
  var firstIdx=-1,hasInvest=false,investGain=0,totalInterestCost=0;
  if(hasAssetHistory){
    var investSeries=months.map(function(ym){
      var am=assetsAll[ym];
      return investNames.reduce(function(s,n){return s+(Number(am[n])||0);},0);
    });
    firstIdx=investSeries.findIndex(function(v){return v>0;});
    hasInvest=firstIdx>=0;
    if(hasInvest){
      investGain=investSeries[investSeries.length-1]-investSeries[firstIdx];
      for(var i=firstIdx;i<months.length;i++){
        var am2=assetsAll[months[i]];
        debtRated.forEach(function(d){
          var bal=Number(am2[d.n])||0;
          totalInterestCost+=bal*d.rate/100/12;
        });
      }
    }
  }
  var realGain=investGain-totalInterestCost;
  var currentInvestVal=hasInvest?investSeries[investSeries.length-1]:0;

  // ── 2) 보장성 보험료 대비 보험금 수령 비교 ──
  // 종신(저축성) 보험은 적금 개념이라 여기서 제외하고, 실제 "보장성" 보험료(금융지출>보험료)만
  // 보험금수입과 짝지어 비교한다 (사고/질병 대비 보장의 실질 손익).
  var allTxs=db.txs||[];
  var premiumPaid=0,insuranceReceived=0;
  allTxs.forEach(function(t){
    if(t.mid==='금융지출'&&t.sub==='보험료'&&t.type==='지출')premiumPaid+=Number(t.amount)||0;
    if(t.type==='수입'&&t.sub==='보험금수입')insuranceReceived+=Number(t.amount)||0;
  });
  var hasInsurance=premiumPaid>0||insuranceReceived>0;

  // ── 3) 순 투자손익 (실현, 거래 기준: 수입>투자수입 - 지출>금융지출>투자손실) ──
  var investIncomeRows=allTxs.filter(function(t){return t.type==='수입'&&t.sub==='투자수입';});
  var investLossRows=allTxs.filter(function(t){return t.type==='지출'&&t.mid==='금융지출'&&t.sub==='투자손실';});
  var totalInvestIncome=investIncomeRows.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var totalInvestLoss=investLossRows.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var hasNetInvest=totalInvestIncome>0||totalInvestLoss>0;
  var netInvestPL=totalInvestIncome-totalInvestLoss;
  // 이번달 순투자손익
  var curYm2=gYM();
  var curInvestIncome=investIncomeRows.filter(function(t){return t.date&&t.date.slice(0,7)===curYm2;}).reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var curInvestLoss=investLossRows.filter(function(t){return t.date&&t.date.slice(0,7)===curYm2;}).reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var curNetInvestPL=curInvestIncome-curInvestLoss;

  if(!hasInvest&&!hasInsurance&&!hasNetInvest){wrap.innerHTML='';return;}

  var html='<div class="card"><div class="card-title">💡 실질 자산 손익 분석 <span style="font-size:11px;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">· 표면 숫자가 아닌 진짜 손익</span></div>';

  if(hasInvest){
    var principal2=getStockPrincipal(months[months.length-1]);
    var usePrincipal=principal2>0;
    // 원금이 있으면: (현재평가액-원금)=진짜 미실현손익. 원금이 없으면: 표면증가(첫 추적월 대비 변화, 신규입금액 섞인 근사치)로 폴백.
    var unrealizedPL=usePrincipal?(currentInvestVal-principal2):investGain;
    var totalPerf=unrealizedPL+netInvestPL-totalInterestCost;
    var realColor=totalPerf>=0?'var(--gn)':'var(--rd)';
    var perfPct=usePrincipal?((totalPerf/principal2)*100).toFixed(1):null;
    var interestByMonth=[];
    for(var i2=firstIdx;i2<months.length;i2++){
      var amX=assetsAll[months[i2]];var mCost=0;
      debtRated.forEach(function(d){mCost+=(Number(amX[d.n])||0)*d.rate/100/12;});
      if(mCost>0)interestByMonth.push({ym:months[i2],cost:mCost});
    }
    html+='<div class="dtl-card" id="dtl-invest" onclick="toggleDtl(\'dtl-invest\')" style="border-radius:var(--r);margin-bottom:12px">'
      +'<div style="font-size:12px;font-weight:700;margin-bottom:8px">📈 레버리지 조정 주식투자 성과 ('+(usePrincipal?'원금 대비':months[firstIdx]+' ~ '+months[months.length-1])+')</div>'
      +'<div class="g4 mb8">'
      +'<div class="kpi"><div class="kl">'+(usePrincipal?'현재평가액 − 원금(미실현)':'주식자산 표면 증가(미실현)')+'</div><div class="kv" style="font-size:15px;color:'+(unrealizedPL>=0?'var(--tx)':'var(--rd)')+'">'+(usePrincipal&&unrealizedPL>=0?'+':'')+f(unrealizedPL)+'</div><div class="kb" style="background:var(--mu2)"></div></div>'
      +'<div class="kpi"><div class="kl">+ 실현손익(투자수입-투자손실)</div><div class="kv" style="font-size:15px;color:'+(netInvestPL>=0?'var(--gn)':'var(--rd)')+'">'+(netInvestPL>=0?'+':'')+f(netInvestPL)+'</div><div class="kb" style="background:'+(netInvestPL>=0?'var(--gn)':'var(--rd)')+'"></div></div>'
      +'<div class="kpi"><div class="kl">− 레버리지 이자비용(추정)</div><div class="kv" style="font-size:15px;color:var(--rd)">'+f(Math.round(totalInterestCost))+'</div><div class="kb" style="background:var(--rd)"></div></div>'
      +'<div class="kpi"><div class="kl">= 총 투자성과</div><div class="kv" style="font-size:15px;color:'+realColor+'">'+(totalPerf>=0?'+':'')+f(Math.round(totalPerf))+(perfPct?' ('+(totalPerf>=0?'+':'')+perfPct+'%)':'')+'</div><div class="kb" style="background:'+realColor+'"></div></div>'
      +'</div>'
      +'<div class="mb8" onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:8px;background:var(--sf2);border-radius:var(--rs);padding:8px 10px">'
      +'<span style="font-size:11px;color:var(--mu2);white-space:nowrap">📌 내가 넣은 원금(총 투입액)</span>'
      +'<input type="number" value="'+(principal2||'')+'" placeholder="예: 50000000" onblur="onStockPrincipalChange(this,\''+months[months.length-1]+'\')" style="flex:1;min-width:0;background:var(--sf3);border:1px solid var(--bd2);color:var(--tx);padding:5px 8px;border-radius:var(--rs);font-size:13px;font-weight:700;font-family:inherit">'
      +'<span style="font-size:10px;color:var(--mu)">(주식탭과 같은 값이에요)</span>'
      +'</div>'
      +(usePrincipal?'<div style="font-size:11px;color:var(--mu)">현재평가액 '+ff(currentInvestVal)+' − 원금 '+ff(principal2)+' = '+(unrealizedPL>=0?'+':'')+ff(unrealizedPL)+'을 기준으로 계산했어요 (원금을 입력해두면 이 방식이 훨씬 정확해요 — 표면증가 방식은 추적 시작월 잔액과 비교하는 거라, 그 사이 새로 입금한 돈까지 수익으로 잡히는 오차가 있어요).</div>':'<div style="font-size:11px;color:var(--pu);margin-bottom:6px">💡 위에 원금을 입력하면 "현재평가액-원금" 기준으로 훨씬 정확하게 계산돼요. 지금은 원금이 없어서 표면증가(추적 시작월 대비 변화) 방식으로 근사치만 보여드려요 — 이 경우 신규 입금액이 수익처럼 섞여 보일 수 있어요.</div>')
      +'<div style="font-size:11px;color:var(--mu)">⚠️ 이자비용은 부채 항목에 설정해둔 <b>현재 금리</b>를 과거 잔액에도 그대로 적용한 추정치예요 (실제 계약 금리가 매달 바뀌었다면 오차가 있을 수 있어요).</div>'
      +'<div class="dtl-hint">눌러서 월별 이자비용 내역보기 ▾</div>'
      +'<div class="dtl-body">'
      +(interestByMonth.length?interestByMonth.map(function(x){return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)"><span>'+x.ym+'</span><span style="font-weight:700;color:var(--rd)">'+ff(Math.round(x.cost))+'</span></div>';}).join(''):'<div style="font-size:11px;color:var(--mu)">이자 발생 내역 없음</div>')
      +'</div>'
      +'</div>';
  }

  if(hasInsurance){
    var netCost=premiumPaid-insuranceReceived;
    var insColor='var(--mu)'; // 보장성 보험은 손익 개념이 아니라서 항상 중립색
    var premiumRows=allTxs.filter(function(t){return t.mid==='금융지출'&&t.sub==='보험료'&&t.type==='지출';});
    var receivedRows=allTxs.filter(function(t){return t.type==='수입'&&t.sub==='보험금수입';});
    html+='<div class="dtl-card" id="dtl-ins" onclick="toggleDtl(\'dtl-ins\')" style="border-radius:var(--r)">'
      +'<div style="font-size:12px;font-weight:700;margin-bottom:8px">🛡️ 보장성 보험료 대비 보험금 수령 (전체 기간 누적)</div>'
      +'<div class="g3 mb8">'
      +'<div class="kpi"><div class="kl">누적 보험료(보장성)</div><div class="kv" style="font-size:16px;color:var(--rd)">'+f(premiumPaid)+'</div><div class="kb" style="background:var(--rd)"></div></div>'
      +'<div class="kpi"><div class="kl">실제 수령액(보험금수입)</div><div class="kv" style="font-size:16px;color:var(--gn)">'+f(insuranceReceived)+'</div><div class="kb" style="background:var(--gn)"></div></div>'
      +'<div class="kpi"><div class="kl">순부담(보험료-수령액)</div><div class="kv" style="font-size:16px;color:'+insColor+'">'+f(netCost)+'</div><div class="kb" style="background:'+insColor+'"></div></div>'
      +'</div>'
      +'<div style="font-size:11px;color:var(--mu)">💡 여긴 종신(저축성) 보험은 빼고, 실비·자동차·정기보험 같은 <b>보장성 보험료</b>만 봐요. 순부담이 (+)인 게 정상이에요 — 사고·질병이 없었단 뜻이니까요. 오히려 수령액이 크면 그만큼 어떤 일이 있었다는 신호예요.</div>'
      +'<div class="dtl-hint">눌러서 납입/수령 내역보기 ▾</div>'
      +'<div class="dtl-body">'
      +'<div style="font-size:11px;font-weight:700;margin-bottom:4px">보험료 납입 내역</div>'
      +(premiumRows.length?premiumRows.sort(function(a,b){return(b.date||'')>(a.date||'')?1:-1;}).map(function(t){return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)"><span>'+t.date+' '+(t.memo||'')+'</span><span style="font-weight:700">'+ff(t.amount)+'</span></div>';}).join(''):'<div style="font-size:11px;color:var(--mu)">없음</div>')
      +'<div style="font-size:11px;font-weight:700;margin:8px 0 4px">보험금 수령 내역</div>'
      +(receivedRows.length?receivedRows.map(function(t){return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)"><span>'+t.date+' '+(t.memo||'')+'</span><span style="font-weight:700;color:var(--gn)">'+ff(t.amount)+'</span></div>';}).join(''):'<div style="font-size:11px;color:var(--mu)">없음</div>')
      +'</div>'
      +'</div>';
  }

  if(hasNetInvest){
    var netColor=netInvestPL>=0?'var(--gn)':'var(--rd)';
    var curColor=curNetInvestPL>=0?'var(--gn)':'var(--rd)';
    var allInvestRows=investIncomeRows.map(function(t){return{date:t.date,memo:t.memo,amount:t.amount,gain:true};})
      .concat(investLossRows.map(function(t){return{date:t.date,memo:t.memo,amount:-t.amount,gain:false};}))
      .sort(function(a,b){return(b.date||'')>(a.date||'')?1:-1;});
    html+='<div class="dtl-card" id="dtl-netinvest" onclick="toggleDtl(\'dtl-netinvest\')" style="border-radius:var(--r);margin-bottom:12px">'
      +'<div style="font-size:12px;font-weight:700;margin-bottom:8px">💹 순 투자손익 (실현, 수입&gt;투자수입 − 지출&gt;금융지출&gt;투자손실)</div>'
      +'<div class="g3 mb8">'
      +'<div class="kpi"><div class="kl">'+curYm2+' 이번달 순손익</div><div class="kv" style="font-size:16px;color:'+curColor+'">'+(curNetInvestPL>=0?'+':'')+f(curNetInvestPL)+'</div><div class="kb" style="background:'+curColor+'"></div></div>'
      +'<div class="kpi"><div class="kl">누적 투자수입 − 투자손실</div><div class="kv" style="font-size:16px">'+f(totalInvestIncome)+' − '+f(totalInvestLoss)+'</div><div class="kb" style="background:var(--mu2)"></div></div>'
      +'<div class="kpi"><div class="kl">= 누적 순투자손익</div><div class="kv" style="font-size:16px;color:'+netColor+'">'+(netInvestPL>=0?'+':'')+f(netInvestPL)+'</div><div class="kb" style="background:'+netColor+'"></div></div>'
      +'</div>'
      +'<div style="font-size:11px;color:var(--mu)">💡 이번달 손실 났으면 지출 &gt; 금융지출 &gt; <b>투자손실</b>로 기록해두세요. "지출유형"은 투자로 선택하면, 소비/낭비랑 안 섞이고 여기서 수익과 상계돼서 진짜 순손익이 나와요.</div>'
      +'<div class="dtl-hint">눌러서 개별 내역보기 ▾</div>'
      +'<div class="dtl-body">'
      +(allInvestRows.length?allInvestRows.map(function(t){
        return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)"><span>'+(t.date||'')+' '+(t.memo||(t.gain?'투자수입':'투자손실'))+'</span><span style="font-weight:700;color:'+(t.amount>=0?'var(--gn)':'var(--rd)')+'">'+(t.amount>=0?'+':'')+ff(t.amount)+'</span></div>';
      }).join(''):'<div style="font-size:11px;color:var(--mu)">없음</div>')
      +'</div>'
      +'</div>';
  }

  html+='</div>';
  wrap.innerHTML=html;
}

// ── 유동성 비율 & 비상금 커버리지 ──────────────────────────────
function renderLiquidityCard(am,r){
  var wrap=document.getElementById('d-liquidity');
  if(!wrap)return;
  if(r.ta<=0){wrap.innerHTML='';return;}

  // 유동자산: 현금/예금 등 '기타'류 + 주식 등 '투자'류 (즉시 현금화 가능)
  // 비유동자산: 연금/보험저축/저축(청약 등)/부동산 (묶여있는 자산)
  var liquidItems=[],illiquidItems=[];
  AI.filter(function(a){return!a.d;}).forEach(function(a){
    var v=Number(am[a.n])||0;
    if(!v)return;
    if(a.cat==='기타'||a.cat==='투자'||a.cat==='절세계좌')liquidItems.push({n:a.n,v:v});
    else illiquidItems.push({n:a.n,v:v});
  });
  var liquid=liquidItems.reduce(function(s,x){return s+x.v;},0);
  var illiquid=illiquidItems.reduce(function(s,x){return s+x.v;},0);
  var liquidPct=r.ta>0?Math.round(liquid/r.ta*100):0;

  // 비상금(현금성자산=cat 기타) ÷ 월평균 고정지출
  var cashItems=AI.filter(function(a){return!a.d&&a.cat==='기타';}).map(function(a){return{n:a.n,v:Number(am[a.n])||0};}).filter(function(x){return x.v>0;});
  var cashOnly=cashItems.reduce(function(s,x){return s+x.v;},0);
  var allTxs=loadDB().txs||[];
  var fixedExpByMonth={};
  allTxs.forEach(function(t){
    if(t.type==='지출'&&isFixed(t)){
      var mm=t.date.slice(0,7);
      fixedExpByMonth[mm]=(fixedExpByMonth[mm]||0)+(Number(t.amount)||0);
    }
  });
  var fixedMonths=Object.keys(fixedExpByMonth).sort();
  var avgFixedExp=fixedMonths.length?fixedMonths.reduce(function(s,m){return s+fixedExpByMonth[m];},0)/fixedMonths.length:0;
  var coverMonths=avgFixedExp>0?(cashOnly/avgFixedExp):null;

  var covColor=coverMonths===null?'var(--mu)':coverMonths>=6?'var(--gn)':coverMonths>=3?'var(--yw)':'var(--rd)';
  var covLabel=coverMonths===null?'고정지출 데이터가 없어요':coverMonths.toFixed(1)+'개월치';

  function itemRows(items,color){
    return items.length?items.sort(function(a,b){return b.v-a.v;}).map(function(x){
      return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)"><span>'+x.n+'</span><span style="font-weight:700;color:'+color+'">'+ff(x.v)+'</span></div>';
    }).join(''):'<div style="font-size:11px;color:var(--mu);padding:4px 0">없음</div>';
  }

  var html='<div class="card"><div class="card-title">💧 유동성 &amp; 비상금 분석</div>'
    +'<div class="dtl-card" id="dtl-liq" onclick="toggleDtl(\'dtl-liq\')">'
    +'<div class="g2">'
    +'<div style="background:var(--sf2);border-radius:var(--r);padding:14px">'
    +'<div style="font-size:12px;font-weight:700;margin-bottom:8px">유동성 비율</div>'
    +'<div style="font-size:24px;font-weight:900;color:var(--bl);margin-bottom:6px">'+liquidPct+'%</div>'
    +'<div style="height:8px;background:var(--sf3);border-radius:4px;overflow:hidden;margin-bottom:6px">'
    +'<div style="width:'+liquidPct+'%;height:100%;background:var(--bl);border-radius:4px"></div></div>'
    +'<div style="font-size:11px;color:var(--mu)">즉시 현금화 가능 '+ff(liquid)+' · 묶여있는 자산(연금·보험·저축·부동산) '+ff(illiquid)+'</div>'
    +'</div>'
    +'<div style="background:var(--sf2);border-radius:var(--r);padding:14px">'
    +'<div style="font-size:12px;font-weight:700;margin-bottom:8px">비상금 커버리지</div>'
    +'<div style="font-size:24px;font-weight:900;color:'+covColor+';margin-bottom:6px">'+covLabel+'</div>'
    +(coverMonths!==null?'<div style="height:8px;background:var(--sf3);border-radius:4px;overflow:hidden;margin-bottom:6px"><div style="width:'+Math.min(coverMonths/6*100,100)+'%;height:100%;background:'+covColor+';border-radius:4px"></div></div>':'')
    +'<div style="font-size:11px;color:var(--mu)">현금/예금 '+ff(cashOnly)+' ÷ 월평균 고정지출 '+ff(Math.round(avgFixedExp))+' · 통상 3~6개월치 권장</div>'
    +'</div>'
    +'</div>'
    +'<div class="dtl-hint">눌러서 항목별 상세보기 ▾</div>'
    +'<div class="dtl-body">'
    +'<div class="g2">'
    +'<div><div style="font-size:11px;font-weight:700;color:var(--bl);margin-bottom:4px">💧 유동자산 항목</div>'+itemRows(liquidItems,'var(--bl)')+'</div>'
    +'<div><div style="font-size:11px;font-weight:700;color:var(--mu2);margin-bottom:4px">🔒 비유동자산 항목</div>'+itemRows(illiquidItems,'var(--mu2)')+'</div>'
    +'</div>'
    +'<div style="margin-top:10px"><div style="font-size:11px;font-weight:700;margin-bottom:4px">📅 고정지출 월별 내역 (최근 6개월)</div>'
    +(fixedMonths.slice(-6).map(function(m){
      return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)"><span>'+m+'</span><span style="font-weight:700;color:var(--rd)">'+ff(fixedExpByMonth[m])+'</span></div>';
    }).join('')||'<div style="font-size:11px;color:var(--mu)">데이터 없음</div>')
    +'</div>'
    +'</div>'
    +'</div></div>';
  wrap.innerHTML=html;
}

// ── DSR 유사 지표 (상환부담률) ──────────────────────────────────
function renderDsrCard(ym){
  var wrap=document.getElementById('d-dsr');
  if(!wrap)return;

  // 이번달 할부 납입예정액
  var insDue=0;var insRows=[];
  INSTALLMENTS.forEach(function(item){
    var st=getInsStatus(item,ym);
    if(!st.done&&!st.notStarted){insDue+=st.amount;insRows.push({name:item.name,amt:st.amount,num:st.num,total:item.totalMonths});}
  });
  // 부채 이자비용 추정 (레버리지 카드와 동일 로직)
  var am=getAssets(ym);
  var debtInterest=0;var debtRows=[];
  AI.filter(function(a){return a.d&&a.rate>0;}).forEach(function(a){
    var bal=Number(am[a.n])||0;
    var interest=Math.round(bal*a.rate/100/12);
    debtInterest+=interest;
    if(interest>0)debtRows.push({name:a.n,bal:bal,rate:a.rate,interest:interest});
  });
  // 대출상환(원금상환 성격) 이번달 기록액
  var loanRepay=0;var loanRows=[];
  getTxs(ym).forEach(function(t){
    if(t.type==='저축'&&t.sub==='대출상환'){loanRepay+=Number(t.amount)||0;loanRows.push(t);}
  });

  var totalBurden=insDue+debtInterest+loanRepay;
  if(!totalBurden){wrap.innerHTML='';return;}

  // 평균 월수입(전체 기간, 총수입 vs 고정수입)
  var months=getAllMonths();
  var totalInc=0,totalFixedInc=0;
  var allTxs=loadDB().txs||[];
  allTxs.forEach(function(t){
    if(t.type==='수입'){totalInc+=Number(t.amount)||0;if(FIXED_INCOME_SUBS.indexOf(t.sub)>=0)totalFixedInc+=Number(t.amount)||0;}
  });
  var avgInc=months.length?totalInc/months.length:0;
  var avgFixedInc=months.length?totalFixedInc/months.length:0;

  var dsrTotal=avgInc>0?Math.round(totalBurden/avgInc*100):0;
  var dsrFixed=avgFixedInc>0?Math.round(totalBurden/avgFixedInc*100):0;
  function dsrColor(v){return v>=40?'var(--rd)':v>=25?'var(--yw)':'var(--gn)';}

  var html='<div class="card"><div class="card-title">💳 상환부담률 (DSR 유사) <span style="font-size:11px;color:var(--mu);font-weight:400;text-transform:none;letter-spacing:0">· '+ym+' 기준</span></div>'
    +'<div class="dtl-card" id="dtl-dsr" onclick="toggleDtl(\'dtl-dsr\')">'
    +'<div class="g4 mb12">'
    +'<div class="kpi"><div class="kl">할부 납입</div><div class="kv" style="font-size:16px">'+f(insDue)+'</div><div class="kb" style="background:var(--mu2)"></div></div>'
    +'<div class="kpi"><div class="kl">부채 이자(추정)</div><div class="kv" style="font-size:16px">'+f(debtInterest)+'</div><div class="kb" style="background:var(--mu2)"></div></div>'
    +'<div class="kpi"><div class="kl">대출상환</div><div class="kv" style="font-size:16px">'+f(loanRepay)+'</div><div class="kb" style="background:var(--mu2)"></div></div>'
    +'<div class="kpi"><div class="kl">월 상환부담 합계</div><div class="kv" style="font-size:16px;color:var(--rd)">'+f(totalBurden)+'</div><div class="kb" style="background:var(--rd)"></div></div>'
    +'</div>'
    +'<div class="g2 mb8">'
    +'<div class="kpi"><div class="kl">평균 총수입 대비</div><div class="kv" style="color:'+dsrColor(dsrTotal)+'">'+dsrTotal+'%</div><div class="kb" style="background:'+dsrColor(dsrTotal)+'"></div></div>'
    +'<div class="kpi"><div class="kl">평균 고정수입 대비</div><div class="kv" style="color:'+dsrColor(dsrFixed)+'">'+dsrFixed+'%</div><div class="kb" style="background:'+dsrColor(dsrFixed)+'"></div></div>'
    +'</div>'
    +'<div style="font-size:11px;color:var(--mu)">통상 40% 이상이면 상환부담이 높은 편으로 봐요. 변동수입 의존도가 높다면 "고정수입 대비" 쪽을 더 보수적으로 참고하세요.</div>'
    +'<div class="dtl-hint">눌러서 구성 내역 상세보기 ▾</div>'
    +'<div class="dtl-body">'
    +(insRows.length?'<div style="font-size:11px;font-weight:700;margin-bottom:4px">💳 할부 항목</div>'+insRows.map(function(x){return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 2px;border-bottom:1px solid var(--bd)"><span>'+x.name+' ('+x.num+'/'+x.total+'회차)</span><span style="font-weight:700">'+ff(x.amt)+'</span></div>';}).join(''):'')
    +(debtRows.length?'<div style="font-size:11px;font-weight:700;margin:10px 0 4px">⚠️ 부채별 이자</div>'+debtRows.map(function(x){return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 2px;border-bottom:1px solid var(--bd)"><span>'+x.name+' (잔액 '+ff(x.bal)+' · 금리 '+x.rate+'%)</span><span style="font-weight:700;color:var(--rd)">'+ff(x.interest)+'</span></div>';}).join(''):'')
    +(loanRows.length?'<div style="font-size:11px;font-weight:700;margin:10px 0 4px">🏦 대출상환 내역</div>'+loanRows.map(function(t){return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:5px 2px;border-bottom:1px solid var(--bd)"><span>'+(t.date||'').slice(5)+' '+(t.memo||'')+'</span><span style="font-weight:700">'+ff(t.amount)+'</span></div>';}).join(''):'')
    +'</div>'
    +'</div>'
    +'</div>';
  wrap.innerHTML=html;
}

// ── 절세계좌 한도 활용률 (ISA / 연금저축 / IRP) ──────────────────
// 기본값은 2026년 기준 통상적인 한도예요. 세법은 계속 바뀌니 직접 수정할 수 있게 해뒀어요.
var TAXLIMIT_KEY='gaegyebu_tax_limits';
var DEFAULT_TAX_LIMITS={isa:40000000,pension:6000000,combined:9000000};
function loadTaxLimits(){
  try{var s=localStorage.getItem(TAXLIMIT_KEY);return s?JSON.parse(s):Object.assign({},DEFAULT_TAX_LIMITS);}catch(e){return Object.assign({},DEFAULT_TAX_LIMITS);}
}
function saveTaxLimits(t){localStorage.setItem(TAXLIMIT_KEY,JSON.stringify(t));}
function renderTaxLimitCard(ym){
  var wrap=document.getElementById('d-taxlimit');
  if(!wrap)return;
  var year=ym.slice(0,4);
  var limits=loadTaxLimits();
  var allTxs=loadDB().txs||[];
  var isaPaid=0,pensionPaid=0,irpPaid=0;
  var isaRows=[],pensionRows=[],irpRows=[];
  allTxs.forEach(function(t){
    if(t.date&&t.date.slice(0,4)===year&&(t.type==='저축'||t.type==='지출')){
      if(t.sub==='ISA'){isaPaid+=Number(t.amount)||0;isaRows.push(t);}
      else if(t.sub==='연금저축펀드'){pensionPaid+=Number(t.amount)||0;pensionRows.push(t);}
      else if(t.sub==='IRP'){irpPaid+=Number(t.amount)||0;irpRows.push(t);}
    }
  });
  if(!isaPaid&&!pensionPaid&&!irpPaid){wrap.innerHTML='';return;}

  var jeonguemEligible=Math.min(pensionPaid,limits.pension);
  var irpEligible=Math.min(irpPaid,Math.max(limits.combined-jeonguemEligible,0));
  var combinedEligible=jeonguemEligible+irpEligible;
  var isaPct=limits.isa>0?Math.round(isaPaid/limits.isa*100):0;
  var combinedPct=limits.combined>0?Math.round(combinedEligible/limits.combined*100):0;

  function mkBar(label,paid,limit,pct,note){
    var color=pct>=100?'var(--gn)':pct>=70?'var(--bl)':pct>=40?'var(--yw)':'var(--rd)';
    return'<div style="margin-bottom:10px">'
      +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'
      +'<span style="font-weight:700">'+label+'</span>'
      +'<span>'+ff(paid)+' / '+ff(limit)+' <b style="color:'+color+'">('+pct+'%)</b></span>'
      +'</div>'
      +'<div style="height:8px;background:var(--sf3);border-radius:4px;overflow:hidden">'
      +'<div style="width:'+Math.min(pct,100)+'%;height:100%;background:'+color+';border-radius:4px"></div></div>'
      +(note?'<div style="font-size:10px;color:var(--mu);margin-top:2px">'+note+'</div>':'')
      +'</div>';
  }
  function txRows(rows){
    return rows.length?rows.sort(function(a,b){return(b.date||'')>(a.date||'')?1:-1;}).map(function(t){
      return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)"><span>'+(t.date||'')+' '+(t.memo||'')+'</span><span style="font-weight:700">'+ff(t.amount)+'</span></div>';
    }).join(''):'<div style="font-size:11px;color:var(--mu)">내역 없음</div>';
  }

  var html='<div class="card"><div class="card-title">🏦 '+year+'년 절세계좌 한도 활용률 <button onclick="openTaxLimitSetup()" class="btn bg2 bsm" style="margin-left:auto;padding:3px 9px;font-size:11px">⚙️ 한도 수정</button></div>'
    +'<div class="dtl-card" id="dtl-tax" onclick="toggleDtl(\'dtl-tax\')">';
  if(isaPaid>0)html+=mkBar('ISA (연간 납입한도)',isaPaid,limits.isa,isaPct);
  if(pensionPaid>0||irpPaid>0){
    html+=mkBar('연금저축+IRP (세액공제 합산한도)',combinedEligible,limits.combined,combinedPct,'연금저축 '+ff(pensionPaid)+' + IRP '+ff(irpPaid)+' 납입 중 세액공제 인정분 기준');
    if(combinedPct<100){
      var remain=limits.combined-combinedEligible;
      html+='<div style="font-size:11px;color:var(--pu);font-weight:700">💡 연말까지 '+ff(remain)+' 더 넣으면 한도를 다 채울 수 있어요 (놓치면 세액공제 기회 손실)</div>';
    }
  }
  html+='<div class="dtl-hint">눌러서 납입 내역 상세보기 ▾</div>'
    +'<div class="dtl-body">'
    +(isaPaid>0?'<div style="font-size:11px;font-weight:700;margin-bottom:4px">ISA 납입 내역</div>'+txRows(isaRows):'')
    +(pensionPaid>0?'<div style="font-size:11px;font-weight:700;margin:8px 0 4px">연금저축펀드 납입 내역</div>'+txRows(pensionRows):'')
    +(irpPaid>0?'<div style="font-size:11px;font-weight:700;margin:8px 0 4px">IRP 납입 내역</div>'+txRows(irpRows):'')
    +'</div>'
    +'</div>'
    +'</div>';
  wrap.innerHTML=html;
}
function openTaxLimitSetup(){
  var limits=loadTaxLimits();
  var existing=document.getElementById('taxlimit-md');if(existing)existing.remove();
  var md=document.createElement('div');md.className='mdbg on';md.id='taxlimit-md';
  md.innerHTML='<div class="md">'
    +'<div class="mdh"><h3>⚙️ 절세계좌 한도 수정</h3><button class="mdc" onclick="document.getElementById(\'taxlimit-md\').remove()">✕</button></div>'
    +'<div style="font-size:11px;color:var(--mu);margin-bottom:8px">세법 개정으로 한도가 바뀌면 여기서 직접 수정하세요.</div>'
    +'<div><label>ISA 연간 납입한도(원)</label><input type="number" id="tl-isa" value="'+limits.isa+'" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit"></div>'
    +'<div class="mt8"><label>연금저축 세액공제 한도(원)</label><input type="number" id="tl-pension" value="'+limits.pension+'" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit"></div>'
    +'<div class="mt8"><label>연금저축+IRP 합산 세액공제 한도(원)</label><input type="number" id="tl-combined" value="'+limits.combined+'" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit"></div>'
    +'<div class="fx g8 mt8">'
    +'<button class="btn bp" onclick="confirmTaxLimitSetup()">💾 저장</button>'
    +'<button class="btn bg2" onclick="document.getElementById(\'taxlimit-md\').remove()">취소</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(md);
}
function confirmTaxLimitSetup(){
  var limits={
    isa:Number(document.getElementById('tl-isa').value)||DEFAULT_TAX_LIMITS.isa,
    pension:Number(document.getElementById('tl-pension').value)||DEFAULT_TAX_LIMITS.pension,
    combined:Number(document.getElementById('tl-combined').value)||DEFAULT_TAX_LIMITS.combined
  };
  saveTaxLimits(limits);
  document.getElementById('taxlimit-md').remove();
  renderAst();
  showToast('✅ 한도가 저장됐어요!');
}

function renderLeverageCard(ym,am,r){
  var wrap=document.getElementById('d-leverage');
  if(!wrap)return;

  if(r.td<=0){
    wrap.innerHTML='<div class="card"><div class="card-title">⚠️ 레버리지 리스크</div><div class="em">등록된 부채가 없어요 — 레버리지 리스크 없이 순자산을 쌓고 계세요 👍</div></div>';
    return;
  }

  var ratio=r.nw>0?Math.round(r.td/r.nw*100):999;
  var riskColor=ratio<20?'var(--gn)':ratio<40?'var(--yw)':'var(--rd)';
  var riskLabel=ratio<20?'안전':ratio<40?'주의':'위험';

  // 투자성 자산(주식/코인 등 cat='투자')만 시장충격 스트레스 테스트 대상으로 삼는다.
  // (연금/보험/부동산 등은 원금 변동성이 낮거나 다른 성격의 자산이라 제외)
  var investAssetTotal=AI.filter(function(a){return!a.d&&a.cat==='투자';})
    .reduce(function(s,a){return s+(Number(am[a.n])||0);},0);
  var otherAssetTotal=r.ta-investAssetTotal;
  var scenarios=[0,-10,-20,-30,-40].map(function(dropPct){
    var newInvest=Math.round(investAssetTotal*(1+dropPct/100));
    var newTa=otherAssetTotal+newInvest;
    var newNw=newTa-r.td;
    var newRatio=newNw>0?Math.round(r.td/newNw*100):999;

function confirmEditAsset(i){
  var name=document.getElementById('east-name').value.trim();
  if(!name){showToast('⚠️ 이름을 입력해주세요.');return;}
  var emoji=document.getElementById('east-emoji').value.trim()||'💰';
  var cat=document.getElementById('east-cat').value;
  var isDebt=cat==='부채';
  var rate=isDebt?(Number(document.getElementById('east-rate').value)||0):0;
  var autoSub=isDebt?'':(document.getElementById('east-auto').value||'');
  var oldName=AI[i]?AI[i].n:null;
  var migratedMonths=0;
  if(oldName&&oldName!==name){
    // 이름이 바뀌면, 과거 월별 자산 스냅샷에 남아있던 옛 이름의 값도 새 이름으로 같이 옮겨준다.
    // (안 그러면 "아반떼"였던 시절 값이 "자동차(G80)"라는 새 이름과 연결이 끊겨서 과거 달에는 안 보이게 됨)
    var db=loadDB();var assets=db.assets||{};var changed=false;
    Object.keys(assets).forEach(function(ym){
      var am=assets[ym];if(!am)return;
      if(Object.prototype.hasOwnProperty.call(am,oldName)){
        if(!Object.prototype.hasOwnProperty.call(am,name)){
          am[name]=am[oldName];
          migratedMonths++;
        }
        delete am[oldName];
        changed=true;
      }
    });
    if(changed){saveDB(db);}
  }
  updateAssetItem(i,{n:name,emoji:emoji,cat:cat,d:isDebt,rate:rate,autoSub:autoSub});
  document.getElementById('edit-asset-md').remove();
  renderAst();

function findOrphanedAssetKeys(){
  var db=loadDB();var assets=db.assets||{};
  var currentNames=AI.map(function(a){return a.n;});
  var orphans={};
  Object.keys(assets).sort().forEach(function(ym){
    var am=assets[ym];if(!am)return;
    Object.keys(am).forEach(function(k){
      if(currentNames.indexOf(k)<0&&(Number(am[k])||0)!==0){
        if(!orphans[k])orphans[k]={months:[],total:0};
        orphans[k].months.push(ym);
        orphans[k].total+=Number(am[k])||0;
      }
    });
  });
  return orphans;
}

function mergeOrphanKey(oldKey,ki){
  var sel=document.getElementById('orphan-target-'+ki);
  var target=sel?sel.value:'';
  if(!target){showToast('⚠️ 연결할 항목을 선택해주세요.');return;}
  var db=loadDB();var assets=db.assets||{};var count=0;
  Object.keys(assets).forEach(function(ym){
    var am=assets[ym];if(!am)return;
    if(Object.prototype.hasOwnProperty.call(am,oldKey)){
      if(!Object.prototype.hasOwnProperty.call(am,target)||!am[target])am[target]=am[oldKey];
      delete am[oldKey];
      count++;
    }
  });
  saveDB(db);
  showToast('✅ "'+oldKey+'" → "'+target+'"로 '+count+'개월치 데이터를 옮겼어요.');
  var mdEl=document.getElementById('orphan-md');if(mdEl)mdEl.remove();
  renderAst();
}

  removeAssetItem(i);
  renderAst();
  showToast('🗑️ 삭제됐어요.');
}

  if(/KDB/i.test(text))return'종신(KDB)';

}

// 시트명이 YYYY-MM 형식인 시트들을 찾아서, 각 시트의 두 데이터 블록(날짜/대분류/중분류/소분류/금액/내용/거래출처/지출평가)을 읽는다.
var HOME_XLSX_CAT_MAP={

};
function importHomeXlsx(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
      var monthSheets=wb.SheetNames.filter(function(n){return/^\d{4}-\d{2}$/.test(n.trim());});
      if(!monthSheets.length){showToast('❌ "YYYY-MM" 형식의 월별 시트를 못 찾았어요.');return;}

      var imported=[];var skipped=0;
      monthSheets.forEach(function(sheetName){
        var ws=wb.Sheets[sheetName];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
        // 헤더 행(보통 3번째 행, 0-based idx 2)에서 "날짜(일)"이 있는 컬럼들을 블록 시작점으로 찾는다
        var headerRow=rows[2]||[];
        var blockStarts=[];
        headerRow.forEach(function(h,ci){if((h||'').toString().indexOf('날짜')>=0)blockStarts.push(ci);});
        blockStarts.forEach(function(ci){
          for(var r=3;r<rows.length;r++){
            var row=rows[r];if(!row)continue;
            var day=row[ci],typ=row[ci+1],mid=row[ci+2],sub=row[ci+3],amt=row[ci+4],memo=row[ci+5],pay=row[ci+6],ev=row[ci+7];
            if(day===undefined&&typ===undefined&&amt===undefined)continue;
            if(typeof day!=='number'||!typ||!mid||!sub||typeof amt!=='number'){continue;}
            if((typ!=='지출'&&typ!=='수입'&&typ!=='저축')){skipped++;continue;}
            var dateStr=sheetName+'-'+String(day).padStart(2,'0');
            var key=mid+'|'+sub;
            var mapped=HOME_XLSX_CAT_MAP[key];
            var fMid=mid,fSub=sub;
            if(mapped){var parts=mapped.split('|');fMid=parts[0];fSub=parts[1];}
            else if(!(CATS[mid]&&CATS[mid].s.indexOf(sub)>=0)){
              // CATS에 없는 조합인데 매핑표에도 없으면 안전하게 대분류의 "기타" 계열로
              fMid=typ==='수입'?'수입':(typ==='저축'?'저축':'생활');
              fSub=typ==='수입'?'기타수입':(typ==='저축'?'연금저축펀드':'기타생활비');
            }
            var payNorm=pay?normalizePayment(pay):'';
            var evalNorm=(typ==='지출'&&(ev==='소비'||ev==='낭비'||ev==='투자'))?ev:'';
            imported.push({
              id:mkId(),date:dateStr,type:typ,mid:fMid,sub:fSub,
              amount:Math.abs(Math.round(Number(amt))),memo:(memo||'').toString(),payment:payNorm,
              eval:evalNorm,fixed:false
            });
          }
        });
      });

      if(!imported.length){showToast('❌ 가져올 데이터가 없어요.');return;}
      showBsPreview(imported,skipped,0,0,[]);
    }catch(err){
      console.error('개인 가계부 파싱 오류:',err);
      showToast('❌ 파싱 오류: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
}

function importBankSalad(e){
  var file=e.target.files[0];if(!file)return;
  var isExcel=/\.xlsx?$/i.test(file.name);
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var rows; // 2차원 배열: rows[0]=헤더, rows[i]=[날짜,시간,타입,대분류,소분류,내용,금액,화폐,결제수단,메모]
      if(isExcel){
        var wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
        // "가계부 내역" 시트를 우선 찾고, 없으면 첫 시트 사용
        var sheetName=wb.SheetNames.find(function(n){return n.indexOf('가계부')>=0;})||wb.SheetNames[0];
        rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,raw:false,dateNF:'yyyy-mm-dd'});
      }else{
        var text=ev.target.result;
        if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
        rows=text.split('\n').filter(function(l){return l.trim();}).map(function(l){
          return l.split(',').map(function(c){return c.trim().replace(/"/g,'');});
        });
      }
      if(!rows||rows.length<2){showToast('❌ 빈 파일이에요.');return;}

      var header=rows[0].map(function(h){return(h||'').toString().trim();});
      function findCol(names){
        for(var i=0;i<names.length;i++){
          var idx=header.findIndex(function(h){return h.indexOf(names[i])>=0;});
          if(idx>=0)return idx;
        }
        return -1;
      }
      var dateIdx=findCol(['날짜','일자','거래일']);
      var typeIdx=findCol(['타입','수입/지출','구분']);
      var midIdx=findCol(['대분류','카테고리','분류']);
      var subIdx=findCol(['소분류']);
      var contentIdx=findCol(['내용','적요','가맹점']);
      var amtIdx=findCol(['금액','거래금액']);
      var payIdx=findCol(['결제수단','계좌','카드']);
      var memoIdx2=findCol(['메모']);

      if(dateIdx<0||amtIdx<0){
        showToast('❌ 형식을 인식 못했어요. 헤더를 확인해주세요.');
        console.log('헤더목록:', header);
        return;
      }

      var imported=[];var skipped=0;var skippedTransfer=0;var skippedUnknownSaving=0;
      for(var i=1;i<rows.length;i++){
        var cols=rows[i];if(!cols||!cols.length)continue;
        var dateRaw=(cols[dateIdx]||'').toString();
        var typeRaw=typeIdx>=0?(cols[typeIdx]||'').toString():'지출';
        var midRaw=midIdx>=0?(cols[midIdx]||'').toString().trim():'';
        var subRaw=subIdx>=0?(cols[subIdx]||'').toString().trim():'';
        var contentRaw=contentIdx>=0?(cols[contentIdx]||'').toString():'';
        var amtRaw=(cols[amtIdx]||'0').toString();
        var payRaw=payIdx>=0?(cols[payIdx]||'').toString():'';
        var memoRaw2=memoIdx2>=0?(cols[memoIdx2]||'').toString():'';

        // 날짜 파싱
        var dateStr=dateRaw.replace(/[./]/g,'-').slice(0,10);
        if(dateStr.length!==10||dateStr[4]!=='-'||dateStr[7]!=='-'){skipped++;continue;}

        // 금액 파싱 (뱅크샐러드는 지출 음수/수입 양수로 나옴 → 절대값)
        var amt=Math.abs(parseInt(amtRaw.replace(/[^0-9-]/g,''))||0);
        if(!amt){skipped++;continue;}

        // 타입 판단
        var txType='지출';
        if(typeRaw.indexOf('수입')>=0)txType='수입';
        else if(typeRaw.indexOf('이체')>=0)txType='이체';

        var mid,sub;
        if(txType==='이체'){
          // 저축성 이체만 살리고(내용/메모/결제수단에서 상품 추정), 나머지 내부계좌이체는 건너뜀
          if(midRaw!=='저축'){skippedTransfer++;continue;}
          var guessSub=classifySavingsSub(contentRaw+' '+memoRaw2+' '+payRaw);
          if(!guessSub){skippedUnknownSaving++;continue;}
          txType='저축';mid='저축';sub=guessSub;
        }else{
          var key=midRaw+'|'+subRaw;
          var mapped=BS_CAT_MAP[key];
          if(!mapped){
            // 소분류 매핑 실패시 대분류만으로 재시도(같은 대분류의 "미분류" 매핑을 폴백으로 사용)
            mapped=BS_CAT_MAP[midRaw+'|미분류'];
          }
          if(mapped){
            var parts=mapped.split('|');mid=parts[0];sub=parts[1];
          }else{
            mid=txType==='수입'?'수입':'생활';sub=txType==='수입'?'기타수입':'기타생활비';
          }
        }

        var payNorm=normalizePayment(payRaw);

        imported.push({
          id:mkId(),date:dateStr,type:txType,
          mid:mid,sub:sub,
          amount:amt,memo:contentRaw||memoRaw2,payment:payNorm,
          eval:txType==='지출'?'소비':'',fixed:false
        });
      }

      if(!imported.length){showToast('❌ 가져올 데이터가 없어요.');return;}

      showBsPreview(imported, skipped, skippedTransfer, skippedUnknownSaving, []);
    }catch(err){
      console.error('가져오기 파싱 오류:', err);
      showToast('❌ 파싱 오류: '+err.message);
    }
  };
  if(isExcel)reader.readAsArrayBuffer(file);
  else reader.readAsText(file,'UTF-8');
  e.target.value='';
}

// ── 중복 거래 찾기/정리 ──────────────────────────────────────────
// 같은 날짜·타입·대분류·소분류·금액인데 메모/결제수단만 다른 경우까지 잡아낸다
// (수기입력과 뱅크샐러드 가져오기가 메모 표기만 달라서 중복체크를 피해간 케이스를 잡기 위함)
function findDuplicateGroups(){
  var db=loadDB();var txs=db.txs||[];
  var groups={};
  txs.forEach(function(t){
    var key=[t.date,t.type,t.mid,t.sub,t.amount].join('|');
    if(!groups[key])groups[key]=[];
    groups[key].push(t);
  });
  return Object.keys(groups).map(function(k){return groups[k];})
    .filter(function(g){return g.length>=2;})
    .sort(function(a,b){return(b.length*b[0].amount)-(a.length*a[0].amount);});
}
function openDupeCheck(){
  var groups=findDuplicateGroups();
  var existing=document.getElementById('dupe-md');if(existing)existing.remove();
  var md=document.createElement('div');md.className='mdbg on';md.id='dupe-md';
  if(!groups.length){
    md.innerHTML='<div class="md"><div class="mdh"><h3>🔍 중복 거래 정리</h3><button class="mdc" onclick="document.getElementById(\'dupe-md\').remove()">✕</button></div><div class="em">중복으로 보이는 거래가 없어요 👍</div></div>';
    document.body.appendChild(md);return;
  }
  var totalExtra=groups.reduce(function(s,g){return s+(g.length-1);},0);
  var totalExtraAmt=groups.reduce(function(s,g){return s+(g.length-1)*g[0].amount;},0);
  var html='<div class="md" style="width:720px;max-width:96vw;max-height:85vh;overflow-y:auto">'
    +'<div class="mdh"><h3>🔍 중복 거래 정리</h3><button class="mdc" onclick="document.getElementById(\'dupe-md\').remove()">✕</button></div>'
    +'<div class="al wrn mb8" style="font-size:12px">같은 날짜·금액·카테고리로 2번 이상 잡힌 그룹 '+groups.length+'개, 초과분 '+totalExtra+'건(약 '+ff(totalExtraAmt)+') 발견했어요. 메모/결제수단이 달라도 같은 거래로 보고 잡았어요 — 진짜 중복인지 아래에서 확인하고 정리하세요.</div>'
    +'<div class="fx g8 mb8"><button class="btn br" onclick="cleanupAllDupes()">🧹 전체 일괄 정리 (그룹당 가장 오래된 1건만 남기기)</button></div>'
    +'<div id="dupe-list">';
  groups.forEach(function(g,gi){
    var t0=g[0];
    html+='<div id="dupe-grp-'+gi+'" style="background:var(--sf2);border-radius:8px;padding:10px;margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">'
      +'<span style="font-size:12px;font-weight:700">'+t0.date+' · '+(CE[t0.mid]||'')+' '+t0.mid+' &gt; '+t0.sub+' · '+ff(t0.amount)+'</span>'
      +'<span style="display:flex;gap:6px;align-items:center">'
      +'<span class="bk br" style="font-size:10px">'+g.length+'건 중복</span>'
      +'<button class="btn bg2 bsm" style="padding:3px 8px;font-size:10px" onclick="cleanupOneDupe('+gi+')">1건만 남기기</button>'
      +'</span></div>'
      +'<div style="font-size:11px;color:var(--mu);margin-top:4px">'+g.map(function(t){return'"'+(t.memo||'(메모없음)')+'"'+(t.payment?' · '+t.payment:'');}).join('&nbsp;&nbsp;/&nbsp;&nbsp;')+'</div>'
      +'</div>';
  });
  html+='</div></div>';
  md.innerHTML=html;
  document.body.appendChild(md);
  window._dupeGroups=groups;
}
function cleanupOneDupe(gi){
  var groups=window._dupeGroups||[];
  var g=groups[gi];if(!g||g.length<2)return;
  var db=loadDB();
  var removeIds=g.slice(1).map(function(t){return t.id;});
  db.txs=db.txs.filter(function(t){return removeIds.indexOf(t.id)<0;});
  saveDB(db);
  var row=document.getElementById('dupe-grp-'+gi);
  if(row)row.remove();
  showToast('🧹 '+removeIds.length+'건 정리했어요.');
  if(curPage==='inp'){renderInpDash();renderHis();}
  else if(curPage==='dash')renderDash();
}
function cleanupAllDupes(){
  var groups=window._dupeGroups||[];
  if(!groups.length)return;
  var totalExtra=groups.reduce(function(s,g){return s+(g.length-1);},0);
  if(!confirm('총 '+totalExtra+'건을 삭제해서 정리할게요 (각 그룹 가장 오래된 1건만 남김). 계속할까요?'))return;
  var db=loadDB();
  var removeIds=[];
  groups.forEach(function(g){g.slice(1).forEach(function(t){removeIds.push(t.id);});});
  var removeSet={};removeIds.forEach(function(id){removeSet[id]=true;});
  db.txs=db.txs.filter(function(t){return!removeSet[t.id];});
  saveDB(db);
  var mdEl=document.getElementById('dupe-md');if(mdEl)mdEl.remove();
  showToast('🧹 '+removeIds.length+'건 일괄 정리 완료!');
  if(curPage==='inp'){renderInpDash();renderHis();}
  else if(curPage==='dash')renderDash();
}

function confirmBsImport(){
  var txs=window._bsTxs||[];
  if(!txs.length)return;
  var db=loadDB();
  if(!db.txs)db.txs=[];
  // 중복 체크 (날짜+금액+대분류+소분류+메모 - 메모까지 다 같아야 중복으로 봄)
  var existKeys={};
  db.txs.forEach(function(t){existKeys[t.date+'|'+t.amount+'|'+t.mid+'|'+t.sub+'|'+t.memo]=true;});
  var batchId='imp_'+Date.now();
  var added=0;
  txs.forEach(function(t){
    var key=t.date+'|'+t.amount+'|'+t.mid+'|'+t.sub+'|'+t.memo;
    if(!existKeys[key]){t.importBatch=batchId;db.txs.push(t);added++;}
  });
  saveDB(db);
  if(added>0){
    localStorage.setItem('gaegyebu_last_import_batch',JSON.stringify({id:batchId,count:added,at:new Date().toISOString()}));
  }
  document.getElementById('bs-preview-md').remove();
  showToast('✅ '+added+'건 가져오기 완료! (중복 '+(txs.length-added)+'건 스킵)'+(added>0?' · 실수했으면 "가져오기 취소" 버튼으로 되돌릴 수 있어요':''));
  if(curPage==='inp'){renderInpDash();renderHis();buildImportUndoBtn();}
  else if(curPage==='dash')renderDash();
}
function buildImportUndoBtn(){
  var wrap=document.getElementById('import-undo-wrap');
  if(!wrap)return;
  var last=null;
  try{last=JSON.parse(localStorage.getItem('gaegyebu_last_import_batch')||'null');}catch(e){}
  if(!last){wrap.innerHTML='';return;}
  wrap.innerHTML='<div class="al wrn" style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px">'
    +'<span>📥 방금 가져온 '+last.count+'건 ('+new Date(last.at).toLocaleString()+')</span>'
    +'<button class="btn br bsm" onclick="undoLastImport()" style="padding:4px 10px;font-size:11px">↩️ 이 가져오기 취소</button>'
    +'</div>';
}
function undoLastImport(){
  var last=null;
  try{last=JSON.parse(localStorage.getItem('gaegyebu_last_import_batch')||'null');}catch(e){}
  if(!last){showToast('취소할 가져오기 기록이 없어요.');return;}
  if(!confirm(last.count+'건을 삭제해서 가져오기 전 상태로 되돌릴까요?'))return;
  var db=loadDB();
  var before=db.txs.length;
  db.txs=db.txs.filter(function(t){return t.importBatch!==last.id;});
  var removed=before-db.txs.length;
  saveDB(db);
  localStorage.removeItem('gaegyebu_last_import_batch');
  showToast('↩️ '+removed+'건 삭제해서 되돌렸어요.');
  buildImportUndoBtn();
  if(curPage==='inp'){renderInpDash();renderHis();}
  else if(curPage==='dash')renderDash();
}

// ── 토스증권 API 연동 ────────────────────────────────────
function loadTossConfig(){
  try{
    return JSON.parse(localStorage.getItem('toss_config')||'{}');
  }catch(e){return{};}
}
function saveTossConfigLocal(cfg){
  localStorage.setItem('toss_config', JSON.stringify(cfg));
}
function toggleTossSetup(){
  var el=document.getElementById('toss-setup');
  if(!el)return;
  var isOpen=el.style.display!=='none';
  el.style.display=isOpen?'none':'block';
  if(!isOpen){
    var cfg=loadTossConfig();
    if(document.getElementById('toss-cid'))document.getElementById('toss-cid').value=cfg.clientId||'';
    if(document.getElementById('toss-acc'))document.getElementById('toss-acc').value=cfg.accountSeq||'';
    // Client Secret은 로컬에 저장하지 않으므로 다시 채우지 않음 (보안)
  }
}
function saveTossConfig(){
  var clientId=document.getElementById('toss-cid').value.trim();
  var clientSecret=document.getElementById('toss-secret').value.trim();
  var accountSeq=document.getElementById('toss-acc').value.trim();
  if(!clientId){showToast('⚠️ Client ID를 입력해주세요.');return;}
  // Client Secret은 서버(Apps Script)에만 저장하고 브라우저에는 남기지 않음
  saveTossConfigLocal({clientId:clientId,accountSeq:accountSeq});

  var url=localStorage.getItem(SERVER_URL_KEY)||DEFAULT_SERVER_URL;
  if(!url){showToast('⚠️ 서버 URL이 설정되지 않았어요. 서버설정에서 먼저 연결해주세요.');return;}

  showToast('💾 서버에 저장 중...');
  fetch(url,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'saveTossConfig',clientId:clientId,clientSecret:clientSecret,accountSeq:accountSeq})
  }).then(function(r){return r.json();})
    .then(function(res){
      if(res&&res.ok){
        showToast('✅ 토스증권 연동 정보 저장 완료!');
        document.getElementById('toss-secret').value=''; // 서버 전송 후 화면에서 비움
        document.getElementById('toss-status').textContent='연동 설정됨';
        document.getElementById('toss-status').style.color='var(--gn)';
        if(!accountSeq)showToast('💡 "🔍 계좌 조회"를 눌러서 계좌 Seq도 찾아보세요.');
        else toggleTossSetup();
      }else{
        showToast('❌ 저장 실패: '+(res&&res.error||'알 수 없는 오류'));
      }
    })
    .catch(function(e){showToast('❌ 서버 연결 실패: '+e.message);});
}
function lookupTossAccounts(){
  var cfg=loadTossConfig();
  if(!cfg.clientId){showToast('⚠️ 먼저 Client ID/Secret을 입력하고 "💾 저장"을 눌러주세요.');return;}
  var url=localStorage.getItem(SERVER_URL_KEY)||DEFAULT_SERVER_URL;
  if(!url){showToast('⚠️ 서버 URL이 설정되지 않았어요.');return;}
  var accEl=document.getElementById('toss-accounts');
  if(accEl)accEl.innerHTML='<div style="font-size:11px;color:var(--mu)">⏳ 계좌 조회 중...</div>';
  fetch(url,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'getTossAccounts'})
  }).then(function(r){return r.json();})
    .then(function(res){
      if(!res||!res.ok){
        if(accEl)accEl.innerHTML='';
        showToast('❌ 계좌 조회 실패: '+(res&&res.error||'알 수 없는 오류'));
        return;
      }
      var accounts=res.accounts||[];
      if(!accounts.length){
        if(accEl)accEl.innerHTML='<div style="font-size:11px;color:var(--mu)">조회된 계좌가 없어요.</div>';
        return;
      }
      if(!accEl)return;
      accEl.innerHTML='<div style="font-size:11px;color:var(--mu2);margin-bottom:4px">계좌를 선택하세요 ('+accounts.length+'개)</div>'
        +accounts.map(function(a){
          return '<div class="bud-sub-row" style="cursor:pointer" onclick="selectTossAccount(\''+a.accountSeq+'\')">'
            +'<span class="bud-sub-name">'+(a.accountNo||'')+' <span style="color:var(--mu);font-size:10px">('+(a.accountType||'')+')</span></span>'
            +'<span style="font-size:11px;color:var(--bl);font-weight:700">seq '+a.accountSeq+'</span>'
            +'</div>';
        }).join('');
      if(accounts.length===1)selectTossAccount(accounts[0].accountSeq);
    })
    .catch(function(e){
      if(accEl)accEl.innerHTML='';
      showToast('❌ 서버 연결 실패: '+e.message);
    });
}
function selectTossAccount(accountSeq){
  document.getElementById('toss-acc').value=accountSeq;
  var cfg=loadTossConfig();
  cfg.accountSeq=accountSeq;
  saveTossConfigLocal(cfg);
  showToast('✅ 계좌 선택됨 (seq '+accountSeq+') · 저장 버튼을 눌러 확정하세요');
}

var STOCK_PRINCIPAL_KEY='gaegyebu_stock_principal'; // 구버전(단일값) - 마이그레이션 용도로만 참조
var STOCK_PRINCIPAL_HIST_KEY='gaegyebu_stock_principal_hist';
function loadStockPrincipalHist(){try{return JSON.parse(localStorage.getItem(STOCK_PRINCIPAL_HIST_KEY)||'{}');}catch(e){return{};}}
function saveStockPrincipalHist(h){localStorage.setItem(STOCK_PRINCIPAL_HIST_KEY,JSON.stringify(h));}
// 해당 월에 직접 입력한 값이 있으면 그 값, 없으면 "그 이전 달 중 가장 최근에 입력된 값"을 그대로 이어서 보여준다(안 건드리면 원금은 그대로라는 뜻).
// 그보다 이전에 입력된 값이 하나도 없으면(즉 아직 원금을 넣기 전 시점) 0(=값 없음)을 반환한다.
function getRealTodayYM(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function getStockPrincipal(ym){
  var h=loadStockPrincipalHist();
  if(!Object.keys(h).length){
    // 구버전 단일값 마이그레이션: 있으면 "실제 오늘 날짜" 기준월로 1회성 이전 (보고 있던 달 아님!)
    var old=Number(localStorage.getItem(STOCK_PRINCIPAL_KEY));
    if(!isNaN(old)&&old>0){h[getRealTodayYM()]=old;saveStockPrincipalHist(h);localStorage.removeItem(STOCK_PRINCIPAL_KEY);}
  }
  if(!ym)ym=gYM();
  var months=Object.keys(h).sort().filter(function(m){return m<=ym;});
  if(!months.length)return 0;
  return Number(h[months[months.length-1]])||0;
}
function setStockPrincipal(v,ym){
  var h=loadStockPrincipalHist();
  if(!ym)ym=gYM();
  h[ym]=Number(v)||0;
  saveStockPrincipalHist(h);
}
function onStockPrincipalChange(el,ym){
  setStockPrincipal(Number(el.value)||0,ym||gYM());
  if(curPage==='stk')renderStock();
  else if(curPage==='ast')renderRealPLCard();
}
function renderStock(){
  var el=document.getElementById('d-stk');
  if(!el)return;
  var db=loadDB();
  var assets=db.assets||{};
  var allAM=Object.keys(assets).sort().filter(function(m){return m<=curYM;});
  if(!allAM.length){el.innerHTML='<div class="em">자산 데이터가 없어요</div>';return;}

  var latestYM=allAM[allAM.length-1];
  var latestAm=assets[latestYM]||{};
  var stockVal=Number(latestAm['주식계좌'])||0;
  var debt=AI.filter(function(a){return a.d;}).reduce(function(s,a){return s+(Number(latestAm[a.n])||0);},0);

  // 월별 주식계좌 변화
  var stockHist=allAM.map(function(ym){
    return {ym:ym, val:Number(assets[ym]['주식계좌'])||0};
  }).filter(function(x){return x.val>0;});

  // 월별 투자수입(실현수익) - 거래내역에서
  var txs=db.txs||[];
  var investByMonth={};
  txs.filter(function(t){return t.type==='수입'&&t.sub==='투자수입';}).forEach(function(t){
    var ym=(t.date||'').slice(0,7);
    if(!ym||ym>curYM)return;
    investByMonth[ym]=(investByMonth[ym]||0)+(Number(t.amount)||0);
  });
  var investMonths=Object.keys(investByMonth).sort();
  var totalRealized=Object.values(investByMonth).reduce(function(s,v){return s+v;},0);

  // 주식 순자산/부채 투입 비율
  // 가정: 주식계좌 자금 중 마통(부채)으로 투입된 비율 = min(debt, stockVal)/stockVal
  var debtInStock=Math.min(debt, stockVal);
  var equityInStock=Math.max(stockVal-debtInStock,0);
  var leverageRatio=stockVal>0?Math.round(debtInStock/stockVal*100):0;

  // 전월 대비 변화
  var prevVal=stockHist.length>1?stockHist[stockHist.length-2].val:stockVal;
  var momChange=stockVal-prevVal;
  var momPct=prevVal>0?((momChange/prevVal)*100).toFixed(1):'0';

  // 최초~현재 누적 성장
  var firstVal=stockHist.length?stockHist[0].val:stockVal;
  var totalGrowth=stockVal-firstVal;
  var totalGrowthPct=firstVal>0?((totalGrowth/firstVal)*100).toFixed(1):'0';

  var html='';

  // KPI 카드 5개
  html+='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px">';
  function kpi(label,val,color,sub){
    return '<div style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;position:relative;overflow:hidden">'
      +'<div style="font-size:10px;color:var(--mu);margin-bottom:3px">'+label+'</div>'

function syncTossHoldings(){
  var cfg=loadTossConfig();
  if(!cfg.clientId||!cfg.accountSeq){
    showToast('⚠️ 먼저 ⚙️ 설정에서 토스증권 연동 정보를 입력해주세요.');
    toggleTossSetup();
    return;
  }
  var url=localStorage.getItem(SERVER_URL_KEY)||DEFAULT_SERVER_URL;
  if(!url){showToast('⚠️ 서버 URL이 설정되지 않았어요.');return;}

  var msgEl=document.getElementById('toss-sync-msg');
  if(msgEl)msgEl.textContent='⏳ 토스증권에서 잔고 가져오는 중...';

  fetch(url,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'getTossHoldings',accountSeq:cfg.accountSeq})
  }).then(function(r){return r.json();})
    .then(function(res){
      if(!res||!res.ok){
        if(msgEl)msgEl.textContent='';
        showToast('❌ 동기화 실패: '+(res&&res.error||'서버에 getTossHoldings 함수가 아직 없어요.'));
        return;
      }
      renderTossHoldings(res.holdings||[], res.totalValue||0);
      // 자산 탭의 주식계좌 항목에 자동 입력
      var ym=gYM();
      var db=loadDB();
      if(!db.assets)db.assets={};
      if(!db.assets[ym])db.assets[ym]={};
      db.assets[ym]['주식계좌']=res.totalValue||0;
      saveDB(db);
      renderAst();
      if(msgEl)msgEl.textContent='✅ '+new Date().toLocaleTimeString()+' 동기화 완료';
      document.getElementById('toss-status').textContent='연동됨 · 평가금액 '+ff(res.totalValue||0);
      document.getElementById('toss-status').style.color='var(--gn)';
      showToast('✅ 토스증권 잔고 '+ff(res.totalValue||0)+' 동기화 완료!');
    })
    .catch(function(e){
      if(msgEl)msgEl.textContent='';
      showToast('❌ 동기화 실패: '+e.message);
    });
}

function renderTossHoldings(holdings, totalValue){
  var el=document.getElementById('toss-holdings');
  if(!el)return;
  if(!holdings.length){el.innerHTML='';return;}
  var rows=holdings.map(function(h){
    var pnlColor=(h.profitRate||0)>=0?'var(--rd)':'var(--bl)';
    return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)">'
      +'<span style="font-size:12px;flex:1">'+(h.name||h.symbol||'')+'</span>'
      +'<span style="font-size:11px;color:var(--mu)">'+(h.quantity||0)+'주</span>'
      +'<span style="font-size:12px;font-weight:700;min-width:90px;text-align:right">'+ff(h.evalAmount||0)+'</span>'
      +'<span style="font-size:11px;color:'+pnlColor+';min-width:55px;text-align:right">'+((h.profitRate||0)>=0?'+':'')+(h.profitRate||0).toFixed(1)+'%</span>'
      +'</div>';
  }).join('');
  el.innerHTML='<div style="font-size:11px;color:var(--mu2);margin-bottom:4px;font-weight:700">보유 종목 ('+holdings.length+'개) · 총 '+ff(totalValue)+'</div>'+rows;
}


function renderInpDash(){
  var ym=gYM();
  var sm=getMonthSummary(ym);
  var db=loadDB();
  var bg=db.budgets&&db.budgets[ym]?db.budgets[ym]:{};
  var ns=sm.income-sm.expense;
  var sr=sm.income>0?((ns/sm.income)*100).toFixed(1):'0';

  // 예산 사용 현황 계산
  var totalBudget=0;
  Object.keys(bg).forEach(function(mid){
    Object.keys(bg[mid]).forEach(function(sub){totalBudget+=(bg[mid][sub]||0);});
  });
  var budPct=totalBudget>0?Math.min(Math.round(sm.expense/totalBudget*100),999):0;
  var budColor=budPct>100?'var(--rd)':budPct>80?'var(--yw)':'var(--gn)';

  // 카테고리별 지출 top5
  var expTop=Object.entries(sm.byMid||{})
    .filter(function(e){return e[1]>0;})
    .sort(function(a,b){return b[1]-a[1];})
    .slice(0,5);
  var maxExp=expTop.length?expTop[0][1]:1;

  var el=document.getElementById('inp-dash');
  if(!el)return;
  el.innerHTML='';

  // KPI 행
  var kpiWrap=document.createElement('div');
  kpiWrap.style.cssText='display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px';

  function mkK(label,val,color,sub2){
    var d=document.createElement('div');
    d.style.cssText='background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;position:relative;overflow:hidden';
    d.innerHTML='<div style="font-size:10px;color:var(--mu);margin-bottom:3px">'+label+'</div>'
      +'<div style="font-size:16px;font-weight:900;color:'+color+'">'+((typeof val==='string'&&isNaN(Number(val.replace('%',''))))||typeof val==='string'&&val.includes('%')?val:f(val))+'</div>'
      +(sub2?'<div style="font-size:10px;color:var(--mu);margin-top:2px">'+sub2+'</div>':'')
      +'<div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:'+color+'"></div>';
    return d;
  }
  kpiWrap.appendChild(mkK('이달 수입',sm.income,'var(--gn)',ym.replace('-','년 ')+'월'));
  kpiWrap.appendChild(mkK('이달 지출',sm.expense,'var(--rd)',sm.income>0?'수입의 '+(sm.income>0?Math.round(sm.expense/sm.income*100):0)+'%':''));
  kpiWrap.appendChild(mkK('순저축',ns,ns>=0?'var(--bl)':'var(--rd)','수입-지출'));
  kpiWrap.appendChild(mkK('저축률',sr+'%','var(--yw)',''));
  // 예산 사용률
  var bd=document.createElement('div');
  bd.style.cssText='background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;position:relative;overflow:hidden';
  bd.innerHTML='<div style="font-size:10px;color:var(--mu);margin-bottom:3px">예산 사용률</div>'
    +'<div style="font-size:16px;font-weight:900;color:'+budColor+'">'+(totalBudget?budPct+'%':'미설정')+'</div>'
    +(totalBudget?'<div style="font-size:10px;color:var(--mu);margin-top:2px">'+ff(sm.expense)+' / '+ff(totalBudget)+'</div>':'<div style="font-size:10px;color:var(--mu);margin-top:2px">예산탭에서 설정하세요</div>')
    +'<div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:'+budColor+'"></div>';
  kpiWrap.appendChild(bd);
  el.appendChild(kpiWrap);

  // 하단: 지출 top5 바 + 소비/낭비/투자
  var bottomWrap=document.createElement('div');
  bottomWrap.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px';

  // 지출 top5
  var topCard=document.createElement('div');
  topCard.style.cssText='background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px';
  var topTitle=document.createElement('div');

  topTitle.textContent='🏆 이달 지출 TOP5';
  topCard.appendChild(topTitle);
  if(expTop.length){
    expTop.forEach(function(e){
      var name=e[0],amt=e[1];
      var pct2=Math.round(amt/maxExp*100);
      var color=MC[name]||'var(--bl)';

  var fixAmt=0,varAmt=0;
  txs.filter(function(t){return t.type==='지출';}).forEach(function(t){
    var a=Number(t.amount)||0;

    var a=Number(t.amount)||0;
    if(evalMap[t.eval]!==undefined)evalMap[t.eval]+=a;
  });
  var totalE=sm.expense||1;

  [{k:'소비',c:'var(--mu2)'},{k:'낭비',c:'var(--rd)'},{k:'투자',c:'var(--pu)'},{k:'저축',c:'var(--bl)'}].forEach(function(x){

// 연간 수입/저축 목표 (renderAnnual과 예산탭 백필이 공유)
var ANNUAL_INCOME_GOALS=[
  {sub:'레드윗 급여', goal:38890404},{sub:'AZ 급여',goal:18000000},
  {sub:'투자수입',goal:6000000},{sub:'돌보미수입',goal:3600000},
