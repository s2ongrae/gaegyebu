<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💰 내 가계부</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef5fc;--sf:#ffffff;--sf2:#ddeeff;--sf3:#cce4f7;--bd:#a8d5f5;--bd2:#7bc0ef;--tx:#1a365d;--mu:#4a6fa5;--mu2:#2c5282;--bl:#2b6cb0;--gn:#276749;--rd:#c53030;--yw:#b7791f;--pu:#553c9a;--cy:#0987a0;--r:12px;--rs:8px}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:14px;min-height:100vh}
.nav{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(240,247,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:2px;z-index:100;overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.logo{font-weight:900;font-size:14px;background:linear-gradient(135deg,var(--bl),var(--pu));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:10px;white-space:nowrap;flex-shrink:0}
.nb{background:none;border:none;color:var(--mu2);cursor:pointer;padding:6px 10px;border-radius:var(--rs);font-size:12px;font-weight:700;white-space:nowrap;transition:all .15s;font-family:inherit;flex-shrink:0}
.nb:hover{background:var(--sf2);color:var(--tx)}.nb.on{background:var(--sf2);color:var(--bl)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-r select{background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:4px 7px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit}
.sbar{position:fixed;top:50px;left:0;right:0;height:36px;background:var(--sf2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:8px;z-index:99;font-size:12px;overflow-x:auto}
.sbar::-webkit-scrollbar{display:none}
.si{color:var(--mu2);display:flex;align-items:center;gap:5px;flex-shrink:0}
.sm{margin-left:auto;display:flex;gap:5px;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--mu);flex-shrink:0}
.sync-dot.ok{background:var(--gn)}.sync-dot.err{background:var(--rd)}.sync-dot.syn{background:var(--yw);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{margin-top:86px;padding:12px 20px;max-width:1400px;margin-left:auto;margin-right:auto}
.pg{display:none}.pg.on{display:block}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:700;color:var(--mu2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;position:relative;overflow:hidden}
.kl{font-size:11px;color:var(--mu);margin-bottom:4px}.kv{font-size:20px;font-weight:900;letter-spacing:-1px}.ks{font-size:11px;color:var(--mu);margin-top:2px}.kb{position:absolute;bottom:0;left:0;right:0;height:2px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;color:var(--mu);font-weight:700;padding:7px 9px;border-bottom:1px solid var(--bd);letter-spacing:.04em;text-transform:uppercase}
.tbl th.tr{text-align:right}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}.tbl tr:hover td{background:var(--sf2)}
.bk{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:700}
.bg{background:#c6f6d5;color:#276749}.br{background:#fed7d7;color:#c53030}.bb{background:#bee3f8;color:#2b6cb0}.bgy{background:var(--sf3);color:var(--mu2)}.byw{background:#fefcbf;color:#b7791f}.bpu{background:#e9d8fd;color:#553c9a}.bcy{background:#c4f1f9;color:#0987a0}
.fg{display:grid;gap:8px;margin-bottom:10px}
.fg.c2{grid-template-columns:1fr 1fr}.fg.c3{grid-template-columns:1fr 1fr 1fr}
.fg label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px 10px;border-radius:var(--rs);font-size:13px;outline:none;transition:border .15s;font-family:inherit}
.fg input:focus,.fg select:focus{border-color:var(--bl)}.fg select option{background:var(--sf2)}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:var(--rs);font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.bp{background:var(--bl);color:#fff}.bs{background:var(--gn);color:#fff}.brd{background:var(--rd);color:#fff}.bg2{background:var(--sf2);color:var(--tx);border:1px solid var(--bd2)}.bpu2{background:#e9d8fd;color:#553c9a;border:1px solid #b794f4}.bsm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.prg{height:5px;background:var(--sf3);border-radius:3px;overflow:hidden;margin-top:4px}.prb{height:100%;border-radius:3px;transition:width .5s}
.al{padding:9px 13px;border-radius:var(--rs);font-size:13px;margin-bottom:10px}
.al.inf{background:#0f172a;border:1px solid #1e40af33;color:#93c5fd}.al.wrn{background:#1c1200;border:1px solid #f59e0b33;color:#fbbf24}.al.suc{background:#052e1a;border:1px solid #10b98133;color:#34d399}.al.pur{background:#0f0a2e;border:1px solid #6d28d933;color:#c4b5fd}
/* 캘린더 */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{background:none;border:1px solid var(--bd2);color:var(--tx);cursor:pointer;padding:5px 12px;border-radius:var(--rs);font-size:14px;font-weight:700;font-family:inherit}
.cal-nav:hover{background:var(--sf2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--mu);padding:4px 0}
.cal-day{min-height:80px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:6px;cursor:pointer;transition:all .15s;position:relative}
.cal-day-evt{font-size:9px;color:var(--pu);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(139,92,246,.12);border-radius:3px;padding:1px 4px;margin-top:2px}
.cal-day-evt-more{font-size:9px;color:var(--pu);font-weight:700;margin-top:1px}
.cal-day:hover{background:var(--sf3);border-color:var(--bl)}
.cal-day.today{border-color:var(--bl)}.cal-day.selected{background:rgba(59,130,246,.15);border-color:var(--bl)}.cal-day.other-month{opacity:.25}
.cal-day-num{font-size:12px;font-weight:700;color:var(--mu2);margin-bottom:3px}
.cal-day.today .cal-day-num{color:var(--bl)}
.cal-day-sum{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.cds{font-size:9px;font-weight:700;white-space:nowrap;border-radius:3px;padding:1px 4px}
.cds-in{background:rgba(16,185,129,.14);color:var(--gn)}
.cds-ex{background:rgba(239,68,68,.12);color:var(--rd)}
.cds-sv{background:rgba(59,130,246,.14);color:var(--bl)}
.cal-detail{margin-top:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
/* 월별 카드 */
.mon-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.mon-card-head{display:flex;align-items:center;padding:12px 16px;cursor:pointer;gap:12px}
.mon-card-head:hover{background:var(--sf2)}
.mon-card-ym{font-size:14px;font-weight:900;min-width:65px}
.mon-card-bars{flex:1;display:flex;flex-direction:column;gap:4px}
.mon-bar-row{display:flex;align-items:center;gap:7px}
.mon-bar-label{width:26px;color:var(--mu);font-weight:700;font-size:10px}
.mon-bar-bg{flex:1;height:5px;background:var(--sf3);border-radius:3px;overflow:hidden}
.mon-bar-fill{height:100%;border-radius:3px}
.mon-card-nums{display:flex;flex-direction:column;gap:3px;text-align:right;min-width:80px}
.mon-card-nums span{font-size:12px;font-weight:700}
.mon-card-body{display:none;border-top:1px solid var(--bd)}
.anom-detail{display:none;margin-top:6px}
.anom-row.open .anom-detail{display:block}
.dtl-card{cursor:pointer}
.dtl-body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.dtl-card.open .dtl-body{display:block}
.dtl-hint{font-size:10px;color:var(--mu);text-align:right;margin-top:4px}
.mon-card-body.open{display:block}
.sec-tabs{display:flex;background:var(--sf2)}
.sec-tab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;color:var(--mu2);border:none;background:none;font-family:inherit;transition:all .15s;border-bottom:2px solid transparent}
.sec-tab.on.income{border-bottom-color:var(--gn);color:var(--gn)}
.sec-tab.on.expense{border-bottom-color:var(--rd);color:var(--rd)}
.sec-tab.on.saving{border-bottom-color:var(--bl);color:var(--bl)}
.sec-content{display:none;padding:12px 16px}.sec-content.on{display:block}
.tx-section{margin-bottom:14px}
.tx-section-title{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.05em;text-transform:uppercase;padding:5px 0;border-bottom:1px solid var(--bd);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
/* 예산 카드 */
.bud-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.bud-card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.bud-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bud-card-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.bud-card-total{font-size:12px;color:var(--mu2)}
.bud-sub-row{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}
.bud-sub-row:last-child{border-bottom:none}
.bud-sub-name{font-size:12px;color:var(--mu2);flex:1;min-width:64px}
.bud-sub-actual{font-size:12px;color:var(--bl);margin:0 6px;min-width:50px;text-align:right;font-weight:700}
.bud-sub-input{width:88px;background:var(--sf3);border:1px solid var(--bd2);color:var(--tx);padding:4px 7px;border-radius:var(--rs);font-size:12px;font-weight:700;outline:none;text-align:right;font-family:inherit}
.bud-sub-input:focus{border-color:var(--bl)}
/* 고정입력 */
.fxi{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 11px;margin-bottom:5px}
.fxi-head{display:flex;align-items:center;gap:7px}
.fxi-info{flex:1;min-width:0}
.fxi-name{font-size:12px;font-weight:700}
.fxi-sub{font-size:11px;color:var(--mu2);margin-top:2px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.fxi-body{display:none;border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.fxi-body.open{display:block}
/* 자산 */
.asset-group{margin-bottom:16px}
.asset-group-title{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.asset-item{display:flex;align-items:center;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 11px;margin-bottom:5px;gap:10px}
.asset-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.asset-info{flex:1;min-width:0}
.asset-name{font-size:13px;font-weight:700}.asset-cat{font-size:11px;color:var(--mu2);margin-top:1px}
.asset-input{width:130px;background:var(--sf3);border:1px solid var(--bd2);color:var(--tx);padding:5px 8px;border-radius:var(--rs);font-size:13px;font-weight:700;outline:none;text-align:right;font-family:inherit;flex-shrink:0}
.asset-input:focus{border-color:var(--bl)}
/* 검색 */
.search-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.search-input{flex:1;min-width:130px;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:7px 10px;border-radius:var(--rs);font-size:13px;outline:none;font-family:inherit}
.search-input:focus{border-color:var(--bl)}
.search-sel{background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:7px 8px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit;outline:none}
/* 모달 */
.mdbg{position:fixed;inset:0;background:#00000099;z-index:200;align-items:center;justify-content:center;display:none}
.mdbg.on{display:flex}
.ac-wrap{position:relative;width:100%}
.ac-input{width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px 10px;border-radius:var(--rs);font-family:inherit;font-size:14px;outline:none;box-sizing:border-box}
.ac-input:focus{border-color:var(--bl);box-shadow:0 0 0 2px rgba(43,108,176,.15)}
.ac-drop{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rs);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:999;max-height:220px;overflow-y:auto;display:none}
.ac-drop.open{display:block}
.ac-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:var(--sf2)}
.ac-item .ac-main{font-weight:700;color:var(--tx)}
.ac-item .ac-sub{font-size:11px;color:var(--mu);margin-left:auto}
.ac-item .ac-badge{font-size:10px;padding:1px 6px;border-radius:10px}
.md{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:20px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.mdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mdh h3{font-size:15px;font-weight:700}.mdc{background:none;border:none;color:var(--mu);cursor:pointer;font-size:22px}
/* 입력+내역 레이아웃 */
.inp-layout{display:grid;grid-template-columns:360px 1fr;gap:12px;align-items:start}
.his-panel{position:sticky;top:86px;max-height:calc(100vh - 98px);overflow-y:auto}
/* misc */
.tr{text-align:right}.tg{color:var(--gn)}.trd{color:var(--rd)}.tb{color:var(--bl)}.ty{color:var(--yw)}.tpu{color:var(--pu)}.tm{color:var(--mu2)}.fw{font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.fx{display:flex}.fxc{align-items:center}.fxb{justify-content:space-between}.g8{gap:8px}.g12{gap:12px}
.ovx{overflow-x:auto}.em{text-align:center;padding:28px;color:var(--mu);font-size:13px}
.ld{text-align:center;padding:40px;color:var(--mu)}
.sp{width:26px;height:26px;border:2px solid var(--bd);border-top-color:var(--bl);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){.inp-layout{grid-template-columns:1fr}.his-panel{position:static;max-height:none}}
@media(max-width:700px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}.fg.c3{grid-template-columns:1fr 1fr}.bud-grid{grid-template-columns:1fr}.cal-day{min-height:64px}}
</style>
</head>
<body>
<div id="lock-screen" style="display:none;position:fixed;inset:0;background:var(--bg,#0f1420);z-index:9999;align-items:center;justify-content:center">
  <div class="md" style="max-width:300px;text-align:center">
    <div style="font-size:40px;margin-bottom:10px">🔒</div>
    <h3 style="margin-bottom:16px">가계부 잠금</h3>
    <input type="password" id="lock-pin-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')tryUnlock()" style="width:100%;text-align:center;font-size:18px;letter-spacing:4px;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:10px;border-radius:var(--rs);font-family:inherit;box-sizing:border-box">
    <div id="lock-error" style="color:var(--rd);font-size:12px;margin-top:8px;min-height:16px"></div>
    <button class="btn bp" style="width:100%;margin-top:6px" onclick="tryUnlock()">🔓 잠금 해제</button>
  </div>
</div>
<nav class="nav">
  <div class="logo">💰 가계부</div>
  <button class="nb on" onclick="go('dash')" id="nb-dash">📊 전체</button>
  <button class="nb" onclick="go('mon')" id="nb-mon">📅 월별</button>
  <button class="nb" onclick="go('inp')" id="nb-inp">✏️ 입력/내역</button>
  <button class="nb" onclick="go('bud')" id="nb-bud">🎯 예산</button>
  <button class="nb" onclick="go('ast')" id="nb-ast">🏦 자산</button>
  <button class="nb" onclick="go('stk')" id="nb-stk">📈 주식</button>
</nav>
<div class="sbar">
  <div class="si"><div class="sync-dot" id="sync-dot"></div><span id="sync-status">연결 중...</span></div>
  <select id="gY" onchange="onYMPart()" style="background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:3px 6px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit;margin-left:8px"></select>
  <select id="gM" onchange="onYMPart()" style="background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:3px 6px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit;margin-left:4px"></select>
  <input type="hidden" id="gYM" value="">
  <script>
  (function(){
    var now=new Date();
    var ySel=document.getElementById('gY');
    var mSel=document.getElementById('gM');
    if(!ySel||!mSel)return;
    // 연도: 2024 ~ 현재년도
    var curY=now.getFullYear();
    for(var y=curY;y>=2024;y--){
      var o=document.createElement('option');o.value=y;o.textContent=y+'년';
      if(y===curY)o.selected=true;
      ySel.appendChild(o);
    }
    // 월: 1~12
    for(var m=1;m<=12;m++){
      var o2=document.createElement('option');o2.value=m;o2.textContent=m+'월';
      if(m===now.getMonth()+1)o2.selected=true;
      mSel.appendChild(o2);
    }
    // hidden gYM 초기값 세팅
    var hidden=document.getElementById('gYM');
    if(hidden){
      hidden.value=curY+'-'+String(now.getMonth()+1).padStart(2,'0');
    }
  })();
  </script>
  <div class="sm">
    <button class="btn bpu2 bsm" onclick="openSetup()">⚙️</button>
    <button class="btn bg2 bsm" onclick="openPinSetup()" title="비밀번호 설정">🔒</button>
    <button class="btn bg2 bsm" onclick="syncNow()">🔄 동기화</button>
    <button class="btn bg2 bsm" onclick="exportJSON()">📤</button>
    <button class="btn bg2 bsm" onclick="document.getElementById('importFile').click()">📥</button>
    <button class="btn bg2 bsm" onclick="document.getElementById('csvFile').click()" title="뱅크샐러드 CSV 가져오기">🏦 CSV</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importBankSalad(event)">
  </div>
</div>
<div class="main">
<div class="pg on" id="pg-dash"><div id="d-dash"><div class="ld"><div class="sp"></div>불러오는 중...</div></div></div>
<div class="pg" id="pg-mon">
  <div class="card">
    <div class="cal-header">
      <button class="cal-nav" onclick="calMove(-1)">&#8249;</button>
      <div style="font-size:16px;font-weight:900" id="cal-title"></div>
      <button class="cal-nav" onclick="calMove(1)">&#8250;</button>
    </div>

function getLatestAssetSnapshot(){
  var db=loadDB();var assetsAll=db.assets||{};
  var months=Object.keys(assetsAll).sort();
  if(!months.length)return null;
  var lastM=months[months.length-1];
  return{ym:lastM,am:assetsAll[lastM]};
}
function goalMetricValue(goal,am,ym){
  if(goal.type==='networth')return calcNW(am,ym).nw;
  return Number(am[goal.linkedName])||0;
}
function computeGoalProgress(goal){
  if(goal.type==='duration'){
    var start=new Date(goal.startDate);
    var now=new Date();
    var elapsed=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());
    if(now.getDate()<start.getDate())elapsed--;
    elapsed=Math.max(0,elapsed);
    var totalM=Math.round((goal.targetYears||0)*12);
    var pctD=totalM>0?Math.min(100,Math.max(0,Math.round(elapsed/totalM*100))):0;
    return{cur:elapsed,target:totalM,pct:pctD,done:elapsed>=totalM};
  }
  var snap=getLatestAssetSnapshot();
  var am=snap?snap.am:{};
  var cur=goalMetricValue(goal,am,snap?snap.ym:null);
  if(goal.type==='debt'){
    var start2=goal.startBalance>0?goal.startBalance:cur;
    var paid=start2-cur;
    var pct=start2>0?Math.min(100,Math.max(0,Math.round(paid/start2*100))):(cur<=0?100:0);
    return{cur:cur,target:0,start:start2,pct:pct,done:cur<=0};
  }
  var pct2=goal.target>0?Math.min(100,Math.max(0,Math.round(cur/goal.target*100))):0;
  return{cur:cur,target:goal.target,pct:pct2,done:cur>=goal.target};
}
// 최근 3개월 추세로 "이 속도면 몇 개월 후 도달"을 추정 (데이터 부족/역방향 추세면 null)
function estimateMonthsToGoal(goal){
  if(goal.type==='duration'){
    var p=computeGoalProgress(goal);
    return Math.max(0,p.target-p.cur);
  }
  var db=loadDB();var assetsAll=db.assets||{};
  var months=Object.keys(assetsAll).sort();
  if(months.length<3)return null;
  var recent=months.slice(-3);
  var vals=recent.map(function(ym){return goalMetricValue(goal,assetsAll[ym],ym);});
  var avgChange=(vals[vals.length-1]-vals[0])/(vals.length-1);
  if(goal.type==='debt'){
    if(avgChange>=0)return null;
    var remain=vals[vals.length-1];
    if(remain<=0)return 0;
    return Math.ceil(remain/(-avgChange));
  }
  if(avgChange<=0)return null;
  var remain2=goal.target-vals[vals.length-1];
  if(remain2<=0)return 0;
  return Math.ceil(remain2/avgChange);
}

function loadBT(){
  try{
    var saved=localStorage.getItem(BT_KEY);
    if(saved){
      BT=JSON.parse(saved);
    }else{
      // 처음 도입 시: 기존에 입력해뒀던 월별 예산값들을 그대로 항목으로 옮겨온다 (데이터 유실 방지)
      BT=migrateBTFromExistingBudgets();
      saveBT();
    }
  }catch(e){BT=[];}
}
function migrateBTFromExistingBudgets(){
  var db=loadDB();
  var budgets=db.budgets||{};
  var items={}; // 'mid|sub' → {mid,sub,amount} (가장 최근 달에 입력된 값을 기본값으로 사용)
  Object.keys(budgets).sort().forEach(function(ym){
    var bym=budgets[ym]||{};
    Object.keys(bym).forEach(function(mid){
      Object.keys(bym[mid]||{}).forEach(function(sub){
        var amt=Number(bym[mid][sub])||0;
        if(amt>0)items[mid+'|'+sub]={mid:mid,sub:sub,amount:amt};
      });
    });
  });
  return Object.keys(items).map(function(k){return items[k];});
}
function saveBT(){localStorage.setItem(BT_KEY,JSON.stringify(BT));}
function addBudgetTemplateItem(item){BT.push(item);saveBT();}
function updateBudgetTemplateItem(i,item){BT[i]=item;saveBT();}
function removeBudgetTemplateItem(i){BT.splice(i,1);saveBT();}
// 예산탭이 수입/저축 목표도 지원하게 된 뒤 처음 접속하는 기존 사용자를 위한 1회성 백필.
// 이미 수입/저축 항목이 하나라도 BT에 있으면(직접 추가했든, 이미 백필됐든) 다시 건드리지 않는다.
function backfillIncomeSavingsGoals(){
  var hasNonExpense=BT.some(function(b){var cat=CATS[b.mid];return cat&&(cat.p==='수입'||cat.p==='저축');});
  if(hasNonExpense)return;
  var added=false;
  ANNUAL_INCOME_GOALS.forEach(function(g){
    if(BT.some(function(b){return b.mid==='수입'&&b.sub===g.sub;}))return;
    BT.push({mid:'수입',sub:g.sub,amount:Math.round(g.goal/12/1000)*1000});
    added=true;
  });
  ANNUAL_SAVING_GOALS.forEach(function(g){
    if(BT.some(function(b){return b.mid==='저축'&&b.sub===g.sub;}))return;
    BT.push({mid:'저축',sub:g.sub,amount:Math.round(g.goal/12/1000)*1000});
    added=true;
  });
  if(added)saveBT();
}
// 현재 CATS 구조상 유효한 항목인지 (카테고리 개편으로 mid/sub가 사라졌는지) 확인
function isBTItemValid(item){
  var cat=CATS[item.mid];
  return!!(cat&&cat.s.indexOf(item.sub)>=0);
}
// 특정 월에 "실제로 적용되는" 예산/목표 계산: 이번달 명시값 > 항목 기본값 > 전월실적 95% 순으로 우선.
// wantType('지출' 또는 '저축')으로 지출예산과 저축목표를 분리해서 계산 - 둘의 의미(초과=나쁨 vs 초과=좋음)가 다르기 때문.
// renderBud(월별 화면)와 renderAnnual(연간 결산)이 같은 로직을 공유해서 두 탭 숫자가 항상 일치하게 한다.
function getEffectiveBudget(ym,wantType){
  wantType=wantType||'지출';
  var bg=getBudget(ym);
  var prevTxs=getTxs(getPrevYM(ym));
  var bySub={},byMid={},tags={},total=0;
  BT.forEach(function(item){
    if(!isBTItemValid(item))return;
    var cat=CATS[item.mid];
    if(!cat||cat.p!==wantType)return;
    var bgm=bg[item.mid]||{};
    var amt,tag;
    if(bgm[item.sub]){amt=bgm[item.sub];tag='explicit';}
    else if(item.amount>0){amt=item.amount;tag='template';}
    else{
      var prevActual=0;
      prevTxs.forEach(function(t){if(t.mid===item.mid&&t.sub===item.sub&&t.type===wantType)prevActual+=Number(t.amount)||0;});
      if(wantType==='지출'){
        amt=prevActual>0?Math.round(prevActual*0.95/1000)*1000:0;
        tag=prevActual>0?'prev95':null;
      }else{
        // 수입/저축 목표를 굳이 5% 깎아서 제안하면 "덜 벌고 덜 모으기"를 유도하는 셈이라, 전월과 동일한 금액을 기본 제안
        amt=prevActual>0?Math.round(prevActual/1000)*1000:0;
        tag=prevActual>0?'prev100':null;
      }
    }
    var key=item.mid+'|'+item.sub;
    bySub[key]=amt;tags[key]=tag;
    byMid[item.mid]=(byMid[item.mid]||0)+amt;
    total+=amt;
  });
  return{bySub:bySub,byMid:byMid,tags:tags,total:total};
}

function saveAssetItem(ym,name,amt){var db=loadDB();if(!db.assets)db.assets={};if(!db.assets[ym])db.assets[ym]={};db.assets[ym][name]=amt;saveDB(db);}
function getAllMonths(){var db=loadDB();var all=db.txs||[];var m={};all.forEach(function(t){if(t.date)m[t.date.slice(0,7)]=true;});return Object.keys(m).sort();}
function isFixed(tx){return tx.fixed||FX_KEYS.indexOf(tx.mid+'|'+tx.sub+'|'+tx.memo)>=0;}
// 고정수입(근로) 판정: "고정거래 목록에 등록됐는지"와는 별개로, 실제로 매달 끊이지 않는 근로소득만 고정으로 본다.
// (AZ 급여/투자수입/돌보미수입은 FX에 등록되어 있어도 사실상 변동수입이라 여기서 제외)
var FIXED_INCOME_SUBS=['레드윗 급여'];
function isFixedIncome(tx){return FIXED_INCOME_SUBS.indexOf(tx.sub)>=0;}
function calcNW(am,ym){
  var ta=AI.filter(function(a){return!a.d;}).reduce(function(s,a){return s+(Number(am[a.n])||0);},0);
  var td=AI.filter(function(a){return a.d;}).reduce(function(s,a){return s+(Number(am[a.n])||0);},0);
  var insDebt=0;
  if(ym&&typeof INSTALLMENTS!=='undefined'){
    INSTALLMENTS.forEach(function(item){
      insDebt+=getInsStatus(item,ym).remaining;
    });
  }
  td+=insDebt;
  return{ta:ta,td:td,nw:ta-td,insDebt:insDebt};
}
function getMonthSummary(ym){
  var txs=getTxs(ym);var income=0,expense=0,incomeFixed=0,incomeVar=0;var byMid={},evalMap={'소비':0,'낭비':0,'투자':0,'저축':0};
  txs.forEach(function(t){
    var a=Number(t.amount)||0;
    if(t.type==='수입'){
      income+=a;
      if(isFixedIncome(t))incomeFixed+=a;else incomeVar+=a;
    }
    else if(t.type==='저축'){if(t.eval&&evalMap[t.eval]!==undefined)evalMap[t.eval]+=a;}
    else{expense+=a;byMid[t.mid]=(byMid[t.mid]||0)+a;if(t.eval&&evalMap[t.eval]!==undefined)evalMap[t.eval]+=a;}
  });
  return{income:income,expense:expense,incomeFixed:incomeFixed,incomeVar:incomeVar,savingsRate:income>0?((income-expense)/income*100).toFixed(1):'0',byMid:byMid,evalMap:evalMap};
}

// ── 앱 잠금(비밀번호) ──────────────────────────────────────────
// 주의: 이건 브라우저/기기를 남이 잠깐 들여다볼 때 막는 용도의 화면잠금이지,
// 데이터 자체를 암호화하는 건 아니라서 완전한 보안은 아니에요.
var PIN_KEY='gaegyebu_pin_hash';
var UNLOCK_SESSION_KEY='gaegyebu_unlocked';
async function sha256(text){
  if(window.crypto&&window.crypto.subtle){
    try{
      var enc=new TextEncoder().encode(text);
      var buf=await crypto.subtle.digest('SHA-256',enc);
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    }catch(e){}
  }
  // 폴백(비보안 컨텍스트 등 SubtleCrypto 사용 불가 시) - 평문 저장만은 피함
  var hash=0;
  for(var i=0;i<text.length;i++){hash=((hash<<5)-hash+text.charCodeAt(i))|0;}
  return 'fb_'+Math.abs(hash).toString(16);
}
function isUnlocked(){
  var pinHash=localStorage.getItem(PIN_KEY);
  if(!pinHash)return true;
  return sessionStorage.getItem(UNLOCK_SESSION_KEY)==='1';
}
function showLockScreen(){
  var el=document.getElementById('lock-screen');
  if(!el)return;
  el.style.display='flex';
  var inp=document.getElementById('lock-pin-input');
  if(inp){inp.value='';setTimeout(function(){inp.focus();},50);}
}
async function tryUnlock(){
  var inp=document.getElementById('lock-pin-input');
  var val=inp?inp.value:'';
  var hash=await sha256(val);
  if(hash===localStorage.getItem(PIN_KEY)){
    sessionStorage.setItem(UNLOCK_SESSION_KEY,'1');
    document.getElementById('lock-screen').style.display='none';
    initApp();
  }else{
    var errEl=document.getElementById('lock-error');
    if(errEl)errEl.textContent='비밀번호가 틀렸어요';
    if(inp){inp.value='';inp.focus();}
  }
}

async function confirmPinSetup(){
  var hasPin=!!localStorage.getItem(PIN_KEY);
  if(hasPin){
    var curEl=document.getElementById('pin-current');
    var curHash=await sha256(curEl?curEl.value:'');
    if(curHash!==localStorage.getItem(PIN_KEY)){showToast('❌ 현재 비밀번호가 틀렸어요.');return;}
  }
  var newPin=document.getElementById('pin-new').value;
  if(!newPin){
    localStorage.removeItem(PIN_KEY);
    sessionStorage.removeItem(UNLOCK_SESSION_KEY);
    showToast('🔓 비밀번호 잠금이 해제됐어요.');
  }else{
    if(newPin.length<4){showToast('⚠️ 4자리 이상으로 설정해주세요.');return;}
    var newHash=await sha256(newPin);
    localStorage.setItem(PIN_KEY,newHash);
    sessionStorage.setItem(UNLOCK_SESSION_KEY,'1');
    showToast('✅ 비밀번호가 설정됐어요.');
  }
  var md=document.getElementById('pin-setup-md');if(md)md.remove();
}

function buildAcData(){
  var data=[];
  Object.keys(CATS).forEach(function(mid){
    var cat=CATS[mid];
    cat.s.forEach(function(sub){
      data.push({mid:mid,sub:sub,type:cat.p,icon:CE[mid]||'',subIcon:SUB_ICON[sub]||''});
    });
  });
  return data;
}

function makeAcInput(wrap, onSelect){
  // wrap: 기존 select가 있던 컨테이너
  // 검색 input + 드롭다운 생성
  var acWrap=document.createElement('div');acWrap.className='ac-wrap';
  var inp=document.createElement('input');
  inp.className='ac-input';inp.placeholder='검색... (예: 식비, 커피, 주유)';inp.autocomplete='off';
  var drop=document.createElement('div');drop.className='ac-drop';

  var acData=buildAcData();
  var selIdx=-1;

  function renderDrop(kw){
    drop.innerHTML='';selIdx=-1;
    var kw2=kw.trim().toLowerCase();
    var results=kw2?acData.filter(function(d){
      return d.mid.includes(kw2)||d.sub.includes(kw2)||d.type.includes(kw2);
    }):acData.slice(0,20);
    if(!results.length){
      drop.innerHTML='<div class="ac-item"><span style="color:var(--mu)">검색 결과 없음</span></div>';
      drop.classList.add('open');return;
    }
    results.slice(0,30).forEach(function(d,i){
      var item=document.createElement('div');item.className='ac-item';
      item.innerHTML='<span style="font-size:14px">'+(d.subIcon||d.icon||'')+'</span>'
        +'<span class="ac-main">'+(d.subIcon&&d.subIcon!==d.icon?d.sub:d.mid+' / '+d.sub)+'</span>'
        +'<span class="ac-sub ac-badge '+(d.type==='수입'?'bg':d.type==='저축'?'bb':'br')+'">'+d.type+'</span>';
      item.onmousedown=function(e){
        e.preventDefault();
        inp.value=d.mid+' / '+d.sub;
        drop.classList.remove('open');
        onSelect(d);
      };
      drop.appendChild(item);
    });
    drop.classList.add('open');
  }

  inp.oninput=function(){renderDrop(inp.value);};
  inp.onfocus=function(){renderDrop(inp.value);};
  inp.onblur=function(){setTimeout(function(){drop.classList.remove('open');},150);};
  inp.onkeydown=function(e){
    var items=drop.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){selIdx=Math.min(selIdx+1,items.length-1);}
    else if(e.key==='ArrowUp'){selIdx=Math.max(selIdx-1,0);}
    else if(e.key==='Enter'&&selIdx>=0){items[selIdx].onmousedown(e);return;}
    else if(e.key==='Escape'){drop.classList.remove('open');return;}
    items.forEach(function(it,i){it.classList.toggle('sel',i===selIdx);});
    if(selIdx>=0)items[selIdx].scrollIntoView({block:'nearest'});
  };

  acWrap.appendChild(inp);acWrap.appendChild(drop);
  wrap.appendChild(acWrap);
  return {inp:inp,drop:drop};
}

function initTxAc(){
  var inp=document.getElementById('ti-ac');
  var drop=document.getElementById('ti-ac-drop');
  if(!inp||!drop)return;

  // 이미 이벤트 등록됐으면 스킵
  if(inp._acInit)return;
  inp._acInit=true;

  var acData=buildAcData();
  var selIdx=-1;

  function renderDrop(kw){
    drop.innerHTML='';selIdx=-1;
    var kw2=(kw||'').trim().toLowerCase();
    var results=kw2
      ?acData.filter(function(d){
          return d.mid.toLowerCase().includes(kw2)||d.sub.toLowerCase().includes(kw2);
        })
      :[];
    if(!results.length){drop.classList.remove('open');return;}
    results.slice(0,25).forEach(function(d,i){
      var item=document.createElement('div');item.className='ac-item';
      item.innerHTML='<span style="font-size:14px">'+(d.subIcon||d.icon||'')+'</span>'
        +'<span class="ac-main">'+d.mid+'</span>'
        +'<span style="color:var(--mu);font-size:12px;margin:0 4px">/</span>'
        +'<span style="font-size:12px;color:var(--tx)">'+d.sub+'</span>'
        +'<span class="ac-sub ac-badge '+(d.type==='수입'?'bg':d.type==='저축'?'bb':'br')+'" style="margin-left:auto">'+d.type+'</span>';
      item.onmousedown=function(e){
        e.preventDefault();
        // 중분류 select 업데이트
        var midSel=document.getElementById('ti-mid');
        if(midSel){midSel.value=d.mid;onMid();}
        // 소분류 select 업데이트 (onMid 후에)
        setTimeout(function(){
          var subSel=document.getElementById('ti-sub');
          if(subSel)subSel.value=d.sub;
        },50);
        // 대분류 업데이트
        var typeSel=document.getElementById('ti-type');
        if(typeSel)typeSel.value=d.type;
        // 지출유형 표시
        var evg=document.getElementById('ti-evg');
        if(evg)evg.style.visibility=(d.type==='지출')?'visible':'hidden';
        // 입력창 표시
        inp.value=d.mid+' / '+d.sub;
        drop.classList.remove('open');
      };
      drop.appendChild(item);
    });
    drop.classList.add('open');
  }

  inp.addEventListener('input',function(){renderDrop(inp.value);});
  inp.addEventListener('focus',function(){if(inp.value)renderDrop(inp.value);});
  inp.addEventListener('blur',function(){setTimeout(function(){drop.classList.remove('open');},150);});
  inp.addEventListener('keydown',function(e){
    var items=drop.querySelectorAll('.ac-item');
    if(!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();selIdx=Math.min(selIdx+1,items.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();selIdx=Math.max(selIdx-1,0);}
    else if(e.key==='Enter'&&selIdx>=0){items[selIdx].onmousedown(e);return;}
    else if(e.key==='Escape'){drop.classList.remove('open');return;}
    items.forEach(function(it,i){it.classList.toggle('sel',i===selIdx);});
    if(selIdx>=0)items[selIdx].scrollIntoView({block:'nearest'});
  });
}

function onInstFieldsChange(){
  var principal=Number(document.getElementById('ti-inst-principal').value)||0;
  var totalMonths=Number(document.getElementById('ti-inst-months').value)||0;
  var current=Number(document.getElementById('ti-inst-current').value)||1;
  if(!principal||!totalMonths)return;
  var perMonth=Math.floor(principal/totalMonths);
  var lastMonth=principal-perMonth*(totalMonths-1);
  var amt=current>=totalMonths?lastMonth:perMonth;
  document.getElementById('ti-amt').value=amt;
}

function monthsBetweenYm(fromYm,toYm){
  var f=fromYm.split('-').map(Number),t=toYm.split('-').map(Number);
  return(t[0]-f[0])*12+(t[1]-f[1]);
}
function addMonthsToYm(ym,delta){
  var p=ym.split('-').map(Number);
  var total=p[0]*12+(p[1]-1)+delta;
  var y=Math.floor(total/12),m=total%12+1;
  return y+'-'+String(m).padStart(2,'0');
}
function getInsStatus(item,ym){
  var num=monthsBetweenYm(item.firstYm,ym)+1;
  var perMonth=Math.floor(item.principal/item.totalMonths);
  var lastMonth=item.principal-perMonth*(item.totalMonths-1);
  var notStarted=num<1;
  var done=num>item.totalMonths;
  var amount=(notStarted||done)?0:(num===item.totalMonths?lastMonth:perMonth);
  var paidSoFar=Math.min(Math.max(num-1,0),item.totalMonths)*perMonth;
  if(num>item.totalMonths)paidSoFar=item.principal;
  return{num:num,amount:amount,done:done,notStarted:notStarted,perMonth:perMonth,paidSoFar:paidSoFar,remaining:Math.max(item.principal-paidSoFar,0)};
}

function buildFixed(){
  var today=new Date().toISOString().split('T')[0];
  var ym=gYM();
  var w=document.getElementById('fi-list');
  if(!w)return;

  // ── 이번달 입력된 고정거래 (fi.memo → tx)
  // 주의: 고정거래 저장 버튼을 거치지 않고 일반 입력/CSV가져오기로 기록된 경우도
  // '완료'로 인식해야 하므로 t.fixed 여부와 무관하게 이번달 전체 거래에서 매칭한다.
  var thisTxs=getTxs(ym);
  // doneMap: 보험료처럼 같은 mid|sub 여러개인 건 memo로, 나머지는 mid|sub만으로
  var doneMap={};
  thisTxs.forEach(function(t){
    var k=t.mid+'|'+t.sub+'|'+(t.memo||'');
    doneMap[k]=t;
    // mid|sub만으로도 저장 (fallback용)
    var k2=t.mid+'|'+t.sub;
    if(!doneMap[k2])doneMap[k2]=t;
  });

  // ── 지난달 고정거래 (예시값용)
  var prevTxs=getTxs(getPrevYM(ym));
  var prevMap={};
  prevTxs.forEach(function(t){
    var k=t.mid+'|'+t.sub+'|'+(t.memo||'');
    prevMap[k]=t;
    var k2=t.mid+'|'+t.sub;
    if(!prevMap[k2])prevMap[k2]=t;
  });

  // ── 그룹 분류 + 미입력 먼저 정렬
  var grpI=[],grpS=[],grpE=[];
  FX.forEach(function(fi,i){
    var k=fi.mid+'|'+fi.sub+'|'+(fi.memo||'');
    var k2=fi.mid+'|'+fi.sub;
    var sameCount=FX.filter(function(f){return f.mid===fi.mid&&f.sub===fi.sub;}).length;
    // memo 완전일치 우선, 없으면 mid|sub만으로 fallback (단일 항목인 경우)
    var tx=doneMap[k]||(sameCount===1?doneMap[k2]:null)||null;
    var prev=prevMap[k]||(sameCount===1?prevMap[k2]:null)||null;
    var done=!!tx;
    var obj={fi:fi,i:i,done:done,tx:tx,prev:prev};
    if(fi.type==='수입')grpI.push(obj);
    else if(fi.type==='저축')grpS.push(obj);
    else grpE.push(obj);
  });
  function sortGrp(g){return g.sort(function(a,b){return a.done-b.done;});}
  sortGrp(grpI);sortGrp(grpS);sortGrp(grpE);

  // ── 각 항목 DOM 생성
  function mkRow(obj){
    var fi=obj.fi,i=obj.i,done=obj.done,tx=obj.tx,prev=obj.prev;

    // 기본값: 입력됐으면 그 값, 아니면 지난달 값, 아니면 FX 기본값
    var defAmt  = done?(tx.amount):(prev?prev.amount:(fi.amt||0));
    var defPay  = done?(tx.payment):(prev?prev.payment:fi.pay);
    var defDate = done?(tx.date):today;

    var wrap=document.createElement('div');
    wrap.id='fxi-'+i;
    wrap.className='fxi';
    if(done)wrap.style.cssText='border-left:3px solid var(--gn);background:rgba(39,103,73,.04)';

    // 헤더
    var head=document.createElement('div');head.className='fxi-head';

    // 이름 + 뱃지
    var info=document.createElement('div');info.className='fxi-info';
    var nameDiv=document.createElement('div');nameDiv.className='fxi-name';
    var dispName=(fi.sub==='보험료'||fi.sub==='기타업무지출'||fi.sub==='기타수입')
      ?(CE[fi.mid]||'')+' '+fi.memo
      :(CE[fi.mid]||'')+' '+fi.sub;
    nameDiv.textContent=dispName+' ';
    var badge=document.createElement('span');
    badge.className='bk '+(done?'bg':'byw');
    badge.style.fontSize='10px';
    badge.textContent=done?('✓ '+ff(tx.amount)):'미입력';
    nameDiv.appendChild(badge);
    // 기본값 배지: FX 기본값이 있고, 실제 표시값과 다를 때 보여줌
    if(fi.amt>0){
      var defBadge=document.createElement('span');
      defBadge.className='bk bgy';
      defBadge.style.cssText='font-size:10px;margin-left:3px';
      defBadge.title='FX 기본값';
      defBadge.textContent='기본 '+ff(fi.amt);
      nameDiv.appendChild(defBadge);
    }
    info.appendChild(nameDiv);

    var subDiv=document.createElement('div');subDiv.className='fxi-sub';
    // 중분류 select
    var midSel=document.createElement('select');
    midSel.id='fx-mid-'+i;
    midSel.style.cssText='background:var(--sf3);border:1px solid var(--bd2);color:var(--mu2);padding:2px 4px;border-radius:4px;font-size:10px;cursor:pointer;font-family:inherit';
    midSel.onchange=function(){onFxMid(i);};

function saveSingleFixed(i){
  var fi=FX[i];
  var dateEl=document.getElementById('fx-date-'+i);
  var date=dateEl?dateEl.value:'';
  if(!date){showToast('⚠️ 날짜를 선택해주세요.');return;}

  var amtEl=document.getElementById('fx-amt-'+i);
  var amt=Number(amtEl?amtEl.value:'');
  if(!amt){showToast('⚠️ 금액을 입력해주세요.');return;}

  var mid=document.getElementById('fx-mid-'+i)?document.getElementById('fx-mid-'+i).value:fi.mid;
  var sub=document.getElementById('fx-sub-'+i)?document.getElementById('fx-sub-'+i).value:fi.sub;
  var pay=document.getElementById('fx-pay-'+i)?document.getElementById('fx-pay-'+i).value:fi.pay;
  // 입력창의 현재 메모값 사용 (fi.memo 아님!)
  var memo=document.getElementById('fx-memo-'+i)?document.getElementById('fx-memo-'+i).value:fi.memo;
  var type=fi.type||(CATS[mid]?CATS[mid].p:'지출');
  var evalVal=type==='수입'?'':(fi.eval||(type==='저축'?'저축':'소비'));
  var ym=gYM();

  // 기존 거래 찾기: 고정거래 저장 버튼을 거치지 않고 일반 입력/CSV가져오기로
  // 이미 기록된 경우도 '같은 항목'으로 인식해서 업데이트해야 중복 생성을 막을 수 있다.
  // → t.fixed 여부와 무관하게 이번달 전체 거래에서 매칭한다.
  var txsThisMonth=getTxs(ym);
  var sameInFX=FX.filter(function(f){return f.mid===mid&&f.sub===sub;});
  var existing=txsThisMonth.find(function(t){
    return t.mid===mid&&t.sub===sub&&(t.memo||'')===(fi.memo||'');
  })||txsThisMonth.find(function(t){
    return t.mid===mid&&t.sub===sub&&(t.memo||'')===(memo||'');
  })||(sameInFX.length===1?txsThisMonth.find(function(t){return t.mid===mid&&t.sub===sub;})||null:null);

  if(existing){
    updateTx(existing.id,{date:date,mid:mid,sub:sub,type:type,amount:amt,memo:memo,payment:pay,eval:evalVal,fixed:true});
    showToast('✅ '+sub+' 수정 완료!');
  }else{
    addTx({date:date,mid:mid,sub:sub,type:type,amount:amt,memo:memo,payment:pay,eval:evalVal,fixed:true});
    showToast('✅ '+sub+' 저장 완료!');
  }

  buildFixed();
  renderHis();
}

function getPrevYM(ym){
  var p=ym.split('-');var y=parseInt(p[0]),m=parseInt(p[1]);
  m--;if(m<1){m=12;y--;}
  return y+'-'+String(m).padStart(2,'0');
}

function renderCal(){
  var p=calYM.split('-');var y=parseInt(p[0]),m=parseInt(p[1]);
  document.getElementById('cal-title').textContent=y+'년 '+m+'월';
  var sm=getMonthSummary(calYM);var ns=sm.income-sm.expense;
  // KPI
  var kpiEl=document.getElementById('cal-kpi');
  kpiEl.innerHTML='';
  function mkKpi(label,val,color,raw){
    var d=document.createElement('div');d.className='kpi';
    var displayVal=raw?val:f(val);
    d.innerHTML='<div class="kl">'+label+'</div><div class="kv" style="color:'+color+'">'+displayVal+'</div><div class="kb" style="background:'+color+'"></div>';
    kpiEl.appendChild(d);
  }
  mkKpi('이달 수입',sm.income,'var(--gn)');
  mkKpi('이달 지출',sm.expense,'var(--rd)');
  mkKpi('순저축',ns,ns>=0?'var(--bl)':'var(--rd)');
  mkKpi('저축률',sm.savingsRate+'%','var(--yw)',true);
  // 날짜별 집계
  var txs=getTxs(calYM);var byDate={};
  txs.forEach(function(t){
    var d=t.date;if(!d)return;
    if(!byDate[d])byDate[d]={income:0,expense:0,saving:0};
    var a=Number(t.amount)||0;
    if(t.type==='수입')byDate[d].income+=a;
    else if(t.type==='지출')byDate[d].expense+=a;
    else if(t.type==='저축')byDate[d].saving+=a;
  });
  var firstDay=new Date(y,m-1,1).getDay();
  var daysInMonth=new Date(y,m,0).getDate();
  var today=new Date();
  var todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  // 그리드 빌드 - DOM 방식
  var grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  // 요일 헤더
  ['일','월','화','수','목','금','토'].forEach(function(d){
    var el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);
  });
  // 빈 칸
  for(var i=0;i<firstDay;i++){
    var el=document.createElement('div');el.className='cal-day other-month';grid.appendChild(el);
  }
  // 날짜 칸
  for(var d2=1;d2<=daysInMonth;d2++){
    var ds=calYM+'-'+String(d2).padStart(2,'0');
    var bd=byDate[ds];
    var el=document.createElement('div');
    var cls='cal-day';
    if(ds===todayStr)cls+=' today';
    el.className=cls;
    el.id='calday-'+ds;
    // 날짜 숫자

// ── 지출 이상치 자동감지: 카테고리(대분류>소분류)별로 이번달 지출이 그동안 평균 대비 확 튀었는지 감지 ──
function detectSpendingAnomalies(curYM2){
  var priorMonths=getAllMonths().filter(function(m){return m<curYM2;});
  if(priorMonths.length<2)return{high:[],low:[]}; // 비교할 과거 데이터가 너무 적으면 판단 보류

  var db=loadDB();var allTxs2=db.txs||[];
  var curMap={}; // 'mid|sub' -> 이번달 합계
  allTxs2.forEach(function(t){
    if(t.type==='지출'&&t.date&&t.date.slice(0,7)===curYM2){
      var k=t.mid+'|'+t.sub;curMap[k]=(curMap[k]||0)+(Number(t.amount)||0);
    }
  });

  // 후보군 = 이번달에 쓴 항목 ∪ 과거에 쓴 적 있는 항목 (이번달 0원으로 뚝 끊긴 것도 잡아야 하므로)
  var candidateKeys={};
  Object.keys(curMap).forEach(function(k){candidateKeys[k]=true;});
  allTxs2.forEach(function(t){
    if(t.type==='지출'&&t.date&&t.date.slice(0,7)<curYM2){
      candidateKeys[t.mid+'|'+t.sub]=true;
    }
  });

  var histMap={}; // 'mid|sub' -> [과거 각 달의 합계] (없으면 0)
  Object.keys(candidateKeys).forEach(function(k){histMap[k]=priorMonths.map(function(){return 0;});});
  allTxs2.forEach(function(t){
    if(t.type!=='지출'||!t.date)return;
    var mm=t.date.slice(0,7);
    var idx=priorMonths.indexOf(mm);
    if(idx<0)return;
    var k=t.mid+'|'+t.sub;
    if(!histMap[k])return;
    histMap[k][idx]+=(Number(t.amount)||0);
  });

  var high=[],low=[];
  Object.keys(candidateKeys).forEach(function(k){
    var parts=k.split('|');var mid=parts[0],sub=parts[1];
    var cur=curMap[k]||0;
    var hist=histMap[k]||[];
    var avg=hist.length?hist.reduce(function(a,b){return a+b;},0)/hist.length:0;
    if(avg<=0)return; // 처음 생긴 항목은 비교 대상 없음
    var diff=cur-avg;
    var pct=Math.round((cur/avg-1)*100);
    if(diff>=20000&&cur>=avg*1.3){
      high.push({mid:mid,sub:sub,cur:cur,avg:avg,diff:diff,pct:pct});
    }else if(avg>=30000&&cur<=avg*0.5){
      low.push({mid:mid,sub:sub,cur:cur,avg:avg,diff:avg-cur,pct:pct});
    }
  });
  high.sort(function(a,b){return b.diff-a.diff;});
  low.sort(function(a,b){return b.diff-a.diff;});
  return{high:high.slice(0,5),low:low.slice(0,3)};
}

function renderMonDetail(ym){
  var txs=getTxs(ym);
  txs.sort(function(a,b){return b.date>a.date?1:-1;});
  if(!txs.length)return '<div class="em" style="padding:16px">거래 데이터가 없어요</div>';
  var incTxs=txs.filter(function(t){return t.type==='수입';});
  var expTxs=txs.filter(function(t){return t.type==='지출';});
  var savTxs=txs.filter(function(t){return t.type==='저축';});
  var incTotal=incTxs.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var expTotal=expTxs.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var savTotal=savTxs.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var EC={'소비':'bgy','낭비':'br','투자':'bpu','저축':'bb'};
  var uid='md'+ym.replace('-','');

  function mkRow(t,col){
    var fix=isFixed(t)?'<span class="bk bcy" style="font-size:10px;margin-left:2px">고정</span>':'';
    return'<div class="fx fxb fxc" style="padding:5px 0;border-bottom:1px solid var(--bd)">'
      +'<div class="fx fxc g8"><span class="tm" style="font-size:11px;min-width:42px">'+(t.date||'').slice(5)+'</span>'
      +fix
      +'<span style="font-size:12px">'+(CE[t.mid]||'')+' '+(t.mid||'')+'</span>'
      +'<span class="tm" style="font-size:11px">'+(t.sub||'')+'</span>'
      +'<span class="tm" style="font-size:11px">'+(t.memo||'')+'</span>'
      +(t.eval?'<span class="bk '+(EC[t.eval]||'bgy')+'" style="font-size:10px">'+t.eval+'</span>':'')
      +'</div>'
      +'<span class="fw" style="color:'+col+';font-size:12px;white-space:nowrap">'+ff(t.amount)+'</span>'
      +'</div>';
  }

  var fixExp=expTxs.filter(isFixed);
  var varExp=expTxs.filter(function(t){return!isFixed(t);});
  var fixT=fixExp.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var varT=varExp.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var byMid={};
  expTxs.forEach(function(t){byMid[t.mid]=(byMid[t.mid]||0)+(Number(t.amount)||0);});
  var expRanked=Object.keys(byMid).map(function(k){return{name:k,amt:byMid[k]};})
    .sort(function(a,b){return b.amt-a.amt;});
  var maxAmt=expRanked.length?expRanked[0].amt:1;

  var incId=uid+'-inc';
  var expId=uid+'-exp';
  var savId=uid+'-sav';

  var tabsHtml='<div class="sec-tabs">'
    +'<button class="sec-tab income on" data-target="'+incId+'">💚 수입 '+f(incTotal)+'</button>'
    +'<button class="sec-tab expense" data-target="'+expId+'">❤️ 지출 '+f(expTotal)+'</button>'
    +'<button class="sec-tab saving" data-target="'+savId+'">💙 저축 '+f(savTotal)+'</button>'
    +'</div>';

  var incHtml='<div class="sec-content on" id="'+incId+'" style="padding:10px 14px">'
    +(incTxs.length?incTxs.map(function(t){return mkRow(t,'var(--gn)');}).join(''):'<div class="em" style="padding:10px">없음</div>')
    +'</div>';

  var expHtml='<div class="sec-content" id="'+expId+'" style="padding:10px 14px">'
    +'<div class="g2" style="margin-bottom:10px">'
    +'<div><div class="tx-section-title">📌 고정 <span>'+ff(fixT)+'</span></div>'
    +(fixExp.length?fixExp.map(function(t){return mkRow(t,'var(--rd)');}).join(''):'<div class="em" style="padding:6px;font-size:11px">없음</div>')
    +'</div>'
    +'<div><div class="tx-section-title">✏️ 변동 <span>'+ff(varT)+'</span></div>'
    +(varExp.length?varExp.map(function(t){return mkRow(t,'var(--rd)');}).join(''):'<div class="em" style="padding:6px;font-size:11px">없음</div>')
    +'</div></div>'
    +'<div class="tx-section-title" style="margin-top:8px">🏆 카테고리별</div>'
    +expRanked.map(function(x,i){
      var p=Math.round(x.amt/maxAmt*100);
      var c=MC[x.name]||'var(--bl)';
      return'<div class="fx fxc g8" style="padding:4px 0;border-bottom:1px solid var(--bd)">'
        +'<span style="font-size:11px;min-width:16px;color:var(--mu)">'+(i+1)+'</span>'
        +'<span style="font-size:12px;min-width:80px">'+(CE[x.name]||'')+' '+x.name+'</span>'
        +'<div style="flex:1;height:4px;background:var(--sf3);border-radius:2px;overflow:hidden">'
        +'<div style="width:'+p+'%;height:100%;background:'+c+';border-radius:2px"></div></div>'
        +'<span style="font-size:11px;font-weight:700;color:var(--rd);min-width:55px;text-align:right">'+ff(x.amt)+'</span>'
        +'<span style="font-size:10px;color:var(--mu);min-width:35px;text-align:right">'+(expTotal?Math.round(x.amt/expTotal*100)+'%':'')+'</span>'
        +'</div>';
    }).join('')
    +'</div>';

  var savHtml='<div class="sec-content" id="'+savId+'" style="padding:10px 14px">'
    +(savTxs.length?savTxs.map(function(t){return mkRow(t,'var(--bl)');}).join(''):'<div class="em" style="padding:10px">없음</div>')
    +'</div>';

  return tabsHtml+incHtml+expHtml+savHtml;
}

function swMon(el,secId){
  var tabs=el.parentElement.querySelectorAll('.sec-tab');
  tabs.forEach(function(t){t.classList.remove('on');});
  el.classList.add('on');
  var parent=el.closest('.mon-card-body')||el.parentElement.parentElement;
  parent.querySelectorAll('.sec-content').forEach(function(c){c.classList.remove('on');});
  var target=document.getElementById(secId);
  if(target)target.classList.add('on');
}

// ── 예산탭 상단: 이번달 결산 카드 (전체탭의 연간결산과 같은 스타일, 범위만 '이번달') ──
function renderBudMonthSummary(ym,eb,sm,savActual){
  var wrap=document.getElementById('d-bud-summary');
  if(!wrap)return;
  var p=ym.split('-');var label=p[0]+'년 '+parseInt(p[1])+'월';
  var ebExp=eb['지출'],ebInc=eb['수입'],ebSav=eb['저축'];

  var expBudget=ebExp.total,expActual=sm.expense;
  var expPct=expBudget>0?Math.round(expActual/expBudget*100):0;
  var expColor=expPct>100?'var(--rd)':expPct>80?'var(--yw)':'var(--gn)';

  if(!expBudget&&!ebInc.total&&!ebSav.total){
    wrap.innerHTML='<div class="card mb12"><div class="card-title">📊 '+label+' 결산</div>'
      +'<div class="em">아직 이번달에 적용된 예산/목표가 없어요. 아래에서 항목을 추가해보세요.</div></div>';
    return;
  }

  function goalBar(title,budget,actual,color){
    if(!budget)return'';
    var pct=Math.round(actual/budget*100);
    var barColor=pct>=100?'var(--gn)':pct>=70?'var(--yw)':'var(--rd)';
    return'<div style="background:var(--sf2);border-radius:var(--rs);padding:10px 12px;margin-bottom:8px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">'
      +'<span style="font-size:12px;font-weight:700;color:'+color+'">'+title+'</span>'
      +'<span style="font-size:11px;color:var(--mu2)">실적 '+ff(actual)+' / 목표 '+ff(budget)+'</span>'
      +'</div>'
      +'<div style="height:6px;background:var(--sf3);border-radius:3px;overflow:hidden">'
      +'<div style="width:'+Math.min(pct,100)+'%;height:100%;background:'+barColor+';border-radius:3px"></div></div>'
      +'<div style="text-align:right;font-size:11px;font-weight:700;color:'+barColor+';margin-top:2px">'+pct+'% 달성</div>'
      +'</div>';
  }

  var ranked=Object.keys(ebExp.byMid).map(function(m){
    return{name:m,budget:ebExp.byMid[m],actual:sm.byMid[m]||0};
  }).sort(function(a,b){return b.actual-a.actual;});

  var html='<div class="card mb12"><div class="card-title">📊 '+label+' 결산</div>';

  if(expBudget){
    html+='<div style="background:var(--sf2);border-radius:var(--r);padding:14px;margin-bottom:12px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
      +'<span style="font-size:13px;font-weight:700">이번달 지출 예산 사용률</span>'
      +'<span style="font-size:18px;font-weight:900;color:'+expColor+'">'+expPct+'%</span>'
      +'</div>'
      +'<div style="display:flex;gap:16px;font-size:12px;margin-bottom:8px;flex-wrap:wrap">'
      +'<span style="color:var(--mu2)">예산 <strong style="color:var(--tx)">'+ff(expBudget)+'</strong></span>'
      +'<span style="color:var(--mu2)">실적 <strong style="color:var(--rd)">'+ff(expActual)+'</strong></span>'
      +'<span style="color:var(--mu2)">잔액 <strong style="color:'+(expBudget-expActual>=0?'var(--gn)':'var(--rd)')+'">'+ff(expBudget-expActual)+'</strong></span>'
      +'</div>'
      +'<div style="height:10px;background:var(--sf3);border-radius:5px;overflow:hidden">'
      +'<div style="width:'+Math.min(expPct,100)+'%;height:100%;background:'+expColor+';border-radius:5px;transition:width .5s"></div>'
      +'</div></div>';
  }

  if(ebInc.total||ebSav.total){
    html+='<div class="g2" style="margin-bottom:12px">'
      +'<div>'+(ebInc.total?goalBar('💰 수입 목표',ebInc.total,sm.income,'var(--gn)'):'<div class="em" style="padding:12px;font-size:11px">수입 목표를 추가하면 여기 표시돼요</div>')+'</div>'
      +'<div>'+(ebSav.total?goalBar('🏦 저축 목표',ebSav.total,savActual,'var(--bl)'):'<div class="em" style="padding:12px;font-size:11px">저축 목표를 추가하면 여기 표시돼요</div>')+'</div>'
      +'</div>';
  }

  if(ranked.length){
    html+='<table style="width:100%;border-collapse:collapse"><thead><tr>'
      +'<th style="text-align:left;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">카테고리</th>'
      +'<th class="tr" style="font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">예산</th>'
      +'<th class="tr" style="font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">실적</th>'
      +'<th class="tr" style="font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">잔액</th>'
      +'<th style="font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd);width:80px">사용률</th>'
      +'</tr></thead><tbody>'
      +ranked.map(function(r){
        var pct2=r.budget>0?Math.min(Math.round(r.actual/r.budget*100),999):0;
        var remain=r.budget-r.actual;
        var c=pct2>100?'var(--rd)':pct2>80?'var(--yw)':'var(--gn)';
        var w=Math.min(pct2,100);
        return'<tr>'
          +'<td style="font-size:12px;padding:6px 6px;border-bottom:1px solid var(--bd)">'+(CE[r.name]||'')+' '+r.name+'</td>'
          +'<td class="tr" style="font-size:12px;color:var(--mu2);padding:6px 6px;border-bottom:1px solid var(--bd)">'+ff(r.budget)+'</td>'
          +'<td class="tr" style="font-weight:700;font-size:12px;color:var(--rd);padding:6px 6px;border-bottom:1px solid var(--bd)">'+ff(r.actual)+'</td>'
          +'<td class="tr" style="font-size:12px;padding:6px 6px;border-bottom:1px solid var(--bd);color:'+(remain>=0?'var(--gn)':'var(--rd)')+'">'+ff(remain)+'</td>'
          +'<td style="padding:6px 6px;border-bottom:1px solid var(--bd)">'
          +'<div style="display:flex;align-items:center;gap:4px">'
          +'<div style="flex:1;height:4px;background:var(--sf3);border-radius:2px;overflow:hidden"><div style="width:'+w+'%;height:100%;background:'+c+';border-radius:2px"></div></div>'
          +'<span style="font-size:10px;color:'+c+';font-weight:700;min-width:28px;text-align:right">'+pct2+'%</span>'
          +'</div></td>'
          +'</tr>';
      }).join('')
      +'</tbody></table>';
  }
  html+='</div>';
  wrap.innerHTML=html;
}

function renderBud(){
  var ym=gYM();var sm=getMonthSummary(ym);
  var container=document.getElementById('d-bud');
  var warnEl=document.getElementById('d-bud-warn');
  container.innerHTML='';
  if(warnEl)warnEl.innerHTML='';

  // 유효하지 않은 항목(카테고리 개편으로 mid/sub가 사라짐) 분리
  var validItems=[],invalidItems=[];
  BT.forEach(function(item,i){
    if(isBTItemValid(item))validItems.push({item:item,i:i});
    else invalidItems.push({item:item,i:i});
  });

  var eb={'지출':getEffectiveBudget(ym,'지출'),'수입':getEffectiveBudget(ym,'수입'),'저축':getEffectiveBudget(ym,'저축')};
  var savActual=0;
  getTxs(ym).forEach(function(t){if(t.type==='저축')savActual+=Number(t.amount)||0;});
  renderBudMonthSummary(ym,eb,sm,savActual);

  // 항목별 "올해 월평균 실적" 계산용 (예산 잡을 때 참고하라고 보여줌) - 당해년도 데이터만 사용
  var curYear=ym.slice(0,4);
  var yearTxs=(loadDB().txs||[]).filter(function(t){return t.date&&t.date.slice(0,4)===curYear;});
  var yearMonthsCount=getAllMonths().filter(function(m){return m.slice(0,4)===curYear;}).length||1;
  function getHistAvg(mid,sub,type){
    var sum=0;
    yearTxs.forEach(function(t){if(t.mid===mid&&t.sub===sub&&t.type===type)sum+=Number(t.amount)||0;});
    return Math.round(sum/yearMonthsCount);
  }

  if(invalidItems.length&&warnEl){
    var warn=document.createElement('div');
    warn.className='card mb12';
    warn.style.cssText='border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.06)';
    var wt=document.createElement('div');
    wt.style.cssText='font-size:13px;font-weight:800;color:var(--rd);margin-bottom:8px';
    wt.textContent='⚠️ 카테고리 개편으로 사라진 예산 항목 ('+invalidItems.length+'개)';
    warn.appendChild(wt);
    var wd=document.createElement('div');
    wd.style.cssText='font-size:11px;color:var(--mu);margin-bottom:10px';
    wd.textContent='아래 항목이 가리키는 대분류/소분류가 더 이상 없어서 반영되지 않고 있어요. 새 카테고리로 다시 설정하거나 삭제해주세요.';
    warn.appendChild(wd);
    invalidItems.forEach(function(o){
      var row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:8px;background:var(--sf2);border-radius:8px;padding:8px 10px;margin-bottom:6px';
      row.innerHTML='<span style="font-size:12px;color:var(--rd);font-weight:700;flex:1">'+(o.item.mid||'?')+' &gt; '+(o.item.sub||'?')+'</span>'
        +'<span style="font-size:11px;color:var(--mu)">기본 '+ff(o.item.amount||0)+'</span>';
      var editBtn=document.createElement('button');editBtn.className='btn bg2 bsm';editBtn.textContent='⚙️ 재설정';editBtn.style.cssText='padding:4px 8px';
      (function(ii){editBtn.onclick=function(){openEditBudgetItem(ii);};})(o.i);
      row.appendChild(editBtn);
      var delBtn=document.createElement('button');delBtn.className='btn bg2 bsm';delBtn.textContent='🗑️';delBtn.style.cssText='padding:4px 8px';
      (function(ii){delBtn.onclick=function(){deleteBudgetTemplateItem(ii);};})(o.i);
      row.appendChild(delBtn);
      warn.appendChild(row);
    });
    warnEl.appendChild(warn);
  }

  if(!validItems.length){
    container.innerHTML='<div class="em">🎯 아직 예산/목표 항목이 없어요. 위 "＋ 항목추가"로 지출 예산은 물론, 수입·저축 목표도 추가해보세요.</div>';
    return;
  }

  var sections=[
    {type:'지출',title:'🎯 지출 예산'},
    {type:'수입',title:'💰 수입 목표'},
    {type:'저축',title:'🏦 저축 목표'}
  ];

  sections.forEach(function(sec){
    var itemsOfType=validItems.filter(function(o){var c=CATS[o.item.mid];return c&&c.p===sec.type;});
    if(!itemsOfType.length)return;
    var sectionEb=eb[sec.type];
    var isExpense=sec.type==='지출';

    var secHead=document.createElement('div');
    secHead.style.cssText='grid-column:1/-1;font-size:13px;font-weight:800;color:var(--tx);margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--bd)';
    secHead.textContent=sec.title;
    container.appendChild(secHead);

    var groups={};
    itemsOfType.forEach(function(o){
      var m=o.item.mid;
      if(!groups[m])groups[m]=[];
      groups[m].push(o);
    });

    Object.keys(groups).forEach(function(m){
      var items=groups[m];
      var rows=items.map(function(o){
        var key=o.item.mid+'|'+o.item.sub;
        return{i:o.i,sub:o.item.sub,amount:sectionEb.bySub[key]||0,autoTag:sectionEb.tags[key]};
      });
      var totalBudget=sectionEb.byMid[m]||0;
      var actual=0;
      getTxs(ym).forEach(function(t){if(t.mid===m&&t.type===sec.type)actual+=Number(t.amount)||0;});
      var pct2=totalBudget>0?Math.min(Math.round(actual/totalBudget*100),999):0;
      var over=isExpense&&totalBudget>0&&pct2>100;
      var achieved=!isExpense&&totalBudget>0&&pct2>=100;
      var barColor=isExpense?(pct2>100?'var(--rd)':pct2>80?'var(--yw)':'var(--gn)')
                            :(pct2>=100?'var(--gn)':pct2>=70?'var(--yw)':'var(--rd)');
      var badgeCls=isExpense?(over?'br':'bgy'):(achieved?'bg':(pct2>=70?'bgy':'br'));

      var card=document.createElement('div');card.className='bud-card';
      var head=document.createElement('div');head.className='bud-card-head';
      var name=document.createElement('div');name.className='bud-card-name';
      name.textContent=(CE[m]||'')+' '+m+' ';
      if(totalBudget){var badge=document.createElement('span');badge.className='bk '+badgeCls;badge.style.fontSize='10px';badge.textContent=pct2+'%';name.appendChild(badge);}
      head.appendChild(name);
      var total=document.createElement('div');total.className='bud-card-total';total.textContent=totalBudget?ff(totalBudget):'미설정';head.appendChild(total);
      card.appendChild(head);
      if(totalBudget){
        var prg=document.createElement('div');prg.className='prg mb8';
        var prb=document.createElement('div');prb.className='prb';prb.style.cssText='width:'+Math.min(pct2,100)+'%;background:'+barColor;
        prg.appendChild(prb);card.appendChild(prg);
      }
      rows.forEach(function(r){
        var act=0;
        getTxs(ym).forEach(function(t){if(t.mid===m&&t.sub===r.sub&&t.type===sec.type)act+=Number(t.amount)||0;});
        var row=document.createElement('div');row.className='bud-sub-row';
        var subName=document.createElement('span');subName.className='bud-sub-name';subName.textContent=r.sub+' ';
        if(r.autoTag==='prev95'){
          var abk=document.createElement('span');abk.className='bk bcy';abk.style.fontSize='9px';abk.title='전월 실사용액의 95%로 자동 채워졌어요.';abk.textContent='🔁 전월 95%';
          subName.appendChild(abk);
        }else if(r.autoTag==='prev100'){
          var pbk=document.createElement('span');pbk.className='bk bcy';pbk.style.fontSize='9px';pbk.title='전월 실적과 동일한 금액이 목표로 자동 채워졌어요.';pbk.textContent='🔁 전월과 동일';
          subName.appendChild(pbk);
        }else if(r.autoTag==='template'){
          var tbk=document.createElement('span');tbk.className='bk bpu';tbk.style.fontSize='9px';tbk.title='설정해두신 기본값이 적용됐어요. 이번달만 다르게 하려면 값을 바꾸고 포커스를 옮기세요.';tbk.textContent='📌 기본값';
          subName.appendChild(tbk);
        }
        row.appendChild(subName);
        var histAvg=getHistAvg(m,r.sub,sec.type);
        if(histAvg>0){
          var avgEl=document.createElement('span');
          avgEl.style.cssText='font-size:9px;color:var(--pu);display:block;margin-top:1px';
          avgEl.title='올해('+curYear+') 데이터 기준 월평균 (예산 잡을 때 참고하세요)';
          avgEl.textContent='평균 '+ff(histAvg);
          subName.appendChild(avgEl);
        }
        var actEl=document.createElement('span');actEl.className='bud-sub-actual';if(act)actEl.textContent=ff(act);row.appendChild(actEl);
        var inp=document.createElement('input');inp.type='number';inp.value=r.amount||'';inp.placeholder=isExpense?'예산':'목표';inp.min='0';inp.className='bud-sub-input';
        if(r.autoTag)inp.style.borderColor='rgba(8,151,160,.4)';
        (function(ym2,m2,s2){
          inp.onfocus=function(){this.style.borderColor='var(--bl)';};
          inp.onblur=function(){onBud(this,ym2,m2,s2);};
        })(ym,m,r.sub);
        row.appendChild(inp);
        var editBtn=document.createElement('button');editBtn.className='btn bg2 bsm';editBtn.textContent='⚙️';editBtn.style.cssText='padding:4px 7px;margin-left:4px';
        (function(ii){editBtn.onclick=function(){openEditBudgetItem(ii);};})(r.i);
        row.appendChild(editBtn);
        var delBtn=document.createElement('button');delBtn.className='btn bg2 bsm';delBtn.textContent='🗑️';delBtn.style.cssText='padding:4px 7px;margin-left:4px';
        (function(ii){delBtn.onclick=function(){deleteBudgetTemplateItem(ii);};})(r.i);
        row.appendChild(delBtn);
        card.appendChild(row);
      });
      container.appendChild(card);
    });
  });
}

function budgetMidOptions(selectedMid){
  var expOpts=Object.keys(CATS).filter(function(m){return CATS[m].p==='지출';}).map(function(m){
    return'<option value="'+m+'"'+(m===selectedMid?' selected':'')+'>'+m+'</option>';
  }).join('');
  var incOpts=Object.keys(CATS).filter(function(m){return CATS[m].p==='수입';}).map(function(m){
    return'<option value="'+m+'"'+(m===selectedMid?' selected':'')+'>'+m+'</option>';
  }).join('');
  var savOpts=Object.keys(CATS).filter(function(m){return CATS[m].p==='저축';}).map(function(m){
    return'<option value="'+m+'"'+(m===selectedMid?' selected':'')+'>'+m+'</option>';
  }).join('');
  return'<optgroup label="지출(예산)">'+expOpts+'</optgroup><optgroup label="수입(목표)">'+incOpts+'</optgroup><optgroup label="저축(목표)">'+savOpts+'</optgroup>';
