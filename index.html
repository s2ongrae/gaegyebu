<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💰 내 가계부</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef5fc;--sf:#ffffff;--sf2:#ddeeff;--sf3:#cce4f7;--bd:#a8d5f5;--bd2:#7bc0ef;--tx:#1a365d;--mu:#4a6fa5;--mu2:#2c5282;--bl:#2b6cb0;--gn:#276749;--rd:#c53030;--yw:#b7791f;--pu:#553c9a;--cy:#0987a0;--r:12px;--rs:8px}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:14px;min-height:100vh}
.nav{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(240,247,255,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:2px;z-index:100;overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.logo{font-weight:900;font-size:14px;background:linear-gradient(135deg,var(--bl),var(--pu));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:10px;white-space:nowrap;flex-shrink:0}
.nb{background:none;border:none;color:var(--mu2);cursor:pointer;padding:6px 10px;border-radius:var(--rs);font-size:12px;font-weight:700;white-space:nowrap;transition:all .15s;font-family:inherit;flex-shrink:0}
.nb:hover{background:var(--sf2);color:var(--tx)}.nb.on{background:var(--sf2);color:var(--bl)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-r select{background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:4px 7px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit}
.sbar{position:fixed;top:50px;left:0;right:0;height:36px;background:var(--sf2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:8px;z-index:99;font-size:12px;overflow-x:auto}
.sbar::-webkit-scrollbar{display:none}
.si{color:var(--mu2);display:flex;align-items:center;gap:5px;flex-shrink:0}
.sm{margin-left:auto;display:flex;gap:5px;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--mu);flex-shrink:0}
.sync-dot.ok{background:var(--gn)}.sync-dot.err{background:var(--rd)}.sync-dot.syn{background:var(--yw);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{margin-top:86px;padding:12px 20px;max-width:1400px;margin-left:auto;margin-right:auto}
.pg{display:none}.pg.on{display:block}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:700;color:var(--mu2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;position:relative;overflow:hidden}
.kl{font-size:11px;color:var(--mu);margin-bottom:4px}.kv{font-size:20px;font-weight:900;letter-spacing:-1px}.ks{font-size:11px;color:var(--mu);margin-top:2px}.kb{position:absolute;bottom:0;left:0;right:0;height:2px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;color:var(--mu);font-weight:700;padding:7px 9px;border-bottom:1px solid var(--bd);letter-spacing:.04em;text-transform:uppercase}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}.tbl tr:hover td{background:var(--sf2)}
.bk{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:700}
.bg{background:#c6f6d5;color:#276749}.br{background:#fed7d7;color:#c53030}.bb{background:#bee3f8;color:#2b6cb0}.bgy{background:var(--sf3);color:var(--mu2)}.byw{background:#fefcbf;color:#b7791f}.bpu{background:#e9d8fd;color:#553c9a}.bcy{background:#c4f1f9;color:#0987a0}
.fg{display:grid;gap:8px;margin-bottom:10px}
.fg.c2{grid-template-columns:1fr 1fr}.fg.c3{grid-template-columns:1fr 1fr 1fr}
.fg label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px 10px;border-radius:var(--rs);font-size:13px;outline:none;transition:border .15s;font-family:inherit}
.fg input:focus,.fg select:focus{border-color:var(--bl)}.fg select option{background:var(--sf2)}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:var(--rs);font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.bp{background:var(--bl);color:#fff}.bs{background:var(--gn);color:#fff}.brd{background:var(--rd);color:#fff}.bg2{background:var(--sf2);color:var(--tx);border:1px solid var(--bd2)}.bpu2{background:#e9d8fd;color:#553c9a;border:1px solid #b794f4}.bsm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.prg{height:5px;background:var(--sf3);border-radius:3px;overflow:hidden;margin-top:4px}.prb{height:100%;border-radius:3px;transition:width .5s}
.al{padding:9px 13px;border-radius:var(--rs);font-size:13px;margin-bottom:10px}
.al.inf{background:#0f172a;border:1px solid #1e40af33;color:#93c5fd}.al.wrn{background:#1c1200;border:1px solid #f59e0b33;color:#fbbf24}.al.suc{background:#052e1a;border:1px solid #10b98133;color:#34d399}.al.pur{background:#0f0a2e;border:1px solid #6d28d933;color:#c4b5fd}
/* 캘린더 */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav{background:none;border:1px solid var(--bd2);color:var(--tx);cursor:pointer;padding:5px 12px;border-radius:var(--rs);font-size:14px;font-weight:700;font-family:inherit}
.cal-nav:hover{background:var(--sf2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--mu);padding:4px 0}
.cal-day{min-height:72px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:6px;cursor:pointer;transition:all .15s}
.cal-day:hover{background:var(--sf3);border-color:var(--bl)}
.cal-day.today{border-color:var(--bl)}.cal-day.selected{background:rgba(59,130,246,.15);border-color:var(--bl)}.cal-day.other-month{opacity:.25}
.cal-day-num{font-size:12px;font-weight:700;color:var(--mu2);margin-bottom:3px}
.cal-day.today .cal-day-num{color:var(--bl)}
.cal-day-inc{font-size:10px;color:var(--gn);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-day-exp{font-size:10px;color:var(--rd);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-detail{margin-top:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
/* 월별 카드 */
.mon-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.mon-card-head{display:flex;align-items:center;padding:12px 16px;cursor:pointer;gap:12px}
.mon-card-head:hover{background:var(--sf2)}
.mon-card-ym{font-size:14px;font-weight:900;min-width:65px}
.mon-card-bars{flex:1;display:flex;flex-direction:column;gap:4px}
.mon-bar-row{display:flex;align-items:center;gap:7px}
.mon-bar-label{width:26px;color:var(--mu);font-weight:700;font-size:10px}
.mon-bar-bg{flex:1;height:5px;background:var(--sf3);border-radius:3px;overflow:hidden}
.mon-bar-fill{height:100%;border-radius:3px}
.mon-card-nums{display:flex;flex-direction:column;gap:3px;text-align:right;min-width:80px}
.mon-card-nums span{font-size:12px;font-weight:700}
.mon-card-body{display:none;border-top:1px solid var(--bd)}
.mon-card-body.open{display:block}
.sec-tabs{display:flex;background:var(--sf2)}
.sec-tab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;color:var(--mu2);border:none;background:none;font-family:inherit;transition:all .15s;border-bottom:2px solid transparent}
.sec-tab.on.income{border-bottom-color:var(--gn);color:var(--gn)}
.sec-tab.on.expense{border-bottom-color:var(--rd);color:var(--rd)}
.sec-tab.on.saving{border-bottom-color:var(--bl);color:var(--bl)}
.sec-content{display:none;padding:12px 16px}.sec-content.on{display:block}
.tx-section{margin-bottom:14px}
.tx-section-title{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.05em;text-transform:uppercase;padding:5px 0;border-bottom:1px solid var(--bd);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
/* 예산 카드 */
.bud-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.bud-card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.bud-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bud-card-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.bud-card-total{font-size:12px;color:var(--mu2)}
.bud-sub-row{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}
.bud-sub-row:last-child{border-bottom:none}
.bud-sub-name{font-size:12px;color:var(--mu2);flex:1}
.bud-sub-actual{font-size:12px;color:var(--bl);margin:0 6px;min-width:50px;text-align:right;font-weight:700}
.bud-sub-input{width:88px;background:var(--sf3);border:1px solid var(--bd2);color:var(--tx);padding:4px 7px;border-radius:var(--rs);font-size:12px;font-weight:700;outline:none;text-align:right;font-family:inherit}
.bud-sub-input:focus{border-color:var(--bl)}
/* 고정입력 */
.fxi{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 11px;margin-bottom:5px}
.fxi-head{display:flex;align-items:center;gap:7px}
.fxi-info{flex:1;min-width:0}
.fxi-name{font-size:12px;font-weight:700}
.fxi-sub{font-size:11px;color:var(--mu2);margin-top:2px;display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.fxi-body{display:none;border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.fxi-body.open{display:block}
/* 자산 */
.asset-group{margin-bottom:16px}
.asset-group-title{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.asset-item{display:flex;align-items:center;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 11px;margin-bottom:5px;gap:10px}
.asset-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.asset-info{flex:1;min-width:0}
.asset-name{font-size:13px;font-weight:700}.asset-cat{font-size:11px;color:var(--mu2);margin-top:1px}
.asset-input{width:130px;background:var(--sf3);border:1px solid var(--bd2);color:var(--tx);padding:5px 8px;border-radius:var(--rs);font-size:13px;font-weight:700;outline:none;text-align:right;font-family:inherit;flex-shrink:0}
.asset-input:focus{border-color:var(--bl)}
/* 검색 */
.search-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.search-input{flex:1;min-width:130px;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:7px 10px;border-radius:var(--rs);font-size:13px;outline:none;font-family:inherit}
.search-input:focus{border-color:var(--bl)}
.search-sel{background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:7px 8px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit;outline:none}
/* 모달 */
.mdbg{position:fixed;inset:0;background:#00000099;z-index:200;align-items:center;justify-content:center;display:none}
.mdbg.on{display:flex}
.ac-wrap{position:relative;width:100%}
.ac-input{width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px 10px;border-radius:var(--rs);font-family:inherit;font-size:14px;outline:none;box-sizing:border-box}
.ac-input:focus{border-color:var(--bl);box-shadow:0 0 0 2px rgba(43,108,176,.15)}
.ac-drop{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rs);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:999;max-height:220px;overflow-y:auto;display:none}
.ac-drop.open{display:block}
.ac-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:var(--sf2)}
.ac-item .ac-main{font-weight:700;color:var(--tx)}
.ac-item .ac-sub{font-size:11px;color:var(--mu);margin-left:auto}
.ac-item .ac-badge{font-size:10px;padding:1px 6px;border-radius:10px}
.md{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:20px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.mdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mdh h3{font-size:15px;font-weight:700}.mdc{background:none;border:none;color:var(--mu);cursor:pointer;font-size:22px}
/* 입력+내역 레이아웃 */
.inp-layout{display:grid;grid-template-columns:360px 1fr;gap:12px;align-items:start}
.his-panel{position:sticky;top:86px;max-height:calc(100vh - 98px);overflow-y:auto}
/* misc */
.tr{text-align:right}.tg{color:var(--gn)}.trd{color:var(--rd)}.tb{color:var(--bl)}.ty{color:var(--yw)}.tpu{color:var(--pu)}.tm{color:var(--mu2)}.fw{font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.fx{display:flex}.fxc{align-items:center}.fxb{justify-content:space-between}.g8{gap:8px}.g12{gap:12px}
.ovx{overflow-x:auto}.em{text-align:center;padding:28px;color:var(--mu);font-size:13px}
.ld{text-align:center;padding:40px;color:var(--mu)}
.sp{width:26px;height:26px;border:2px solid var(--bd);border-top-color:var(--bl);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){.inp-layout{grid-template-columns:1fr}.his-panel{position:static;max-height:none}}
@media(max-width:700px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}.fg.c3{grid-template-columns:1fr 1fr}.bud-grid{grid-template-columns:1fr}.cal-day{min-height:54px}}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo">💰 가계부</div>
  <button class="nb on" onclick="go('dash')" id="nb-dash">📊 전체</button>
  <button class="nb" onclick="go('mon')" id="nb-mon">📅 월별</button>
  <button class="nb" onclick="go('inp')" id="nb-inp">✏️ 입력/내역</button>
  <button class="nb" onclick="go('bud')" id="nb-bud">🎯 예산</button>
  <button class="nb" onclick="go('ast')" id="nb-ast">🏦 자산</button>
</nav>
<div class="sbar">
  <div class="si"><div class="sync-dot" id="sync-dot"></div><span id="sync-status">연결 중...</span></div>
  <select id="gYM" onchange="onYM()" style="background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:3px 8px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit;margin-left:8px;min-width:110px"></select>
  <script>
  (function(){
    var now=new Date();
    var sel=document.getElementById('gYM');
    if(!sel)return;
    for(var i=0;i<24;i++){
      var d=new Date(now.getFullYear(),now.getMonth()-i,1);
      var v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      var o=document.createElement('option');
      o.value=v;
      o.textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월';
      if(i===0)o.selected=true;
      sel.appendChild(o);
    }
  })();
  </script>
  <div class="sm">
    <button class="btn bpu2 bsm" onclick="openSetup()">⚙️</button>
    <button class="btn bg2 bsm" onclick="syncNow()">🔄 동기화</button>
    <button class="btn bg2 bsm" onclick="exportJSON()">📤</button>
    <button class="btn bg2 bsm" onclick="document.getElementById('importFile').click()">📥</button>
    <button class="btn bg2 bsm" onclick="document.getElementById('csvFile').click()" title="뱅크샐러드 CSV 가져오기">🏦 CSV</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importBankSalad(event)">
  </div>
</div>
<div class="main">
<div class="pg on" id="pg-dash"><div id="d-dash"><div class="ld"><div class="sp"></div>불러오는 중...</div></div></div>
<div class="pg" id="pg-mon">
  <div class="card">
    <div class="cal-header">
      <button class="cal-nav" onclick="calMove(-1)">&#8249;</button>
      <div style="font-size:16px;font-weight:900" id="cal-title"></div>
      <button class="cal-nav" onclick="calMove(1)">&#8250;</button>
    </div>
    <div class="g4 mb12" id="cal-kpi"></div>
    <div id="cal-grid-wrap">
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div id="cal-detail" style="display:none" class="cal-detail"></div>
  </div>
</div>
<div class="pg" id="pg-inp">
  <div id="inp-dash" class="mb12"></div>
  <div class="inp-layout">
    <div>
      <div class="card">
        <div class="card-title" id="inp-title">✏️ 거래 입력</div>
        <input type="hidden" id="edit-id">
        <div class="mb8">
          <label style="font-size:12px;font-weight:700;color:var(--mu2)">🔍 카테고리 검색</label>
          <div id="ti-ac-wrap" style="position:relative;margin-top:4px">
            <input id="ti-ac" class="ac-input" placeholder="예: 식비, 커피, 주유, 배달..." autocomplete="off">
            <div id="ti-ac-drop" class="ac-drop"></div>
          </div>
        </div>
        <div class="fg c2">
          <div><label>날짜</label><input type="date" id="ti-date"></div>
          <div id="ti-mid-wrap"><label>중분류</label><select id="ti-mid" onchange="onMid()"><option value="">-- 선택 --</option></select></div>
        </div>
        <div class="fg c2">
          <div><label>대분류(자동)</label><input type="text" id="ti-type" readonly style="color:var(--mu2)"></div>
          <div id="ti-sub-wrap"><label>소분류</label><select id="ti-sub"></select></div>
        </div>
        <div class="fg c2">
          <div><label>금액(원)</label><input type="number" id="ti-amt" placeholder="0" min="0"></div>
          <div><label>거래출처</label><select id="ti-pay"></select></div>
        </div>
        <div class="fg c2">
          <div id="ti-evg"><label>지출유형</label><select id="ti-ev"><option value="소비">소비</option><option value="낭비">낭비</option><option value="투자">투자</option></select></div>
          <div><label>메모</label><input type="text" id="ti-memo" placeholder="내용 입력"></div>
        </div>
        <div class="fx g8 mt8">
          <button class="btn bp" onclick="saveTx()" id="ti-btn">💾 저장</button>
          <button class="btn bg2" onclick="resetTx()">🔄 초기화</button>
        </div>
        <div id="ti-res" class="mt8"></div>
      </div>

function makeAcInput(wrap, onSelect){
  // wrap: 기존 select가 있던 컨테이너
  // 검색 input + 드롭다운 생성
  var acWrap=document.createElement('div');acWrap.className='ac-wrap';
  var inp=document.createElement('input');
  inp.className='ac-input';inp.placeholder='검색... (예: 식비, 커피, 주유)';inp.autocomplete='off';
  var drop=document.createElement('div');drop.className='ac-drop';

  var acData=buildAcData();
  var selIdx=-1;

  function renderDrop(kw){
    drop.innerHTML='';selIdx=-1;
    var kw2=kw.trim().toLowerCase();
    var results=kw2?acData.filter(function(d){
      return d.mid.includes(kw2)||d.sub.includes(kw2)||d.type.includes(kw2);
    }):acData.slice(0,20);
    if(!results.length){
      drop.innerHTML='<div class="ac-item"><span style="color:var(--mu)">검색 결과 없음</span></div>';
      drop.classList.add('open');return;
    }
    results.slice(0,30).forEach(function(d,i){
      var item=document.createElement('div');item.className='ac-item';
      item.innerHTML='<span style="font-size:14px">'+(d.subIcon||d.icon||'')+'</span>'
        +'<span class="ac-main">'+(d.subIcon&&d.subIcon!==d.icon?d.sub:d.mid+' / '+d.sub)+'</span>'
        +'<span class="ac-sub ac-badge '+(d.type==='수입'?'bg':d.type==='저축'?'bb':'br')+'">'+d.type+'</span>';
      item.onmousedown=function(e){
        e.preventDefault();
        inp.value=d.mid+' / '+d.sub;
        drop.classList.remove('open');
        onSelect(d);
      };
      drop.appendChild(item);
    });
    drop.classList.add('open');
  }

  inp.oninput=function(){renderDrop(inp.value);};
  inp.onfocus=function(){renderDrop(inp.value);};
  inp.onblur=function(){setTimeout(function(){drop.classList.remove('open');},150);};
  inp.onkeydown=function(e){
    var items=drop.querySelectorAll('.ac-item');
    if(e.key==='ArrowDown'){selIdx=Math.min(selIdx+1,items.length-1);}
    else if(e.key==='ArrowUp'){selIdx=Math.max(selIdx-1,0);}
    else if(e.key==='Enter'&&selIdx>=0){items[selIdx].onmousedown(e);return;}
    else if(e.key==='Escape'){drop.classList.remove('open');return;}
    items.forEach(function(it,i){it.classList.toggle('sel',i===selIdx);});
    if(selIdx>=0)items[selIdx].scrollIntoView({block:'nearest'});
  };

  acWrap.appendChild(inp);acWrap.appendChild(drop);
  wrap.appendChild(acWrap);
  return {inp:inp,drop:drop};
}

function initTxAc(){
  var inp=document.getElementById('ti-ac');
  var drop=document.getElementById('ti-ac-drop');
  if(!inp||!drop)return;

  // 이미 이벤트 등록됐으면 스킵
  if(inp._acInit)return;
  inp._acInit=true;

  var acData=buildAcData();
  var selIdx=-1;

  function renderDrop(kw){
    drop.innerHTML='';selIdx=-1;
    var kw2=(kw||'').trim().toLowerCase();
    var results=kw2
      ?acData.filter(function(d){
          return d.mid.toLowerCase().includes(kw2)||d.sub.toLowerCase().includes(kw2);
        })
      :[];
    if(!results.length){drop.classList.remove('open');return;}
    results.slice(0,25).forEach(function(d,i){
      var item=document.createElement('div');item.className='ac-item';
      item.innerHTML='<span style="font-size:14px">'+(d.subIcon||d.icon||'')+'</span>'
        +'<span class="ac-main">'+d.mid+'</span>'
        +'<span style="color:var(--mu);font-size:12px;margin:0 4px">/</span>'
        +'<span style="font-size:12px;color:var(--tx)">'+d.sub+'</span>'
        +'<span class="ac-sub ac-badge '+(d.type==='수입'?'bg':d.type==='저축'?'bb':'br')+'" style="margin-left:auto">'+d.type+'</span>';
      item.onmousedown=function(e){
        e.preventDefault();
        // 중분류 select 업데이트
        var midSel=document.getElementById('ti-mid');
        if(midSel){midSel.value=d.mid;onMid();}
        // 소분류 select 업데이트 (onMid 후에)
        setTimeout(function(){
          var subSel=document.getElementById('ti-sub');
          if(subSel)subSel.value=d.sub;
        },50);
        // 대분류 업데이트
        var typeSel=document.getElementById('ti-type');
        if(typeSel)typeSel.value=d.type;
        // 지출유형 표시
        var evg=document.getElementById('ti-evg');
        if(evg)evg.style.visibility=(d.type==='지출')?'visible':'hidden';
        // 입력창 표시
        inp.value=d.mid+' / '+d.sub;
        drop.classList.remove('open');
      };
      drop.appendChild(item);
    });
    drop.classList.add('open');
  }

  inp.addEventListener('input',function(){renderDrop(inp.value);});
  inp.addEventListener('focus',function(){if(inp.value)renderDrop(inp.value);});
  inp.addEventListener('blur',function(){setTimeout(function(){drop.classList.remove('open');},150);});
  inp.addEventListener('keydown',function(e){
    var items=drop.querySelectorAll('.ac-item');
    if(!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();selIdx=Math.min(selIdx+1,items.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();selIdx=Math.max(selIdx-1,0);}
    else if(e.key==='Enter'&&selIdx>=0){items[selIdx].onmousedown(e);return;}
    else if(e.key==='Escape'){drop.classList.remove('open');return;}
    items.forEach(function(it,i){it.classList.toggle('sel',i===selIdx);});
    if(selIdx>=0)items[selIdx].scrollIntoView({block:'nearest'});
  });
}

function buildFixed(){
  var today=new Date().toISOString().split('T')[0];
  var ym=gYM();
  var w=document.getElementById('fi-list');
  if(!w)return;

  // ── 이번달 입력된 고정거래 (fi.memo → tx)
  var thisTxs=getTxs(ym).filter(function(t){return t.fixed;});
  // doneMap: 보험료처럼 같은 mid|sub 여러개인 건 memo로, 나머지는 mid|sub만으로
  var doneMap={};
  thisTxs.forEach(function(t){
    var k=t.mid+'|'+t.sub+'|'+(t.memo||'');
    doneMap[k]=t;
    // mid|sub만으로도 저장 (fallback용)
    var k2=t.mid+'|'+t.sub;
    if(!doneMap[k2])doneMap[k2]=t;
  });

  // ── 지난달 고정거래 (예시값용)
  var prevTxs=getTxs(getPrevYM(ym)).filter(function(t){return t.fixed;});
  var prevMap={};
  prevTxs.forEach(function(t){
    var k=t.mid+'|'+t.sub+'|'+(t.memo||'');
    prevMap[k]=t;
    var k2=t.mid+'|'+t.sub;
    if(!prevMap[k2])prevMap[k2]=t;
  });

  // ── 그룹 분류 + 미입력 먼저 정렬
  var grpI=[],grpS=[],grpE=[];
  FX.forEach(function(fi,i){
    var k=fi.mid+'|'+fi.sub+'|'+(fi.memo||'');
    var k2=fi.mid+'|'+fi.sub;
    var sameCount=FX.filter(function(f){return f.mid===fi.mid&&f.sub===fi.sub;}).length;
    // memo 완전일치 우선, 없으면 mid|sub만으로 fallback (단일 항목인 경우)
    var tx=doneMap[k]||(sameCount===1?doneMap[k2]:null)||null;
    var prev=prevMap[k]||(sameCount===1?prevMap[k2]:null)||null;
    var done=!!tx;
    var obj={fi:fi,i:i,done:done,tx:tx,prev:prev};
    if(fi.type==='수입')grpI.push(obj);
    else if(fi.type==='저축')grpS.push(obj);
    else grpE.push(obj);

  function sortGrp(g){return g.sort(function(a,b){return a.done-b.done;});}

    (function(bodyId){memoBtn.onclick=function(){toggleFxi(bodyId);};}('fxi-body-'+i));
    rgt.appendChild(memoBtn);

    // 메모/결제 영역
    var body=document.createElement('div');body.className='fxi-body';body.id='fxi-body-'+i;

    bodyRow.appendChild(memoInp);

  }

function saveSingleFixed(i){
  var fi=FX[i];
  var date=document.getElementById('fx-date-'+i)?document.getElementById('fx-date-'+i).value:'';
  if(!date){showToast('⚠️ 날짜를 선택해주세요.');return;}
  var amt=Number(document.getElementById('fx-amt-'+i)?document.getElementById('fx-amt-'+i).value:'');
  if(!amt){showToast('⚠️ 금액을 입력해주세요.');return;}
  var pay=document.getElementById('fx-pay-'+i)?document.getElementById('fx-pay-'+i).value:fi.pay;
  var type=fi.type||(CATS[fi.mid]?CATS[fi.mid].p:'지출');
  var evalVal=(type==='수입'||type==='저축')?'':(fi.eval||'소비');
  var ym=gYM();

  var key=fi.mid+'|'+fi.sub+'|'+(fi.memo||'');
  var fixedTxs=getTxs(ym).filter(function(t){return t.fixed;});
  var sameInFX=FX.filter(function(f){return f.mid===fi.mid&&f.sub===fi.sub;});
  // memo 완전일치 우선
  var existing=fixedTxs.find(function(t){
    return (t.mid+'|'+t.sub+'|'+(t.memo||''))===key;
  })||null;
  // 없으면 mid|sub만으로 fallback (FX에서 해당 mid|sub가 1개인 경우)
  if(!existing&&sameInFX.length===1){
    existing=fixedTxs.find(function(t){return t.mid===fi.mid&&t.sub===fi.sub;})||null;
  }
  // fallback: mid|sub 같고 FX에서 유일한 항목이면 memo 무시하고 매칭
  if(!existing){
    var sameInFX=FX.filter(function(f){return f.mid===fi.mid&&f.sub===fi.sub;});
    if(sameInFX.length===1){
      existing=fixedTxs.find(function(t){return t.mid===fi.mid&&t.sub===fi.sub;})||null;
    }
  }

  var txData={date:date,mid:fi.mid,sub:fi.sub,type:type,
    amount:amt,memo:fi.memo,payment:pay,eval:evalVal,fixed:true};

  if(existing){
    updateTx(existing.id,txData);
    showToast('✅ '+fi.sub+' 수정 완료!');
  }else{
    addTx(txData);
    showToast('✅ '+fi.sub+' 저장 완료!');
  }
  buildFixed();
  renderHis();
}

  // 기존 거래 찾기: fi.memo(원래 FX 메모) OR 입력창 메모로 찾기
  var txsThisMonth=getTxs(ym);
  var existing=txsThisMonth.find(function(t){
    return t.fixed&&t.mid===mid&&t.sub===sub&&(t.memo||'')===(fi.memo||'');
  })||txsThisMonth.find(function(t){
    return t.fixed&&t.mid===mid&&t.sub===sub&&(t.memo||'')===(memo||'');
  })||null;

  if(existing){
    updateTx(existing.id,{date:date,mid:mid,sub:sub,type:type,amount:amt,memo:memo,payment:pay,eval:evalVal,fixed:true});

function renderMonDetail(ym){
  var txs=getTxs(ym);
  txs.sort(function(a,b){return b.date>a.date?1:-1;});
  if(!txs.length)return '<div class="em" style="padding:16px">거래 데이터가 없어요</div>';
  var incTxs=txs.filter(function(t){return t.type==='수입';});
  var expTxs=txs.filter(function(t){return t.type==='지출';});
  var savTxs=txs.filter(function(t){return t.type==='저축';});
  var incTotal=incTxs.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var expTotal=expTxs.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var savTotal=savTxs.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var EC={'소비':'bgy','낭비':'br','투자':'bpu'};
  var uid='md'+ym.replace('-','');
  function mkRow(t,col){
    var fix=isFixed(t)?'<span class="bk bcy" style="font-size:10px;margin-left:2px">고정</span>':'';
    return'<div class="fx fxb fxc" style="padding:5px 0;border-bottom:1px solid var(--bd)">'
      +'<div class="fx fxc g8"><span class="tm" style="font-size:11px;min-width:42px">'+(t.date||'').slice(5)+'</span>'
      +fix
      +'<span style="font-size:12px">'+(CE[t.mid]||'')+' '+(t.mid||'')+'</span>'
      +'<span class="tm" style="font-size:11px">'+(t.sub||'')+'</span>'
      +'<span class="tm" style="font-size:11px">'+(t.memo||'')+'</span>'
      +(t.eval?'<span class="bk '+(EC[t.eval]||'bgy')+'" style="font-size:10px">'+t.eval+'</span>':'')
      +'</div>'
      +'<span class="fw" style="color:'+col+';font-size:12px;white-space:nowrap">'+ff(t.amount)+'</span>'
      +'</div>';
  }
  var fixExp=expTxs.filter(isFixed);
  var varExp=expTxs.filter(function(t){return!isFixed(t);});
  var fixT=fixExp.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  var varT=varExp.reduce(function(s,t){return s+(Number(t.amount)||0);},0);
  // 카테고리별 지출 집계
  var byMid={};
  expTxs.forEach(function(t){byMid[t.mid]=(byMid[t.mid]||0)+(Number(t.amount)||0);});
  var expRanked=Object.keys(byMid).map(function(k){return{name:k,amt:byMid[k]};})
    .sort(function(a,b){return b.amt-a.amt;});
  var maxAmt=expRanked.length?expRanked[0].amt:1;

  var t1btn='<button class="sec-tab income on" onclick="swMon(this,\''+uid+'-inc\'\')">💚 수입 '+f(incTotal)+'</button>';
  var t2btn='<button class="sec-tab expense" onclick="swMon(this,\''+uid+'-exp\'\')">❤️ 지출 '+f(expTotal)+'</button>';
  var t3btn='<button class="sec-tab saving" onclick="swMon(this,\''+uid+'-sav\'\')">💙 저축 '+f(savTotal)+'</button>';
  return'<div class="sec-tabs">'+t1btn+t2btn+t3btn+'</div>'
    // 수입
    +'<div class="sec-content on" id="'+uid+'-inc" style="padding:10px 14px">'
    +(incTxs.length?incTxs.map(function(t){return mkRow(t,'var(--gn)');}).join(''):'<div class="em" style="padding:10px">없음</div>')
    +'</div>'
    // 지출 (고정/변동 + 카테고리 순위)
    +'<div class="sec-content" id="'+uid+'-exp" style="padding:10px 14px">'
    +'<div class="g2" style="margin-bottom:10px">'
    +'<div><div class="tx-section-title">📌 고정 <span>'+ff(fixT)+'</span></div>'
    +(fixExp.length?fixExp.map(function(t){return mkRow(t,'var(--rd)');}).join(''):'<div class="em" style="padding:6px;font-size:11px">없음</div>')
    +'</div>'
    +'<div><div class="tx-section-title">✏️ 변동 <span>'+ff(varT)+'</span></div>'
    +(varExp.length?varExp.map(function(t){return mkRow(t,'var(--rd)');}).join(''):'<div class="em" style="padding:6px;font-size:11px">없음</div>')
    +'</div></div>'
    +'<div class="tx-section-title" style="margin-top:8px">🏆 카테고리별</div>'
    +expRanked.map(function(x,i){
      var p=Math.round(x.amt/maxAmt*100);
      var c=MC[x.name]||'var(--bl)';
      return'<div class="fx fxc g8" style="padding:4px 0;border-bottom:1px solid var(--bd)">'
        +'<span style="font-size:11px;min-width:16px;color:var(--mu)">'+(i+1)+'</span>'
        +'<span style="font-size:12px;min-width:80px">'+(CE[x.name]||'')+' '+x.name+'</span>'
        +'<div style="flex:1;height:4px;background:var(--sf3);border-radius:2px;overflow:hidden">'
        +'<div style="width:'+p+'%;height:100%;background:'+c+';border-radius:2px"></div></div>'
        +'<span style="font-size:11px;font-weight:700;color:var(--rd);min-width:55px;text-align:right">'+ff(x.amt)+'</span>'
        +'<span style="font-size:10px;color:var(--mu);min-width:35px;text-align:right">'+(expTotal?Math.round(x.amt/expTotal*100)+'%':'')+'</span>'
        +'</div>';
    }).join('')
    +'</div>'
    // 저축
    +'<div class="sec-content" id="'+uid+'-sav" style="padding:10px 14px">'
    +(savTxs.length?savTxs.map(function(t){return mkRow(t,'var(--bl)');}).join(''):'<div class="em" style="padding:10px">없음</div>')
    +'</div>';
}
function swMon(el,secId){
  var tabs=el.parentElement.querySelectorAll('.sec-tab');
  tabs.forEach(function(t){t.classList.remove('on');});
  el.classList.add('on');
  var parent=el.closest('.mon-card-body')||el.parentElement.parentElement;
  parent.querySelectorAll('.sec-content').forEach(function(c){c.classList.remove('on');});
  var target=document.getElementById(secId);
  if(target)target.classList.add('on');
}

function renderBud(){
  var ym=gYM();var bg=getBudget(ym);var sm=getMonthSummary(ym);

    var cat=CATS[m];var bgm=bg[m]||{};

    var actual=sm.byMid[m]||0;
    var pct2=totalBudget>0?Math.min(Math.round(actual/totalBudget*100),999):0;
    var over=totalBudget>0&&pct2>100;
    // 카드
    var card=document.createElement('div');card.className='bud-card';
    // 헤더
    var head=document.createElement('div');head.className='bud-card-head';

    name.textContent=(CE[m]||'')+' '+m+' ';
    if(totalBudget){var badge=document.createElement('span');badge.className='bk '+(over?'br':'bgy');badge.style.fontSize='10px';badge.textContent=pct2+'%';name.appendChild(badge);}
    head.appendChild(name);
    var total=document.createElement('div');total.className='bud-card-total';total.textContent=totalBudget?ff(totalBudget):'미설정';head.appendChild(total);
    card.appendChild(head);

      var prg=document.createElement('div');prg.className='prg mb8';
      var prb=document.createElement('div');prb.className='prb';prb.style.cssText='width:'+Math.min(pct2,100)+'%;background:'+(over?'var(--rd)':'var(--gn)');
      prg.appendChild(prb);card.appendChild(prg);
    }
    // 소분류 행
    cat.s.forEach(function(sub){
      var v=bgm[sub]||'';
      var act=0;
      getTxs(ym).forEach(function(t){if(t.mid===m&&t.sub===sub&&t.type==='지출')act+=Number(t.amount)||0;});
      var row=document.createElement('div');row.className='bud-sub-row';
      var subName=document.createElement('span');subName.className='bud-sub-name';subName.textContent=sub;row.appendChild(subName);
      var actEl=document.createElement('span');actEl.className='bud-sub-actual';if(act)actEl.textContent=ff(act);row.appendChild(actEl);

        inp.onblur=function(){onBud(this,ym2,m2,s2);};

      row.appendChild(inp);card.appendChild(row);

    container.appendChild(card);
  });

function importBankSalad(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var text=ev.target.result;
      // BOM 제거
      if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      var lines=text.split('\n').filter(function(l){return l.trim();});
      if(!lines.length){showToast('❌ 빈 파일이에요.');return;}

      // 헤더 파싱
      var header=lines[0].split(',').map(function(h){return h.trim().replace(/"/g,'');});
      console.log('헤더:', header);

      // 컬럼 인덱스 찾기 (뱅크샐러드 형식)
      function findCol(names){
        for(var i=0;i<names.length;i++){
          var idx=header.findIndex(function(h){return h.includes(names[i]);});
          if(idx>=0)return idx;
        }
        return -1;
      }
      var dateIdx=findCol(['날짜','일자','거래일']);
      var typeIdx=findCol(['수입/지출','타입','구분']);
      var catIdx=findCol(['카테고리','분류']);
      var amtIdx=findCol(['금액','거래금액']);
      var memoIdx=findCol(['내용','적요','가맹점']);
      var payIdx=findCol(['결제수단','계좌','카드']);

      if(dateIdx<0||amtIdx<0){
        showToast('❌ CSV 형식을 인식못했어요. 헤더 확인 필요.');
        console.log('헤더목록:', header);
        return;
      }

      var imported=[];var skipped=0;
      for(var i=1;i<lines.length;i++){
        var cols=lines[i].split(',').map(function(c){return c.trim().replace(/"/g,'');});
        if(cols.length<3)continue;
        var dateRaw=cols[dateIdx]||'';
        var typeRaw=typeIdx>=0?(cols[typeIdx]||''):'지출';
        var catRaw=catIdx>=0?(cols[catIdx]||''):'기타';
        var amtRaw=cols[amtIdx]||'0';
        var memoRaw=memoIdx>=0?(cols[memoIdx]||''):'';
        var payRaw=payIdx>=0?(cols[payIdx]||''):'';

        // 날짜 파싱 (YYYY.MM.DD or YYYY-MM-DD or YYYY/MM/DD)
        var dateStr=dateRaw.replace(/[./]/g,'-').slice(0,10);
        if(dateStr.length!==10||dateStr[4]!=='-'||dateStr[7]!=='-'){skipped++;continue;}

        // 금액 파싱
        var amt=parseInt(amtRaw.replace(/[^0-9]/g,''))||0;
        if(!amt){skipped++;continue;}

        // 타입 판단
        var txType='지출';
        if(typeRaw.includes('수입')||typeRaw.includes('입금'))txType='수입';
        else if(typeRaw.includes('저축')||typeRaw.includes('적금'))txType='저축';

        // 카테고리 매핑
        var mapped=null;
        var catKeys=Object.keys(BS_CAT_MAP);
        for(var k=0;k<catKeys.length;k++){
          if(catRaw.includes(catKeys[k])){mapped=BS_CAT_MAP[catKeys[k]];break;}
        }
        if(!mapped)mapped={mid:txType==='수입'?'수입':'생활',sub:txType==='수입'?'기타수입':'기타생활비'};

        // 수입이면 mid/sub 수입으로
        if(txType==='수입'&&mapped.mid!=='수입'){
          mapped={mid:'수입',sub:'기타수입'};
        }

        imported.push({
          id:mkId(),date:dateStr,type:txType,
          mid:mapped.mid,sub:mapped.sub,
          amount:amt,memo:memoRaw,payment:payRaw,
          eval:txType==='지출'?'소비':'',fixed:false
        });
      }

      if(!imported.length){showToast('❌ 가져올 데이터가 없어요.');return;}

      // 확인 모달 표시
      showBsPreview(imported, skipped);
    }catch(err){
      console.error('CSV 파싱 오류:', err);
      showToast('❌ CSV 파싱 오류: '+err.message);
    }
  };
  reader.readAsText(file,'UTF-8');
  e.target.value='';
}

function confirmBsImport(){
  var txs=window._bsTxs||[];
  if(!txs.length)return;
  var db=loadDB();
  if(!db.txs)db.txs=[];
  // 중복 체크 (같은 날짜+금액+메모)
  var existKeys={};
  db.txs.forEach(function(t){existKeys[t.date+'|'+t.amount+'|'+t.memo]=true;});
  var added=0;
  txs.forEach(function(t){
    var key=t.date+'|'+t.amount+'|'+t.memo;
    if(!existKeys[key]){db.txs.push(t);added++;}
  });
  saveDB(db);
  document.getElementById('bs-preview-md').remove();
  showToast('✅ '+added+'건 가져오기 완료! (중복 '+(txs.length-added)+'건 스킵)');
  if(curPage==='inp'){renderInpDash();renderHis();}
  else if(curPage==='dash')renderDash();
}

function renderAnnual(months){
  // 연간 목표 (함수 내부 선언으로 항상 사용 가능)
  var ANNUAL_INCOME_GOALS=[
    {sub:'레드윗 급여', goal:38890404},{sub:'AZ 급여',goal:18000000},
    {sub:'투자수입',goal:6000000},{sub:'돌보미수입',goal:3600000},
    {sub:'보험금수입',goal:2400000},{sub:'중고거래수입',goal:2300000},{sub:'기타수입',goal:2400000}
  ];
  var ANNUAL_SAVING_GOALS=[
    {sub:'주택청약',goal:1040000},{sub:'ISA',goal:1200000},{sub:'IRP',goal:1500000},
    {sub:'연금저축펀드',goal:2000000},{sub:'종신(KDB)',goal:1203957},
    {sub:'종신(라이나)',goal:1345767},{sub:'대출상환',goal:20400000}
  ];
  var ANNUAL_BUDGET_TOTAL=51472989;
  var db=loadDB();
  var allTxs=(db.txs||[]).filter(function(t){return months.indexOf(t.date.slice(0,7))>=0;});

  // 수입별 현황
  var incMap={};
  allTxs.filter(function(t){return t.type==='수입';}).forEach(function(t){
    incMap[t.sub]=(incMap[t.sub]||0)+(Number(t.amount)||0);
  });
  var totalInc=Object.values(incMap).reduce(function(s,v){return s+v;},0);
  var totalIncGoal=ANNUAL_INCOME_GOALS.reduce(function(s,g){return s+g.goal;},0);

  // 저축별 현황
  var savMap={};
  allTxs.filter(function(t){return t.type==='저축';}).forEach(function(t){
    savMap[t.sub]=(savMap[t.sub]||0)+(Number(t.amount)||0);
  });
  var totalSav=Object.values(savMap).reduce(function(s,v){return s+v;},0);
  var totalSavGoal=ANNUAL_SAVING_GOALS.reduce(function(s,g){return s+g.goal;},0);

  // 지출별 현황
  var expMap={};
  allTxs.filter(function(t){return t.type==='지출';}).forEach(function(t){
    expMap[t.mid]=(expMap[t.mid]||0)+(Number(t.amount)||0);
  });
  var totalExp=Object.values(expMap).reduce(function(s,v){return s+v;},0);
  var expRanked=Object.keys(expMap).map(function(k){return{name:k,amt:expMap[k]};})
    .filter(function(x){return x.amt>0;})
    .sort(function(a,b){return b.amt-a.amt;});

  // 소비/낭비/투자
  var evalMap={소비:0,낭비:0,투자:0};
  allTxs.filter(function(t){return t.type==='지출';}).forEach(function(t){
    if(evalMap[t.eval]!==undefined)evalMap[t.eval]+=(Number(t.amount)||0);
  });
  // 고정/변동
  var fixExp=0,varExp=0;
  allTxs.filter(function(t){return t.type==='지출';}).forEach(function(t){
    if(isFixed(t))fixExp+=(Number(t.amount)||0);
    else varExp+=(Number(t.amount)||0);
  });

  function pctBar(val,goal,color){
    var pct=goal>0?Math.min(Math.round(val/goal*100),999):0;
    var w=Math.min(pct,100);
    var oc=pct>100?'var(--rd)':color;
    return '<div class="prg" style="height:4px;margin-top:3px"><div class="prb" style="width:'+w+'%;background:'+oc+'"></div></div>'
      +'<span style="font-size:10px;color:'+(pct>100?'var(--rd)':oc)+';font-weight:700">'+pct+'%</span>';
  }
  function mkGoalRow(name,val,goal,color){
    var pct=goal>0?Math.min(Math.round(val/goal*100),999):0;
    var oc=pct>100?'var(--rd)':color;
    var w=Math.min(pct,100);
    return '<div style="display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);gap:8px">'
      +'<span style="flex:1;font-size:12px;color:var(--tx)">'+name+'</span>'

      +'<span style="font-size:12px;font-weight:700;color:'+color+';min-width:65px;text-align:right">'+f(val)+'</span>'

      +'<div style="height:4px;background:var(--sf3);border-radius:2px;overflow:hidden">'
      +'<div style="width:'+w+'%;height:100%;background:'+oc+';border-radius:2px"></div></div>'
      +'<span style="font-size:10px;color:'+oc+';font-weight:700">'+pct+'%</span>'
      +'</div>'
      +'</div>';
  }

  var budColor=budPct>100?'var(--rd)':budPct>80?'var(--yw)':'var(--gn)';

  return ''
    // 연간 예산 현황
    +'<div class="card"><div class="card-title">📊 2026년 연간 결산</div>'
    // 총 예산 vs 실적
    +'<div style="background:var(--sf2);border-radius:var(--r);padding:14px;margin-bottom:12px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'

    +'<span style="font-size:18px;font-weight:900;color:'+budColor+'">'+budPct+'%</span>'
    +'</div>'
    +'<div style="display:flex;gap:16px;font-size:12px;margin-bottom:8px">'
    +'<span style="color:var(--mu2)">예산 <strong style="color:var(--tx)">'+ff(ANNUAL_BUDGET_TOTAL)+'</strong></span>'
    +'<span style="color:var(--mu2)">실적 <strong style="color:var(--rd)">'+ff(totalExp)+'</strong></span>'
    +'<span style="color:var(--mu2)">잔액 <strong style="color:'+(ANNUAL_BUDGET_TOTAL-totalExp>=0?'var(--gn)':'var(--rd)')+'">'+ff(ANNUAL_BUDGET_TOTAL-totalExp)+'</strong></span>'
    +'</div>'
    +'<div style="height:10px;background:var(--sf3);border-radius:5px;overflow:hidden">'
    +'<div style="width:'+Math.min(budPct,100)+'%;height:100%;background:'+budColor+';border-radius:5px;transition:width .5s"></div>'
    +'</div>'
    +'</div>'

    // 소비/낭비/투자 + 고정/변동
    +'<div class="g2" style="margin-bottom:12px">'
    +'<div style="background:var(--sf2);border-radius:var(--rs);padding:12px">'
    +'<div style="font-size:11px;font-weight:700;color:var(--mu2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">지출 성격</div>'
    +['소비','낭비','투자'].map(function(k){
      var v=evalMap[k]||0;var pct2=totalExp>0?Math.round(v/totalExp*100):0;
      var c=k==='낭비'?'var(--rd)':k==='투자'?'var(--pu)':'var(--mu2)';
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
        +'<span style="font-size:12px;color:'+c+';font-weight:700;min-width:28px">'+k+'</span>'
        +'<div style="flex:1;height:5px;background:var(--sf3);border-radius:3px;overflow:hidden">'
        +'<div style="width:'+pct2+'%;height:100%;background:'+c+';border-radius:3px"></div></div>'
        +'<span style="font-size:11px;color:'+c+';font-weight:700;min-width:35px">'+pct2+'%</span>'
        +'<span style="font-size:11px;color:var(--mu2);min-width:50px;text-align:right">'+f(v)+'</span>'
        +'</div>';
    }).join('')
    +'</div>'
    +'<div style="background:var(--sf2);border-radius:var(--rs);padding:12px">'
    +'<div style="font-size:11px;font-weight:700;color:var(--mu2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">고정 vs 변동</div>'
    +[{k:'고정',v:fixExp,c:'var(--bl)'},{k:'변동',v:varExp,c:'var(--cy)'}].map(function(x){
      var pct2=totalExp>0?Math.round(x.v/totalExp*100):0;
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
        +'<span style="font-size:12px;color:'+x.c+';font-weight:700;min-width:28px">'+x.k+'</span>'
        +'<div style="flex:1;height:5px;background:var(--sf3);border-radius:3px;overflow:hidden">'
        +'<div style="width:'+pct2+'%;height:100%;background:'+x.c+';border-radius:3px"></div></div>'
        +'<span style="font-size:11px;color:'+x.c+';font-weight:700;min-width:35px">'+pct2+'%</span>'
        +'<span style="font-size:11px;color:var(--mu2);min-width:50px;text-align:right">'+f(x.v)+'</span>'
        +'</div>';
    }).join('')
    +'</div></div>'

    // 수입 목표
    +'<div class="g2">'
    +'<div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--gn);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">'
    +'<span>💰 수입 목표 달성률</span>'
    +'<span style="font-size:11px;color:var(--mu2)">목표 '+f(totalIncGoal)+' / 현황 '+f(totalInc)+'</span>'
    +'</div>'
    +ANNUAL_INCOME_GOALS.map(function(g){
      var v=incMap[g.sub]||0;
      return mkGoalRow(g.sub,v,g.goal,'var(--gn)');
    }).join('')
    +'</div>'
    +'<div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--bl);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">'
    +'<span>🏦 저축 목표 달성률</span>'
    +'<span style="font-size:11px;color:var(--mu2)">목표 '+f(totalSavGoal)+' / 현황 '+f(totalSav)+'</span>'
    +'</div>'
    +ANNUAL_SAVING_GOALS.map(function(g){
      var v=savMap[g.sub]||0;
      return mkGoalRow(g.sub,v,g.goal,'var(--bl)');
    }).join('')
    +'</div></div>'

    // 지출순위 + 예산상세 2컬럼
    +'<div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px">'

    // 왼쪽: 지출 순위
    +'<div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--rd);margin-bottom:8px">🏆 카테고리별 지출 순위</div>'
    +'<table style="width:100%;border-collapse:collapse"><thead><tr>'
    +'<th style="text-align:left;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd);width:28px">순위</th>'
    +'<th style="text-align:left;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">카테고리</th>'
    +'<th style="text-align:right;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">금액</th>'
    +'<th style="text-align:right;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">비중</th>'
    +'<th style="font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd);width:80px">비율</th>'
    +'</tr></thead><tbody>'
    +expRanked.map(function(x,idx){
      var pct2=totalExp>0?(x.amt/totalExp*100).toFixed(1):0;
      var w=Math.min(Math.round(x.amt/expRanked[0].amt*100),100);
      var color=MC[x.name]||'var(--mu)';
      return'<tr>'
        +'<td style="font-size:11px;font-weight:700;color:var(--mu2);padding:5px 6px;border-bottom:1px solid var(--bd)">'+(idx+1)+'</td>'
        +'<td style="font-size:11px;padding:5px 6px;border-bottom:1px solid var(--bd)">'+(CE[x.name]||'')+' '+x.name+'</td>'
        +'<td style="text-align:right;font-weight:700;font-size:11px;color:var(--rd);padding:5px 6px;border-bottom:1px solid var(--bd)">'+ff(x.amt)+'</td>'
        +'<td style="text-align:right;font-size:11px;color:var(--mu2);padding:5px 6px;border-bottom:1px solid var(--bd)">'+pct2+'%</td>'
        +'<td style="padding:5px 6px;border-bottom:1px solid var(--bd)">'
        +'<div style="height:4px;background:var(--sf3);border-radius:2px;overflow:hidden">'
        +'<div style="width:'+w+'%;height:100%;background:'+color+';border-radius:2px"></div></div></td>'
        +'</tr>';
    }).join('')
    +'</tbody></table>'
    +'</div>'

    // 오른쪽: 예산 vs 실적
    +'<div>'
    +'<div style="font-size:12px;font-weight:700;color:var(--yw);margin-bottom:8px">📋 카테고리별 예산 vs 실적</div>'
    +'<table style="width:100%;border-collapse:collapse"><thead><tr>'
    +'<th style="text-align:left;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">카테고리</th>'
    +'<th style="text-align:right;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">예산</th>'
    +'<th style="text-align:right;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">실적</th>'
    +'<th style="text-align:right;font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd)">잔액</th>'
    +'<th style="font-size:11px;color:var(--mu);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--bd);width:70px">사용률</th>'
    +'</tr></thead><tbody>'
    +function(){
      var budgets=[
        {name:'식비',budget:2880000},{name:'생활',budget:780000},{name:'꾸밈',budget:1200000},
        {name:'교통',budget:600000},{name:'자동차',budget:22838213},{name:'주거',budget:4383000},
        {name:'통신',budget:536800},{name:'건강',budget:720000},{name:'금융지출',budget:3666208},
        {name:'문화여가',budget:452800},{name:'교육',budget:360000},{name:'유흥',budget:7460000},
        {name:'반려동물',budget:710532},{name:'경조선물',budget:2593160},{name:'여행',budget:1200000},
        {name:'업무지출',budget:1092276}
      ];
      return budgets.map(function(b){
        var actual=expMap[b.name]||0;
        var pct=b.budget>0?Math.min(Math.round(actual/b.budget*100),999):0;
        var remain=b.budget-actual;
        var color=pct>100?'var(--rd)':pct>80?'var(--yw)':'var(--gn)';
        var w=Math.min(pct,100);
        return'<tr>'
          +'<td style="font-size:11px;padding:5px 6px;border-bottom:1px solid var(--bd)">'+(CE[b.name]||'')+' '+b.name+'</td>'
          +'<td style="text-align:right;font-size:11px;color:var(--mu2);padding:5px 6px;border-bottom:1px solid var(--bd)">'+ff(b.budget)+'</td>'
          +'<td style="text-align:right;font-weight:700;font-size:11px;color:var(--rd);padding:5px 6px;border-bottom:1px solid var(--bd)">'+ff(actual)+'</td>'
          +'<td style="text-align:right;font-size:11px;padding:5px 6px;border-bottom:1px solid var(--bd);color:'+(remain>=0?'var(--gn)':'var(--rd)')+'">'+ff(remain)+'</td>'
          +'<td style="padding:5px 6px;border-bottom:1px solid var(--bd)">'
          +'<div style="display:flex;align-items:center;gap:3px">'
          +'<div style="flex:1;height:4px;background:var(--sf3);border-radius:2px;overflow:hidden">'
          +'<div style="width:'+w+'%;height:100%;background:'+color+';border-radius:2px"></div></div>'
          +'<span style="font-size:10px;font-weight:700;color:'+color+';min-width:28px">'+pct+'%</span>'
          +'</div></td>'
          +'</tr>';
      }).join('');
    }()
    +'</tbody></table>'
    +'</div>'

    +'</div>'

    +'</div>';
}

function openAddFx(){
  var md=document.createElement('div');
  md.className='mdbg on';
  md.id='add-fx-md';
  md.innerHTML='<div class="md">'
    +'<div class="mdh"><h3>➕ 고정 거래 추가</h3><button class="mdc" onclick="document.getElementById(\'add-fx-md\').remove()">✕</button></div>'
    +'<div class="fg c2">'
    +'<div><label>대분류</label><select id="afx-type" onchange="onAfxType()" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit">'
    +'<option value="수입">수입</option><option value="저축">저축</option><option value="지출" selected>지출</option>'
    +'</select></div>'
    +'<div><label>중분류</label><select id="afx-mid" onchange="onAfxMid()" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit"></select></div>'
    +'</div>'
    +'<div class="fg c2">'
    +'<div><label>소분류</label><select id="afx-sub" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit"></select></div>'
    +'<div><label>기본금액</label><input type="number" id="afx-amt" min="0" placeholder="0" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit"></div>'
    +'</div>'
    +'<div class="fg c2">'
    +'<div><label>결제수단</label><select id="afx-pay" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit">'
    +['현금','하나카드(신)','신한카드(신)','롯데카드(신)','현대카드(신)','토스카드(체)'].map(function(p){return'<option>'+p+'</option>';}).join('')
    +'</select></div>'
    +'<div><label>지출유형</label><select id="afx-eval" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit">'
    +'<option value="소비">소비</option><option value="낭비">낭비</option><option value="투자">투자</option>'
    +'</select></div>'
    +'</div>'
    +'<div class="fg"><label>메모</label><input type="text" id="afx-memo" placeholder="메모" style="width:100%;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:8px;border-radius:var(--rs);font-family:inherit"></div>'
    +'<div class="fx g8 mt8">'
    +'<button class="btn bp" onclick="confirmAddFx()">💾 추가</button>'
    +'<button class="btn bg2" onclick="document.getElementById(\'add-fx-md\').remove()">취소</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(md);
  onAfxType();
}
function onAfxType(){
  var type=document.getElementById('afx-type').value;
  var midSel=document.getElementById('afx-mid');
  midSel.innerHTML='';
  Object.keys(CATS).filter(function(m){return CATS[m].p===type;}).forEach(function(m){
    var o=document.createElement('option');o.value=o.textContent=m;midSel.appendChild(o);
  });
  onAfxMid();
}
function onAfxMid(){
  var m=document.getElementById('afx-mid').value;
  var ss=document.getElementById('afx-sub');ss.innerHTML='';
  if(CATS[m])CATS[m].s.forEach(function(s){var o=document.createElement('option');o.value=o.textContent=s;ss.appendChild(o);});
}
function confirmAddFx(){
  var type=document.getElementById('afx-type').value;
  var mid=document.getElementById('afx-mid').value;
  var sub=document.getElementById('afx-sub').value;
  var amt=Number(document.getElementById('afx-amt').value)||0;
  var pay=document.getElementById('afx-pay').value;
  var memo=document.getElementById('afx-memo').value;
  var eval2=(type==='수입'||type==='저축')?'':document.getElementById('afx-eval').value;
  if(!mid||!sub){showToast('⚠️ 카테고리를 선택해주세요.');return;}
  addFxItem({type:type,mid:mid,sub:sub,memo:memo,amt:amt,pay:pay,eval:eval2});
  document.getElementById('add-fx-md').remove();
  buildFixed();
  showToast('✅ 고정 항목 추가됐어요!');
}
function deleteFxItem(i){
  if(!confirm('이 고정 항목을 삭제할까요?'))return;
  removeFxItem(i);
  buildFixed();
  showToast('🗑️ 삭제됐어요.');
}

</script>
</body>
</html>
